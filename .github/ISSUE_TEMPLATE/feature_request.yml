name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement", "待讨论"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 先说问题，别直接说方案。「希望能加个 X」是方案，「现在 X 场景下很费劲」是问题。
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: 哪个场景下遇到
      options:
        - 赛前准备（赛项配置 / 赛台赛程 / 报名 / 裁判排班）
        - 赛中（打分 / 榜单 / 大屏 / 处置）
        - 赛后与合规（锁定发布 / 留底 / 审计）
        - 多赛事并行（跨场次管理）
        - 工程与开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 可以是界面草图、口头描述，甚至模糊的想法都欢迎
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过其他方案吗
      description: 有没有更省事的替代路径

  - type: dropdown
    id: scope
    attributes:
      label: 这会影响哪些部分
      multiple: true
      options:
        - 后台管理 demo
        - 裁判端 wireframe
        - Go 后端
        - 前端与后端的接口约定
        - 暂不确定

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认提交的内容不含任何真实赛事数据或真实个人信息
          required: true
