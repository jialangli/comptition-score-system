name: Bug 报告

description: 报告一个可复现的问题
labels: ["bug", "需要复现"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 描述你看到的行为。写「实际结果」而不是「应该是」。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望什么
      description: 如果这不是缺陷（是功能建议或疑问），请改用其他模板。
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 问题出在哪一端
      options:
        - 后台管理 demo（赛事统分后台管理_demo.html）
        - 裁判端 wireframe（裁判打分系统_wireframe.html）
        - Go 后端 / API
        - 文档（README / ARCHITECTURE / PROGRESS）
        - 工程环境（构建、测试、脚本）
        - 不确定
    validations:
      required: true

  - type: input
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面到出问题的完整路径
      placeholder: |
        1. 打开「赛事管理」页
        2. 点「新建赛事」
        3. 勾选「脑机星球」后点创建
        4. 出现 ……

  - type: textarea
    id: actual-detail
    attributes:
      label: 控制台报错（如有）
      description: 浏览器控制台或 `go test` 的输出，原样粘贴即可

  - type: input
    id: env-browser
    attributes:
      label: 浏览器 / 系统
      value: Chrome / Windows 11
    validations:
      required: false

  - type: input
    id: env-go
    attributes:
      label: Go 版本（如涉及后端）
      placeholder: go1.25.0

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认提交的内容不含任何真实赛事数据或真实个人信息
          required: true
        - label: 我已在最新版 `main` 上复现过
          required: false
