<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainCo 赛事统分后台管理 · Demo</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#e4e8ee;--txt:#1b2027;--muted:#6b7280;
  --brand:#185FA5;--brand-d:#124a80;--ok:#2f6b0f;--warn:#9a6410;--err:#a32d2d;
  --okbg:#eaf3de;--warnbg:#faeeda;--errbg:#fcebeb;--soft:#f7f9fc;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
.side{width:228px;flex:0 0 228px;background:#0e1a2b;color:#c7d3e3;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid #1e2f47;margin-bottom:14px}
.brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2f7fd1,#5b4bc4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 30px}
.brand b{display:block;color:#fff;font-size:14px;line-height:1.3}
.brand span{font-size:11.5px;color:#7d8ea6}
.ngroup{font-size:11px;color:#61728c;letter-spacing:.06em;padding:12px 8px 6px}
.ni{display:block;padding:9px 12px;border-radius:8px;color:#c7d3e3;cursor:pointer;margin-bottom:3px;font-size:13.5px;user-select:none}
.ni:hover{background:#182a42;color:#fff}
.ni.on{background:#1b63ab;color:#fff;font-weight:500}
/* 本期暂不做的入口：置灰不可点（.ni.off 必须同时覆盖 :hover，否则鼠标划过仍会变亮） */
.ni.off{color:#5b6b7e;cursor:not-allowed}
.ni.off:hover{background:transparent;color:#5b6b7e}
.nib{float:right;margin-top:2px;font-size:10px;line-height:14px;color:#7b8ea3;border:1px solid #2b3f57;border-radius:4px;padding:0 5px}
/* 分段切换（打分页轮次 / 大屏模式）：.seg 是无定义类，本轮补齐 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg span{padding:3px 10px;font-size:13px;cursor:pointer;border-left:1px solid var(--line);line-height:1.5}
.seg span:first-child{border-left:none}
.seg span.on{background:var(--brand);color:#fff;font-weight:500}
/* 锁定态：与 .ni.off 同理，必须同时覆盖 :hover，否则鼠标划过仍变亮 */
.seg span.off{opacity:.5;cursor:not-allowed}
.seg span.off:hover{background:transparent;color:inherit}
.side .foot{margin-top:18px;padding:10px 12px;border-radius:8px;background:#132339;font-size:11.5px;color:#7d8ea6;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:8;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:#eef4fb;color:#1c5288;border:1px solid #d8e6f5}
.pill i{width:7px;height:7px;border-radius:50%;background:#3fae5a;display:inline-block}
.wrap{padding:20px 22px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g12{grid-template-columns:260px minmax(0,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lb{font-size:12.5px;color:var(--muted)}
.kpi .nm{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.kpi .ft{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfcfe}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--txt)}
.btn:hover{border-color:#c3ccd8}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--err);border-color:#f0c9c9}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--txt)}
/* 只读值：长得像输入框，但不给点、也不给改 —— 用于「本赛制只有一种」的配置项 */
.ro{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#f4f6f8;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid #cfe2f6;border-color:var(--brand)}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
input[type=range]{padding:0;border:none;background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#eef2f7;color:#4a5768}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:var(--err)}
.tag.b{background:#e8f1fb;color:#1c5288}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li:last-child{border-bottom:none}
.li:hover{background:var(--soft)}
.li.on{background:#eaf2fb;border-left:3px solid var(--brand);padding-left:9px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.note{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#41506a;line-height:1.7}
.drop{display:block;border:2px dashed #c3ccd8;border-radius:12px;padding:26px 20px;text-align:center;cursor:pointer;background:#fbfcfe}
.drop:hover{border-color:var(--brand);background:#f4f9fe}
.drop b{display:block;font-size:14px;color:var(--brand);margin-bottom:4px}
.drop span{font-size:12.5px;color:var(--muted)}
.slot{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:96px;cursor:pointer}
.slot:hover{border-color:#a9c6e6}
.slot.sel{border-color:var(--brand);box-shadow:0 0 0 2px #d9e8f7}
.slot.extra{border-color:#f0c9a0;background:#fffaf3}
.slot.empty{border:1px dashed #c3ccd8;background:#fbfcfe;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;min-height:96px}
.slot.empty:hover{border-color:var(--brand);color:var(--brand)}
.screen-box{background:#0d1b2a;border-radius:12px;padding:16px 20px;color:#e8eef6}
.screen-box .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #22384f;padding-bottom:9px;margin-bottom:10px;font-size:13px}
.screen-box .hd b{font-size:15px;color:#fff}
.screen-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed #1d3145;font-size:13.5px}
.screen-row:last-child{border-bottom:none}
.screen-row .rk{width:32px;text-align:center;font-weight:700;color:#8fd0ff}
.screen-row .tm{flex:1.4;font-weight:600;color:#fff}
.screen-row .sc{flex:2.4;color:#a9bed4;font-size:12.5px}
.screen-row .aw{flex:0.9;text-align:right;color:#ffd479;font-size:12.5px}
.screen-foot{text-align:center;font-size:11.5px;color:#6d8399;padding-top:9px;border-top:1px solid #1d3145;margin-top:8px}
.range{display:flex;align-items:center;gap:10px}
.range b{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.thumb{text-align:center;font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between}
.vres{margin-top:10px;font-size:12.5px;line-height:1.8}
.vres .e{color:var(--err)}
.vres .w{color:var(--warn)}
.vres .k{color:var(--ok)}

hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.pub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.pub h3{margin:0 0 4px;font-size:17px;text-align:center;font-weight:600}
.pub .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px}
.dd{position:relative;display:inline-block;min-width:240px;z-index:60}
.dd-sum{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:#222}
.dd-sum:hover{border-color:#bbb}
.dd .caret{color:#888;font-size:11px;flex:none}
.dd-backdrop{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,0)}
.dd-body{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:56;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column;gap:2px}
.dd-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.dd-opt:hover{background:#f4f7fb}
.dd-opt input{margin:0;width:15px;height:15px;accent-color:var(--ok)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g12,.g2,.g3{grid-template-columns:1fr}}
/* 苹果风格滑动开关：用于「黄牌计数器」这类「开 / 关」型配置项。
   关闭即整块规则停用，所以控件本身要能一眼看出状态，而不是靠文字描述。 */
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none;vertical-align:middle;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;left:0;right:0;top:0;bottom:0;background:#cbd5e0;border-radius:13px;transition:background .18s}
.sw i:before{content:'';position:absolute;width:22px;height:22px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i:before{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BrainCo 赛事统分后台管理 · 单文件 Demo
   参考开源：SRComp(compstate 配置治理/榜单)、CodaLab(competition.yaml 声明式赛项)、
             ICPC CCS(contest.json + 实时 standings)、The Purple Standard(任务原语)
   数据模型对齐：赛事统分系统_配置Schema_v1.json / 三赛项种子数据.json
   ============================================================ */
var KEY='brainco_scoring_admin_v1';
/* ---------- 赛事（场次）索引 ----------
   口径：「赛事」= 一次具体举办（如「2026 WRC 中国区总决赛 · 杭州」）；
         「赛项」= 赛事内的比赛项目（脑机星球 / 火星救援 / 未来之城），见 S.events。
   过去只有「赛项」这一层，全站数据是单场赛事的扁平库；
   现在每场赛事拥有独立数据空间（独立 localStorage key），队伍 / 成绩 / 规则 / 锁 /
   工单 / 留底 / 审计 / 裁判码 全部按赛事隔离，切换赛事 = 切换整套数据。 */
var CKEY='brainco_contests_v1';   /* 赛事索引（唯一一份，跨赛事共享） */
var CONTESTS=[];                  /* [{id,name,season,start,end,venue,host,status,createdAt,updatedAt,archivedAt,note}] */
var CUR_CONTEST='';               /* 当前赛事 id */
var CONTEST_STATUS={prep:'筹备中',live:'进行中',done:'已结束',archived:'已归档'};
/* 「当前赛事」按**标签**独立存 sessionStorage：
   两地同时办赛时，总部一台电脑开多个标签，各自守自己那场，互不带走。
   索引里的 cur 只作为「新标签的默认起点」。 */
var CKEY_CUR='brainco_contests_cur_tab';
var REF_TIME=120;                 /* 时间奖励基准时长的**全局兜底**（秒）：优先取赛项总时间 eventTotalSec(ev)，没配才用它 */
/* ---------- 赛项总时间（整场倒计时总长）· 时间奖励明细 ----------
   这两个是**不同的东西**，别混：
     · 赛项总时间 —— 这场比赛给队伍的总时长（裁判端 appbar 的「/ 总 03:45」，整场倒计时）
     · 时间奖励   —— 奖励时间 = 赛项总时间 − 本队实际用时（省下来的秒数），
                     再按「每 1 秒几分」折算成加分（例：总 60 秒、用时 50 秒 → 奖励时间 10 秒）

   赛项总时间取值优先级：
     Σ 阶段时长（多阶段赛项，见「赛项与规则配置」的阶段表）
     → ev.scoreRule.params.refTime（单阶段 / 无阶段赛项直接填的值；后端引擎读的也是这个字段）
     → 全局兜底 REF_TIME。 */
function eventTotalSec(ev){
  var ps=(ev&&ev.phases)||[],i,s=0;
  for(i=0;i<ps.length;i++){s+=Number(ps[i].durationSec)||0;}
  if(ps.length&&s>0)return s;
  var v=(ev&&ev.scoreRule&&ev.scoreRule.params)?ev.scoreRule.params.refTime:null;
  if(v!=null&&v!==''){v=Number(v);if(v>0)return v;}
  return REF_TIME;
}
/* 单阶段 / 无阶段赛项：直接填的「赛项总时间」写进 params.refTime（后端引擎同字段，口径一致）。
   只有一个阶段时，改的其实是那一段的时长 —— 不制造第二个真相。 */
function setEventTotalSec(sec){
  var ev=find(CUR_EVENT);if(!ev)return;
  var ps=ev.phases||[],v=Number(sec)||0;
  if(v<=0)return;
  if(ps.length>=2)return;                 /* 多阶段：总时间 = Σ阶段时长，界面上是只读的 */
  if(ps.length===1){ps[0].durationSec=v;syncEventTotal(ev);}
  else{ev.scoreRule=ev.scoreRule||{template:'sum',params:{}};ev.scoreRule.params=ev.scoreRule.params||{};ev.scoreRule.params.refTime=v;}
  save();   /* 不 render：输入框正在打字，重渲染会丢焦点（与 updPhase 同一考虑） */
}
/* 有阶段时把 Σ 阶段时长镜像进 params.refTime：后端引擎只认这个字段，
   不镜像就会出现「前端按 03:45 算、后端按旧的 120 算」的口径漂移。 */
function syncEventTotal(ev){
  if(!ev)return;
  var ps=ev.phases||[],i,s=0;
  for(i=0;i<ps.length;i++){s+=Number(ps[i].durationSec)||0;}
  if(!ps.length||s<=0)return;
  ev.scoreRule=ev.scoreRule||{template:'sum',params:{}};
  ev.scoreRule.params=ev.scoreRule.params||{};
  ev.scoreRule.params.refTime=s;
}
/* 时间奖励明细：奖励时间（秒）= 赛项总时间 − 本队用时；再按每 1 秒几分折算，封顶后就是本项加分。 */
function timeBonusInfo(ev,rec){
  var all=(ev&&ev.bonusRules)||[],i,tb=null;
  for(i=0;i<all.length;i++){if(all[i].template==='time_bonus'){tb=all[i];break;}}
  var p=(tb&&tb.params)||{};
  var total=eventTotalSec(ev);
  var used=Number(rec&&rec.time)||0;
  var reward=used>0?Math.max(0,total-used):0;
  var raw=reward*(Number(p.perSecond)||0);
  return {has:!!tb,total:total,used:used,reward:reward,
          perSecond:p.perSecond,cap:p.cap,
          score:(p.cap!=null?Math.min(raw,Number(p.cap)):raw)};
}
/* 秒 → mm:ss（总时间 / 用时都用它显示，避免各处各写一份格式化） */
function mmss(sec){
  sec=Math.max(0,Math.round(Number(sec)||0));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

var VIEW='dash';
var CUR_EVENT='brain_planet';     // 赛项与规则页当前编辑赛项
var SCORE_EVENT='brain_planet';   // 裁判打分页当前赛项
var CUR_TEAM=null;                // 打分页当前队伍
var SCORE_ROUND=1;                // 打分页当前轮次（两轮制：一队打两轮）
var RANK_EVENT='brain_planet';    // 榜单页当前赛项
var PUB_EVENT='brain_planet';     // 公示页当前赛项
var PUB_ANON=false;
var SCORE_ENTRY_ROLE='sync';      // 后台录入身份：ops=工作人员代录 / sync=现场回传（平板）；默认按现场回传记账，手工代录需手动切换

/* 本机偏好存储键（后台需联网使用：不做离线兜底、不做后端双模式） */
var STORE_KEY='brainco_backend_v1';   // 沿用旧键名，保留已保存的录入身份偏好
function loadEntryRole(){try{var v=localStorage.getItem(STORE_KEY+'_entryrole_v2');if(v==='ops'||v==='sync')SCORE_ENTRY_ROLE=v;}catch(e){}}
function saveEntryRole(){try{localStorage.setItem(STORE_KEY+'_entryrole_v2',SCORE_ENTRY_ROLE);}catch(e){}}
loadEntryRole();

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(p){return p+Math.random().toString(36).slice(2,7);}
function download(name,text,mime){
  var b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
}
function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

/* ---------- 零依赖 .xlsx 写出（store ZIP + inlineStr；CRC32 正确，可被本页自带 xlsxReader 回读） ---------- */
function xlsxEscapeXml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
function xlsxColName(idx){var s='';idx++;while(idx>0){s=String.fromCharCode(65+((idx-1)%26))+s;idx=Math.floor((idx-1)/26);}return s;}
function xlsxCrc32(buf){var c=~0>>>0;for(var i=0;i<buf.length;i++){c^=buf[i];for(var k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1));}return (~c)>>>0;}
function xlsxZipStore(files){
  var enc=new TextEncoder();var parts=[];var central=[];var off=0;
  files.forEach(function(f){
    var data=enc.encode(f.data);var nb=enc.encode(f.name);var crc=xlsxCrc32(data);
    var lh=new Uint8Array(30+nb.length);var dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);

function removedKey(){return CKEY+'_removed';}
function loadTomb(){try{var r=localStorage.getItem(removedKey());if(r){var a=JSON.parse(r);if(a&&a.length)return a;}}catch(e){}return [];}
function addTomb(id){var t=loadTomb();if(t.indexOf(id)<0){t.push(id);try{localStorage.setItem(removedKey(),JSON.stringify(t));}catch(e){}}}

/* 合并式写入：先读盘上最新索引，按 id 合并后再写回。
   原实现是「整份覆盖」，实测两地同时办赛时会出事故：
   A 场地新建的赛事，被 B 场地一次普通保存（内存里还是旧索引）整份覆盖 → 赛事从索引消失（数据成孤儿）。
   合并规则：盘上有而本标签没有的 → 收编（别的标签新建的）；同 id → updatedAt 更新的赢。 */
function saveContests(){
  var diskList=[];
  try{var raw=localStorage.getItem(CKEY);if(raw){var d=JSON.parse(raw);diskList=(d&&d.list)||[];}}catch(e){}
  var tomb=loadTomb(),mem={};
  CONTESTS.forEach(function(c){if(c&&c.id)mem[c.id]=c;});
  var out=[],seen={};
  function push(c){if(!c||!c.id)return;if(tomb.indexOf(c.id)>=0)return;if(seen[c.id])return;seen[c.id]=1;out.push(c);}
  function pick(a,b){if(!a)return b;if(!b)return a;return ((b.updatedAt||'')>(a.updatedAt||''))?b:a;}
  diskList.forEach(function(c){push(pick(mem[c.id],c));});
  CONTESTS.forEach(push);
  if(!out.length)out=CONTESTS.slice();
  CONTESTS=out;
  try{localStorage.setItem(CKEY,JSON.stringify({cur:CUR_CONTEST,list:CONTESTS}));}catch(e){}
}

   不另写一套算分（两套算法迟早会漂移）。 */
function withContestData(cid,fn){
  var raw=null;try{raw=localStorage.getItem(ckey(cid));}catch(e){}
  if(!raw)return null;
  var keepS=S,keepCur=CUR_CONTEST;

  try{return fn(S);}finally{S=keepS;CUR_CONTEST=keepCur;}
}

function patchContestData(cid,fn){
  var raw=null;try{raw=localStorage.getItem(ckey(cid));}catch(e){}
  if(!raw)return null;
  var d=JSON.parse(raw);
  var r=fn(d);
  try{localStorage.setItem(ckey(cid),JSON.stringify(d));}catch(e){}
  return r;
}

function writeContest(cid,fn){

/* 老数据兼容：补齐 V1.1 新增字段（裁判档案 / 轮次 / 分台顺位），避免旧缓存缺字段导致新视图报错 */
function migrate(d){
  d.referees=d.referees||[];
  d.auditLogs=d.auditLogs||[];
  d.importLogs=d.importLogs||[];
  d.published=d.published||{};
  d.pubDirty=d.pubDirty||{};
  /* v4 迁移：发布流转（裁判长移交 → 工作人员发布 → 回流裁判长端） */
  d.handoff=d.handoff||{};
  if(Object.keys(d.handoff).length===0){
    d.handoff={
      brain_planet:{by:'张老师',at:'2026-09-17 13:05',note:'完整性校验后移交发布',status:'待发布',publishedAt:'',publishedBy:''},
      mars_rescue:{by:'张老师',at:'2026-09-17 11:18',note:'赛前冻结后移交发布',status:'已发布',publishedAt:'2026-09-17 11:20',publishedBy:'赵工作人员'}
    };
  }
  d.alerts=d.alerts||[];
  if((d.unlockAlerts||[]).length&&!d.alerts.length){
    d.alerts=d.unlockAlerts.map(function(a){return {id:uid('al'),ts:a.ts,type:'解锁',level:'warn',target:a.target,
      detail:(a.kind||'锁')+'被解锁',reason:a.reason||'',by:a.by||'',push:a.push||'后台',
      status:a.reviewed?'已处理':'待处理',handledBy:'',handledAt:''};});
  }
  delete d.unlockAlerts;
  d.changeRequests=d.changeRequests||[];
  d.disputes=d.disputes||[];
  d.dqCases=d.dqCases||[];
  d.substituteRule=d.substituteRule||{mode:'none',note:''};
  d.evidence=d.evidence||[];
  /* v3 迁移：本系统收敛为「单一登录身份 = 工作人员（享有全部权限）」。
     存量缓存里的多角色账号、历史留痕里的旧角色与旧称呼一并归一 ——
     否则页面会出现系统里已不存在的角色名（运营 / 赛事总监 / 审计）。 */
  if((d.schemaV||1)<3){
    (d.auditLogs||[]).forEach(function(l){l.role='staff';l.operator='赵工作人员';});
    (d.alerts||[]).forEach(function(a){a.push='后台';});
  }
  d.users=[{id:'u1',name:'赵工作人员',role:'staff'}];
  d.currentUserId='u1';
  d.schemaV=3;
  if(!d.chiefReferee)d.chiefReferee='';
  d.unlockAlerts=d.unlockAlerts||[];
  (d.events||[]).forEach(function(e){if(e.configSN==null)e.configSN=1;if(e.ruleDoc==null)e.ruleDoc='—';});
  /* v8 迁移：成绩升级为**按轮存储** —— d.scores[teamId] = {1:{…}, 2:{…}}。
     老结构是扁平的（一队一条记录），一律归到**第 1 轮**（不丢数据）；顺手补 state。 */
  Object.keys(d.scores||{}).forEach(function(k){
    var sc=d.scores[k];if(!sc)return;
    if(isFlatRec(sc)){sc={1:sc};d.scores[k]=sc;}
    Object.keys(sc).forEach(function(r){
      var rec=sc[r];
      if(rec&&!rec.state)rec.state=(rec.signed?'submitted':'draft');
    });
  });
  Object.keys(d.published).forEach(function(k){
    if(d.published[k]===true)d.published[k]={at:'（历史数据）',count:1};
  });
  (d.events||[]).forEach(function(e){if(e.rounds==null)e.rounds=1;});
  (d.slots||[]).forEach(function(x){
    if(x.round==null)x.round=1;
    if(x.judges==null)x.judges=[];
    if(x.chief==null)x.chief='';
  });
  (d.teams||[]).forEach(function(t){if(t.seatId==null)t.seatId='';if(t.order==null)t.order=0;});
  /* v4 迁移：导入记录升级为「导入任务」（可筛 / 可导出 / 可撤回）。
     旧 importLogs 一律转过去并标 legacy —— 那时没有回滚快照，撤回按钮会拒绝。 */
  if(!d.importTasks){
    d.importTasks=(d.importLogs||[]).map(function(l,i){
      return {id:'it_legacy_'+i,ts:l.ts,operator:l.operator,source:l.source,
        fileName:'（升级前的历史记录）',summary:l.summary||{insert:0,update:0,skip:0,conflict:0},
        status:(l.status==='success'?'done':'partial'),detail:l.detail||[],
        affectedScores:0,snapshot:null,legacy:true};
    });
  }
  d.importLogs=[];
  /* v5 迁移：两个「只有一种取值」的字段归一到唯一值 ——
     计分规则 → sum（直接求和）；判罚模板 → record_only（仅记录不扣分）。
     本赛制只有这两种（界面已只读显示它们），存量缓存里若还留着历史值
     （计分规则 weighted_sum / average；判罚模板 per_card / none），
     就会出现"界面显示 A、实际按 B 算分"。这里在读入时归一，
     与后端迁移 0012 / 0013 同口径（那边改库、这边改缓存）。
     判据是"值不等于唯一值才改" → 天然幂等，不需要额外版本号。 */
  (d.events||[]).forEach(function(e){
    if(!e.scoreRule)e.scoreRule={template:'sum',params:{}};
    if(e.scoreRule.template!=='sum')e.scoreRule.template='sum';
    if(!e.penaltyRule)e.penaltyRule={template:'record_only',params:{}};
    if(e.penaltyRule.template!=='record_only')e.penaltyRule.template='record_only';
  });
  /* v6 迁移：正式场次的队伍改为**派生**后（见 slotTeams），把历史 `slot.teams` 反推成
     队伍级归台 —— 归台 = 赛台(seatId) + 台内顺位(order) + 参赛轮次(session)。
     不翻译就会丢台：老缓存里队伍只在场次里出现，派生后它会"排不进任何场次"。
     判据全是"缺了才补" → 幂等，跑几次结果一样。 */
  (function(){
    /* 0、先把场次轮次与时段对齐：2 轮赛项上午=第 1 轮、下午=第 2 轮（口径已绑定）。
          老缓存里 round 是"恒为 1"的默认值，不校正就会出现"下午场次却是第 1 轮"的自相矛盾，
          后面的归台反推也会把两段都当成第 1 轮。 */
    (d.slots||[]).forEach(function(sl){
      var ev=null;(d.events||[]).forEach(function(e){if(e.id===sl.eventId)ev=e;});
      if(!ev||Number(ev.rounds||1)<2)return;
      if(isExtraSlot(sl))return;
      var want=(sl.period==='下午')?2:1;
      if(Number(sl.round||1)!==want)sl.round=want;
    });
    var seatOf={},sessOf={};
    (d.slots||[]).forEach(function(sl){
      if(isExtraSlot(sl))return;            /* 加时赛 / 重赛等独立场次仍以场内快照为准 */
      /* 按轮次反推；老数据可能没有 round 字段 → 回退按时段（上午=1、下午=2，与赛制一致） */
      var k=String(Number(sl.round!=null?sl.round:((sl.period==='下午')?2:1)));
      (sl.teams||[]).forEach(function(tid){
        if(sl.seatId)seatOf[tid]=sl.seatId;
        sessOf[tid]=sessOf[tid]?(sessOf[tid]===k?sessOf[tid]:'both'):k;
      });
    });
    var fill={};
    (d.teams||[]).forEach(function(t){
      if(!t.seatId&&seatOf[t.id])t.seatId=seatOf[t.id];
      if(!t.session)t.session=sessOf[t.id]||'both';
      /* v7：旧值 am/pm → 1/2（口径从"上下午两批"纠正为「第 1 / 第 2 轮」） */
      if(t.session==='am')t.session='1';
      if(t.session==='pm')t.session='2';
      if(t.session!=='1'&&t.session!=='2'&&t.session!=='both')t.session='both';
      /* 顺位为 0 但有归台 → 视为缺顺位，稍后按赛台补到末尾 */
      if(t.seatId&&!Number(t.order)&&sessOf[t.id]){fill[t.seatId]=fill[t.seatId]||[];fill[t.seatId].push(t.id);}
    });
    Object.keys(fill).forEach(function(sid){
      var max=0;
      (d.teams||[]).forEach(function(t){if(t.seatId===sid&&Number(t.order)>max)max=Number(t.order);});
      fill[sid].forEach(function(tid,i){
        (d.teams||[]).forEach(function(t){if(t.id===tid)t.order=max+i+1;});
      });
    });
  })();
  return d;
}

/* ---------- 计分引擎（替代原 Excel 公式，对应引擎改造设计 compute_total） ---------- */
function getInputItems(ev){
  var items=(ev.tasks||[]).map(function(t){return clone(t);});
  (ev.bonusRules||[]).forEach(function(b){
    if(b.template==='count_bonus'&&b.params&&b.params.taskId){
      var tid=b.params.taskId;
      if(!items.some(function(i){return i.id===tid;})){
        items.push({id:tid,name:tid+'（计数项）',type:'count',weight:b.params.perUnit,control:'counter'});
      }
    }
  });
  return items;
}
function taskRawScore(t,val){
  if(val===''||val==null)return null;
  if(t.type==='toggle')return val?Number(t.maxScore)||0:0;
  if(t.type==='enum'){var m=t.enumMap||{};return Object.prototype.hasOwnProperty.call(m,val)?Number(m[val]):0;}
  if(t.type==='count')return (Number(val)||0)*(Number(t.weight)||0);
  return Number(val)||0;
}
function computeTotal(ev,rec){
  rec=rec||{};
  var st=rec.tasks||{};
  /* 兜底用「直接求和」：本赛制只用这一种。历史上兜底是 weighted_sum，而它会把满分
     口径整个改掉（数值项先归一化到 100 分制、再按权重加），兜错时**不报错只静默算错分**。 */
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'sum';
  var tasks=ev.tasks||[];
  var base=0,scored=0;
  if(tpl==='weighted_sum'){
    tasks.forEach(function(t){
      var raw=taskRawScore(t,st[t.id]);
      if(raw==null)return;
      scored++;
      var norm=(t.type==='numeric'&&t.maxScore)?raw/t.maxScore*100:raw;
      base+=norm*(Number(t.weight)||0);
    });
  }else if(tpl==='sum'){
    tasks.forEach(function(t){var raw=taskRawScore(t,st[t.id]);if(raw==null)return;scored++;base+=raw;});
  }else{
    var vals=tasks.map(function(t){return taskRawScore(t,st[t.id]);}).filter(function(v){return v!=null;});
    scored=vals.length;
    base=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:0;
  }
  var bonus=0;
  (ev.bonusRules||[]).forEach(function(b){
    var p=b.params||{};
    if(b.template==='time_bonus'){
      var t=Number(rec.time)||0;
      if(t>0){var v=(eventTotalSec(ev)-t)*(Number(p.perSecond)||0);if(v<0)v=0;if(p.cap!=null)v=Math.min(v,Number(p.cap));bonus+=v;}
    }else if(b.template==='count_bonus'&&p.taskId){
      var c=Number(st[p.taskId])||0;var w=c*(Number(p.perUnit)||0);if(p.cap!=null)w=Math.min(w,Number(p.cap));bonus+=w;
    }
  });
  /* 判罚（黄 / 红牌）不计分：官方口径为只作记录 + 影响并列排序，不参与任何算分。
     仅当赛项被显式配成 per_card（历史配置兼容）时才按牌扣分。 */
  var penalty=0;
  if(ev.penaltyRule&&ev.penaltyRule.template==='per_card'){
    var q=ev.penaltyRule.params||{};
    penalty=(Number(rec.yellow)||0)*(Number(q.yellow)||0)+(Number(rec.red)||0)*(Number(q.red)||0);
  }
  /* 红牌按赛项规则归一：直接记的 + 黄牌累计升级出来的。
     关闭黄牌计数器时不再升级 —— 「关掉开关」在规则上真的不生效，而不只是把界面藏起来。 */
  var cards=effectiveRed(ev,rec);
  var yellow=cards.yellow, red=cards.red;
  return {total:Math.max(0,base+bonus-penalty),base:base,bonus:bonus,penalty:penalty,
          yellow:yellow,red:red,upgradedRed:cards.upgraded,dq:red>0,

/* 「取消资格」= 不可撤销 + 成绩作废 + 不进榜单；与「弃赛」（队伍主动退赛，可恢复）是两件事 */
function activeDqOf(teamId){
  var a=S.dqCases||[];
  for(var i=0;i<a.length;i++){if(a[i].teamId===teamId&&a[i].status==='已生效')return a[i];}
  return null;
}
function isVoided(teamId){return !!activeDqOf(teamId);}
function voidedTeamsOf(evId){
  return (S.teams||[]).filter(function(t){return t.eventId===evId&&isVoided(t.id);});
}
function substituteMode(){return (S.substituteRule&&S.substituteRule.mode)==='rank'?'rank':'none';}
function substituteModeName(){return substituteMode()==='rank'?'按名次顺延':'不递补（空缺不补）';}
/* 原榜 = 取消资格之前的排名（含作废队），用于「影响预览」与名次空缺判定 */
/* ---------- 牌面计数规则（黄牌计数器 / 累计升级 / 红牌后果） ----------
   与后端 engine/cards.go **同口径**，两端必须一致：
     黄牌 —— 记满阈值即升级成红牌**并清零计数**（计数器上限 = 阈值）；本身不产生任何后果。
     红牌 —— **当场取消比赛资格**：成绩保留（照常算分、照常留痕），但不排名次、不参评奖项。
     开关 —— 黄牌计数器关闭 = 整个黄牌体系停用（不显示、不累计、不升级红牌）；
             红牌是独立入口，仍可直接记录。
   与「裁定取消资格（成绩作废）」的区别见榜单页说明。 */
function cardRulesOf(ev){return (ev&&ev.penaltyRule&&ev.penaltyRule.cardRules)||null;}
function cardCounterOn(ev){var c=cardRulesOf(ev);return !(c&&c.enabled===false);}
function redThresholdOf(ev){var c=cardRulesOf(ev);var n=Number(c&&c.redThreshold);return (n>0?n:3);}
function redReasonsOf(ev){
  var c=cardRulesOf(ev);
  return ((c&&c.reasons)||[]).filter(function(r){return (r.card==='red'?'red':'yellow')==='red';});
}
/* 归一后的牌面：黄牌数（当前周期）+ 红牌数（直接记的 + 黄牌升级出来的）
   🔴 2026/10/10 口径变更（用户定）：黄牌**记满阈值即自动升级 1 张红牌并清零黄牌计数**（循环计数），
   所以裁判端黄牌计数器的上限 = 后台「判罚规则 · 累计升级阈值」。
   老数据兼容：yellow 可能仍是"累计值"（>= 阈值）→ 读入时在这里一并归一（结果与旧口径一致）。 */
function effectiveRed(ev,rec){
  var th=redThresholdOf(ev);
  var yellow=Math.max(0,Number(rec&&rec.yellow)||0);
  var red=Math.max(0,Number(rec&&rec.red)||0);
  var up=Math.max(0,Number(rec&&rec.upgradedRed)||0);
  if(cardCounterOn(ev)&&th>0){up+=Math.floor(yellow/th);yellow=yellow%th;}
  return {yellow:yellow,red:red+up,upgraded:up};
}
/* ---------- 两轮制成绩（与后端 engine 同口径）----------
   存储：S.scores[teamId] = {1: rec, 2: rec}；老结构（扁平 rec）视为第 1 轮，迁移会归一。
   取优规则与后端 `betterRound` 逐条一致：总分 ↓ → 用时 ↑ → 轮次小者优先。
   ⚠️ 前端不得另写一套算法（项目铁律）：改动这里必须同步 engine/scoring.go。 */
function isFlatRec(o){return !!o&&(o.tasks!==undefined||o.signed!==undefined||o.state!==undefined||o.time!==undefined||o.yellow!==undefined||o.red!==undefined);}
function recOfMap(map,tid,rn){var o=map&&map[tid];if(!o)return null;if(isFlatRec(o))return Number(rn)===1?o:null;return o[Number(rn)]||null;}
function roundsOfMap(map,tid){var o=map&&map[tid];if(!o)return [];if(isFlatRec(o))return [1];
  var out=[];[1,2].forEach(function(r){if(o[r])out.push(r);});return out;}
/* 该赛项应有几轮（1 轮赛项只有第 1 轮；2 轮赛项两轮都算） */
function expectedRounds(ev){return Number((ev&&ev.rounds)||1)>=2?[1,2]:[1];}
/* 该队实际需要打的轮次 = 赛项轮次 ∩ 队伍的参赛轮次（`session`）。
   这是「某队只打一轮」（如上午打了、下午临时缺席）的正式表达方式 —— 到「分台与顺位」改「参赛轮次」即可，
   **不必用队级弃赛**（弃赛会连第 1 轮成绩一起作废、不进榜单）。
   校验/发布门一律用它，而不是 expectedRounds(ev) —— 否则只打一轮的队会永久卡住发布门。
   ⚠️ 交集为空（理论上不会）时回退赛项全部轮次，避免把队伍误判成「0 轮已完整」。 */
function teamRounds(ev,t){
  var all=expectedRounds(ev||{});
  var mine=all.filter(function(r){return sessionHas(t&&t.session,r);});
  return mine.length?mine:all;
}
function allSignedOf(map,tid,rds){for(var i=0;i<rds.length;i++){var rec=recOfMap(map,tid,rds[i]);if(!rec||!rec.signed)return false;}return true;}
function recsAllHaveTasks(map,tid,rds){for(var i=0;i<rds.length;i++){var rec=recOfMap(map,tid,rds[i]);if(!rec||!Object.keys(rec.tasks||{}).length)return false;}return true;}
function anyScoreOf(map,tid){return roundsOfMap(map,tid).length>0;}
function scoreRec(tid,rn){return recOfMap(S.scores,tid,rn);}
function scoreRounds(tid){return roundsOfMap(S.scores,tid);}
function ensureScoreRec(tid,rn){
  var o=S.scores[tid];
  if(o&&isFlatRec(o)){o={1:o};S.scores[tid]=o;}else if(!o){o={};S.scores[tid]=o;}
  var r=Number(rn)||1;
  return o[r]||(o[r]={tasks:{},time:0,yellow:0,red:0,signed:false});
}
/* 该队是否"该签的都签了"（1 轮看第 1 轮；2 轮要两轮都签） */
function teamAllSigned(t){if(!t)return false;return allSignedOf(S.scores,t.id,teamRounds(find(t.eventId)||{},t));}
/* 跨赛事统计用：直接吃原始数据 d（不是当前 S） */
function contestSignedCount(d){
  var evs={};(d.events||[]).forEach(function(e){evs[e.id]=e;});
  var n=0;(d.teams||[]).forEach(function(t){if(allSignedOf(d.scores,t.id,teamRounds(evs[t.eventId],t)))n++;});
  return n;
}
function betterRound(a,b){
  if(a.result.total!==b.result.total)return a.result.total>b.result.total;
  var at=Number(a.rec.time)||0,bt=Number(b.rec.time)||0;
  if(at!==bt)return at<bt;
  return a.round<b.round;

function bestRoundOf(ev,tid){
  var rounds=scoreRounds(tid),best=null,found=false;
  rounds.forEach(function(rn){
    var rec=scoreRec(tid,rn);if(!rec)return;
    var cur={round:rn,rec:rec,result:computeTotal(ev,rec)};
    if(!found||betterRound(cur,best)){best=cur;found=true;}
  });
  return {best:best,found:found,rounds:rounds};
}
function rankAll(evId){
  var ev=find(evId);if(!ev)return [];
  var tb=(ev.rankRule&&ev.rankRule.tieBreak)||['score','time'];
  /* 弃赛队**不进榜单**（队伍主动退赛、可恢复，与「取消资格」是两条路径）——
     与后端 engine.RankOptions.IncludeWithdrawn 默认 false 同口径。
     原先这里漏了这条过滤：弃赛队照样出现在榜单 / 公示 / 大屏 / 导出里，
     与本册发布门口径「弃赛 N 支已作废，不进榜单」自相矛盾（2026/10/10 修）。 */
  var list=S.teams.filter(function(t){return t.eventId===evId&&t.status!=='withdrawn';}).map(function(t){
    /* 两轮取优：从各轮记录里挑最好的一轮计入名次（用时也取该轮）—— 与后端 engine 同口径 */
    var b=bestRoundOf(ev,t.id);
    var r=(b.found&&b.best.rec)||{};
    var c=(b.found&&b.best.result)||computeTotal(ev,{});
    return {team:t,total:c.total,base:c.base,bonus:c.bonus,penalty:c.penalty,yellow:c.yellow,red:c.red,

    if(!!a.dq!==!!b.dq)return a.dq?1:-1;
    if(b.total!==a.total)return b.total-a.total;
    for(var i=0;i<tb.length;i++){if(tb[i]==='time'&&a.time!==b.time)return a.time-b.time;}

function standings(evId){
  var ev=find(evId);if(!ev)return [];

  var rows=all.filter(function(r){return !isVoided(r.team.id);});
  var useGap=(substituteMode()!=='rank');   /* 不递补（空缺不补）：保留原名次，作废队位置留空 */
  /* 红牌取消比赛资格的队伍**留在榜内**（成绩与判罚要可查、公示要能说明少了一队），
     但不占名次序号：名次只在「有资格」的队伍之间连续发放，避免后面全部少一名。 */
  var live=rows.filter(function(r){return !r.dq;});
  live.forEach(function(r,i){
    r.rank=useGap?r.origRank:(i+1);

/* 两轮赛项：标出这一行的成绩来自哪一轮（取优结果）——

   只有一个轮次分数就参与排名，往往意味着另一轮漏录了）。1 轮赛项恒返回空串。 */
function bestRoundTag(ev,r){
  if(!ev||Number(ev.rounds||1)<2)return '';

/* 导出用：列名已经写了「取优轮」，单元格里只留值（「第 2 轮」/「仅第 1 轮」），

/* 作废队清单（用于「影响预览」与公示声明） */
function voidedInfo(evId){

function validateEvent(ev){
  var errs=[],warns=[];
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'';
  var wsum=(ev.tasks||[]).reduce(function(s,t){return s+(Number(t.weight)||0);},0);
  if(tpl==='weighted_sum'&&Math.abs(wsum-1)>0.001)warns.push('numeric 任务权重之和 = '+wsum.toFixed(2)+'，weighted_sum 下建议 = 1.0');
  var seen={};
  (ev.tasks||[]).forEach(function(t){
    if(seen[t.id])errs.push('任务 id 重复：'+t.id);
    seen[t.id]=1;
    if(!t.name)errs.push('存在未命名的任务');
    if(t.type==='enum'&&(!t.enumMap||!Object.keys(t.enumMap).length))errs.push('enum 任务「'+t.name+'」缺少等级映射 enumMap');
  });
  (ev.bonusRules||[]).forEach(function(b,i){
    if(b.template==='count_bonus'){
      var tid=b.params&&b.params.taskId;
      if(!tid)errs.push('奖励规则 #'+(i+1)+' 未指定 taskId');
      else{
        var okAny=(ev.bonusRules||[]).some(function(x){return x.params&&x.params.taskId===tid;})||(ev.tasks||[]).some(function(t){return t.id===tid;});
        if(!okAny)errs.push('奖励规则 #'+(i+1)+' 引用的任务「'+tid+'」不存在');
      }
    }
  });
  if(ev.customFormula!=null)errs.push('customFormula 必须为 null（本期 A 档不支持自定义公式）');
  var rds=Number(ev.rounds||1);
  if(rds>=2){
    var hasR1=false,hasR2=false;
    (S.slots||[]).forEach(function(x){
      if(x.eventId!==ev.id)return;
      if(Number(x.round||1)===2)hasR2=true;else hasR1=true;
    });

  }
  return {errs:errs,warns:warns};
}

  /* 建赛：只支持「勾选赛项模板」一种方式 —— 勾选哪个赛项就带入该赛项的完整规则，队伍与成绩一律从零开始。 */

/* ---------- 跨赛事只读快照 ----------
   供「比赛结果总览」使用：crossRanks() 与 xrResults() 都靠 .ready 判断某场有没有
   本地数据（空赛事直接跳过），再借 withContestData() 读该场自己的数据空间。
   只读，不改当前赛事。
   注：返回的其它计数（teams / signed / published / req / dis / alert）原是给已删的
   「多场并行总控」页用的，现在没有调用点，保留是为了将来做跨场看板。 */
function contestSnapshot(cid){
  var d=null;
  try{var raw=localStorage.getItem(ckey(cid));if(raw)d=JSON.parse(raw);}catch(e){}
  var c=contestById(cid)||{};
  var out={id:cid,name:c.name||'',status:c.status||'',start:c.start||'',end:c.end||'',
    venue:c.venue||'',staff:(c.staff||[]).slice(),ready:!!d,
    teams:0,signed:0,published:0,req:0,dis:0,alert:0,events:[]};
  if(!d)return out;
  out.teams=(d.teams||[]).length;
  out.signed=contestSignedCount(d);
  out.published=Object.keys(d.published||{}).length;
  (d.changeRequests||[]).forEach(function(r){if(r.status==='待审批')out.req++;});
  (d.disputes||[]).forEach(function(r){if(r.status==='待裁定')out.dis++;});
  (d.alerts||[]).forEach(function(r){if(r.status==='待处理')out.alert++;});
  out.events=(d.events||[]).map(function(e){
    var tms=(d.teams||[]).filter(function(t){return t.eventId===e.id;});
    return {name:e.name,teams:tms.length,
      signed:tms.filter(function(t){return allSignedOf(d.scores,t.id,teamRounds(e,t));}).length,
      published:!!((d.published||{})[e.id])};
  });
  return out;
}
/* 排班冲突：同一个值守人被排到赛期重叠的两场 —— 这是真冲突，必须重新安排人 */
function staffConflicts(){
  var out=[];
  CONTESTS.forEach(function(a){
    CONTESTS.forEach(function(b){
      if(a.id>=b.id)return;
      if(!overlappingContests(a).some(function(x){return x.id===b.id;}))return;
      var both=(a.staff||[]).filter(function(n){return (b.staff||[]).indexOf(n)>=0;});
      if(both.length)out.push({a:a,b:b,names:both});
    });
  });
  return out;
}
/* ---------- 开赛就绪度：运营最关心的一句话「这场能不能开赛」 ---------- */
function readinessOf(cid){
  var cur=CUR_CONTEST,box={v:null};
  function run(){
    var teams=S.teams||[],slots=(S.slots||[]).filter(function(x){return !isExtraSlot(x);});
    var evs=S.events||[],refs=S.referees||[];
    var seatIds={};S.seats.forEach(function(x){seatIds[x.id]=1;});
    box.v={
      events:evs.length,teams:teams.length,slots:slots.length,refs:refs.length,
      ruleBad:evs.filter(function(e){return validateEvent(e).errs.length>0;}).length,
      /* 未分台 = 没有归台，或归台指向一张**已不存在的赛台**（后者原先被漏判 → 队伍隐身却绿灯） */
      unseated:teams.filter(function(t){return !t.seatId||!seatIds[t.seatId];}).length,
      /* 场次是否排到队伍：必须用 slotTeams() 派生结果 —— 原先读 x.teams，
         那是已废弃的存储字段，改成派生后会**永远为空**、永远报错（假红）。 */
      emptySlots:slots.filter(function(x){return !slotTeams(x).length;}).length,
      /* 已分台却排不进任何场次：该赛台缺少对应时段 / 赛项 / 组别的场次（现场最典型的漏排） */
      unslotted:teams.filter(function(t){
        if(!t.seatId||!seatIds[t.seatId]||t.status==='withdrawn')return false;
        return !slots.some(function(sl){
          return sl.seatId===t.seatId&&sl.eventId===t.eventId&&sl.group===t.group
            &&sessionHas(t.session,Number(sl.round||1));
        });
      }).length,
      unstaffed:slots.filter(function(x){return !((x.judges||[]).length);}).length,
      idle:refs.filter(function(r){return r.status!=='activated';}).length
    };
  }
  if(cid===cur)run();else withContestData(cid,function(){run();});
  return box.v;
}
function readinessItems(cid){
  var r=readinessOf(cid);if(!r)return null;
  var items=[
    {k:'规则已校验',ok:r.events>0&&r.ruleBad===0,good:r.events+' 个赛项全部通过',

/* ---------- 视图 0c：比赛结果总览（跨赛事成绩对照；只做对照，不做跨场总分排名） ---------- */
/* ---------- 比赛结果总览 · 筛选状态 ----------
   两个状态：XRF = 正在输入的条件（不立即生效）；XRA = 已应用的条件（点「搜索」才生效）。
   赛事范围由条件**推导**得出（xrPicked），不再维护「勾选了哪几场」。 */
var XRF={contest:[],st:'all',from:'',to:'',ev:'all',grp:'all',team:'',member:''};
var XRA={contest:[],st:'all',from:'',to:'',ev:'all',grp:'all',team:'',member:''};
/* 赛事多选下拉面板的展开态。和 XRF/XRA 放在一起 —— 它是筛选区的界面状态，
   不是筛选条件本身（不参与 xrPicked）。 */
var XRM={open:false};
/* 把 contest 条件归一成数组。
   存在的理由：早年是单值（'all' | 赛事id），现在改多选后只要有**任何残留的旧形态**
   （页面未刷新、外部代码写过、夹具传了字符串），xrActive 里的 .map 就会直接抛错、
   整个「比赛结果总览」白屏 —— 这类残留无法完全避免，所以在读的地方统一归一一次。 */
function xrSelArr(v){return Array.isArray(v)?v:(!v||v==='all'?[]:[v]);}
function xrBlank(){return {contest:[],st:'all',from:'',to:'',ev:'all',grp:'all',team:'',member:''};}
/* 输入只改草稿、不重渲染 —— 输入框焦点与光标不会丢 */
function xrF(k,v){XRF[k]=v;}
function xrSearch(){
  /* contest 是数组，必须 slice 拷贝：直接赋引用会让「草稿」与「已生效」共用同一个数组，
     之后在筛选卡里勾一下，生效中的条件会跟着变（字符串时代是值拷贝，换数组后才出现的坑）。 */
  XRA={contest:(XRF.contest||[]).slice(),st:XRF.st,from:XRF.from,to:XRF.to,ev:XRF.ev,grp:XRF.grp,team:XRF.team,member:XRF.member};
  XRM.open=false;                      /* 点搜索顺带收起多选面板 */
  render();
}
function xrReset(){XRF=xrBlank();XRA=xrBlank();XRS={by:'',dir:''};XRM.open=false;render();}
/* 当前生效条件（用于回显，也让用户知道「搜索」到底提交了什么） */
function xrActive(fo){
  var a=[],nm={};
  ((fo&&fo.evs)||[]).forEach(function(e){nm[e.id]=e.name;});
  var selC=xrSelArr(XRA.contest);
  if(selC.length){
    var names=selC.map(function(id){var ct=CONTESTS.filter(function(c){return c.id===id;})[0];return ct?ct.name:id;});
    /* 场次多时只列前 2 场 + 总数，免得回显被撑成一段长文（与筛选卡一行放得下为准） */
    a.push('赛事 = '+(names.length<=2?names.join('、'):(names.slice(0,2).join('、')+' 等 '+names.length+' 场')));
  }
  if(XRA.st!=='all')a.push('状态 = '+XRA.st);
  if(XRA.from||XRA.to)a.push('赛期 '+(XRA.from||'不限')+' ~ '+(XRA.to||'不限'));
  if(XRA.ev!=='all')a.push('赛项 = '+(nm[XRA.ev]||XRA.ev));
  if(XRA.grp!=='all')a.push('组别 = '+XRA.grp);
  if(XRA.team)a.push('队伍名称 含「'+XRA.team+'」');
  if(XRA.member)a.push('选手信息 含「'+XRA.member+'」');
  return a;
}
/* 赛事级筛选：由条件推导纳入对照的场次 */
function xrPicked(){
  var pick=xrSelArr(XRA.contest);
  return CONTESTS.filter(function(c){
    if(pick.length && pick.indexOf(c.id)<0) return false;
    if(XRA.st!=='all' && contestDisplayStatus(c)!==XRA.st) return false;
    if(XRA.from||XRA.to){
      var s=c.start||'';
      if(!s) return false;                      /* 没填赛期 → 无法判断是否落在区间内，排除 */
      var e=c.end||c.start||'';
      if(XRA.from && e<XRA.from) return false;
      if(XRA.to && s>XRA.to) return false;
    }
    return true;
  });
}
/* 筛选栏的一个「标签 + 控件」单元 */
function xrFld(label,ctrl){
  return '<span style="display:inline-flex;align-items:center;gap:6px">'+
    '<span class="small muted" style="white-space:nowrap">'+esc(label)+'</span>'+ctrl+'</span>';
}
function crossFilterOptions(){
  var evs=[],gs=[];
  CONTESTS.forEach(function(c){
    withContestData(c.id,function(){
      (S.events||[]).forEach(function(e){
        if(!evs.some(function(x){return x.id===e.id;}))evs.push({id:e.id,name:e.name});
        ((e.groups)||[]).forEach(function(g){if(gs.indexOf(g)<0)gs.push(g);});
      });
    });
  });
  return {evs:evs,gs:gs};
}
/* 逐场逐赛项取榜单，按「队名 + 学校」把同一支队伍跨场合起来 */
function crossRanks(){
  var chosen=xrPicked();
  var byTeam={},order=[],used=0;
  chosen.forEach(function(c){
    if(!contestSnapshot(c.id).ready)return;
    used++;
    withContestData(c.id,function(){
      (S.events||[]).forEach(function(ev){
        if(XRA.ev!=='all'&&ev.id!==XRA.ev)return;
        var rows=standings(ev.id);
        rows.forEach(function(r){
          if(XRA.grp!=='all'&&(r.team.group||'')!==XRA.grp)return;
          var key=(r.team.name||'')+'|'+(r.team.school||'');
          if(!byTeam[key]){byTeam[key]={key:key,name:r.team.name,school:r.team.school||'',members:r.team.members||'',items:[]};order.push(key);}
          byTeam[key].items.push({contestId:c.id,contest:c.name,event:ev.name,group:r.team.group||'',
            rank:r.rank,total:r.total,of:rows.length});
        });
      });
    });
  });
  var list=order.map(function(k){
    var t=byTeam[k];
    t.count=t.items.length;
    t.froms=t.items.map(function(x){return x.contest;}).filter(function(v,i,a){return a.indexOf(v)===i;});
    t.multi=(t.froms.length>1);
    return t;
  });
  /* 刻意不按总分排序：跨赛事赛制 / 难度 / 权重不同，总分不可比，平均分同样不可比。
     归并列表只用于 KPI 计数（覆盖队伍 / 跨场参赛队伍）；比赛结果明细的排序见 xrOrder（默认赛事 → 赛项 → 名次）。 */
  list.sort(function(a,b){return (b.count-a.count)||a.name.localeCompare(b.name,'zh');});
  return {list:list,used:used,picked:chosen.length};
}
/* ---------- 比赛结果总览 · 赛事多选下拉 ----------
   为什么不是原生 <select multiple>：原生多选要**按住 Ctrl 点**，现场没人会；
   也不是一长排平铺复选框 —— 场次一多会把筛选卡撑得很高。
   做法：一个按钮（显示已选几场）+ 点开的下拉面板（面板里是复选框、带全选/清空）。

   面板显隐与计数走「局部 DOM 更新」而不是 render()：render() 会整页重绘，而筛选卡里
   还有日期与文本框，一边勾一边丢焦点没法用（与 xrF 只改草稿不重绘同一考虑）。 */
function xrMList(){return xrSelArr(XRF.contest);}
function xrMLabel(){

}

    '<div id="xrMCPanel" style="'+(XRM.open?'':'display:none;')+'position:absolute;z-index:50;top:34px;left:0;width:310px;max-height:290px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.13);padding:8px 10px;text-align:left">'+
      '<div class="row" style="justify-content:space-between;margin-bottom:4px">'+
        '<span class="small muted" id="xrMCount">已选 '+sel.length+' / '+CONTESTS.length+' 场</span>'+
        '<span><button class="btn sm" onclick="xrMAll(true)">全选</button> <button class="btn sm" onclick="xrMAll(false)">清空</button></span>'+
      '</div>'+
      rows+
      '<div class="hint" style="margin-top:6px">勾选后点「搜索」生效；一个都不勾 = 全部赛事。</div>'+
    '</div>'+
  '</span>';
}
function xrMToggle(){
  XRM.open=!XRM.open;
  var p=document.getElementById('xrMCPanel');

/* 只同步按钮文字与计数，不重绘整页 —— 否则每勾一次都会丢输入焦点 */
function xrMSync(){

function xrMPick(id,on){

  if(on)a.push(id);

  xrMSync();
}
function xrMAll(on){

}
/* ---------- 比赛结果总览 · 筛选条件（字段式：条件推导范围 + 搜索 / 重置） ---------- */

/* ---------- 比赛结果明细 ----------
   一条成绩一行：同一支队伍参加多个赛项 / 多场赛事就出现多行，不做跨场归并。
   数据源 standings()：已剔除弃赛与取消资格，按该场递补规则给出官方名次。 */
var XRS={by:'',dir:''};   /* 排序：by=字段（total / rank），dir=asc / desc；为空＝默认顺序 */
function xrResults(){
  var chosen=xrPicked(),out=[];
  chosen.forEach(function(c){
    if(!contestSnapshot(c.id).ready)return;
    withContestData(c.id,function(){
      (S.events||[]).forEach(function(ev){
        if(XRA.ev!=='all'&&ev.id!==XRA.ev)return;
        var rows=standings(ev.id);
        rows.forEach(function(r){
          if(XRA.grp!=='all'&&(r.team.group||'')!==XRA.grp)return;
          if(XRA.team && String(r.team.name||'').toLowerCase().indexOf(String(XRA.team).toLowerCase().trim())<0)return;
          if(XRA.member && String(r.team.members||'').toLowerCase().indexOf(String(XRA.member).toLowerCase().trim())<0)return;
          out.push({
            contestId:c.id, contest:c.name, event:ev.name, of:rows.length,
            no:r.team.no||'', name:r.team.name||'', school:r.team.school||'',
            group:r.team.group||'', members:r.team.members||'',
            total:r.total, rank:r.rank, tie:!!r.tie
          });
        });
      });
    });
  });
  return out;
}
/* 点表头切换正序 / 倒序。首次点：排名默认正序（第 1 名在前），分数默认倒序（高分在前） */
function xrSort(k){
  if(XRS.by===k)XRS.dir=(XRS.dir==='asc')?'desc':'asc';
  else{XRS.by=k;XRS.dir=(k==='rank')?'asc':'desc';}
  render();
}
function xrOrder(list){
  if(!XRS.by)return list;                       /* 默认顺序＝赛事 → 赛项 → 名次（standings 已按名次升序） */
  var d=(XRS.dir==='asc')?1:-1;
  return list.slice().sort(function(a,b){
    var va=a[XRS.by],vb=b[XRS.by];
    if(va!==vb)return (va<vb?-1:1)*d;
    return (a.contest+a.event+a.name).localeCompare(b.contest+b.event+b.name,'zh')||(a.rank-b.rank);
  });
}
/* 可排序表头（只给比赛分数 / 成绩排名用） */
function xrTh(key,label,num){
  var on=(XRS.by===key);
  var arrow=on?(XRS.dir==='asc'?'▲':'▼'):'⇅';
  var col=on?'#1b63ab':'#a8b0bd';
  return '<th'+(num?' class="num"':'')+' style="cursor:pointer;user-select:none;white-space:nowrap"'+
    ' onclick="xrSort(\''+key+'\')" title="点击切换正序 / 倒序">'+esc(label)+
    ' <span style="font-size:11px;color:'+col+'">'+arrow+'</span></th>';
}
function viewCrossRank(){
  var fo=crossFilterOptions();
  var r=crossRanks();
  var picked=r.picked;
  var multi=r.list.filter(function(x){return x.multi;}).length;
  var kpi=function(lb,nm,ft){return '<div class="kpi"><div class="lb">'+lb+'</div><div class="nm">'+nm+'</div><div class="ft">'+ft+'</div></div>';};

  var list=xrOrder(xrResults());

/* ---------- 跨赛事人员复用（复用的是「人」，不是凭证） ---------- */
function refereePool(){
  var pool={},order=[];
  var curId=CUR_CONTEST;   /* 必须在进入 withContestData 之前抓下来 —— 里面 CUR_CONTEST 会被临时换掉 */
  CONTESTS.forEach(function(c){
    withContestData(c.id,function(){
      (S.referees||[]).forEach(function(r){
        var k=(r.name||'')+'|'+(r.phone||'');
        if(!pool[k]){pool[k]={key:k,name:r.name,phone:r.phone,role:r.role,froms:[],cur:false,code:''};order.push(k);}
        if(pool[k].froms.indexOf(c.id)<0)pool[k].froms.push(c.id);
        if(c.id===curId){pool[k].cur=true;pool[k].code=r.code||'';}
      });
    });
  });
  return order.map(function(k){return pool[k];});
}
function importReferee(key){
  if(readonlyGuard())return;
  var p=refereePool().filter(function(x){return x.key===key;})[0];
  if(!p){alert('未找到该人员。');return;}
  if(p.cur){alert('「'+p.name+'」已经在当前赛事的裁判档案里了。');return;}
  S.referees=S.referees||[];
  var used={};S.referees.forEach(function(r){used[r.id]=true;});
  var id;do{id=uid('rf_');}while(used[id]);
  S.referees.push({id:id,name:p.name,phone:p.phone,role:p.role,code:'',status:'issued',
    bind:{eventId:'',group:'',seatId:''},activatedAt:'',lastSeen:'',device:''});
  logAudit('改配置','裁判档案 · 复用人员 '+p.name,'（不在本场名单）','已加入（待发裁判码）','跨赛事人员复用');
  render();
}
function importAllReferees(){
  if(readonlyGuard())return;
  var pool=refereePool().filter(function(x){return !x.cur;});
  if(!pool.length){alert('没有可复用的人员（其他赛事的裁判都已在当前赛事名单里）。');return;}
  if(!confirm('把其他赛事的 '+pool.length+' 位裁判加入「'+contestName(CUR_CONTEST)+'」？\n（只带入姓名 / 电话 / 角色；裁判码与赛台绑定是赛事级凭证，不会带过来，导入后需重新发放裁判码）'))return;
  S.referees=S.referees||[];
  var used={};S.referees.forEach(function(r){used[r.id]=true;});

    var id;do{id=uid('rf_');}while(used[id]);used[id]=true;
    S.referees.push({id:id,name:p.name,phone:p.phone,role:p.role,code:'',status:'issued',

  render();
}

function selEvent(id){CUR_EVENT=id;render();}
function addEvent(){
  var src=S.events.find(function(e){return e.id===CUR_EVENT;})||S.events[0];
  if(!src){alert('暂无可复制的赛项，请先选择本赛事已有的赛项。');return;}
  var n=1;
  S.events.forEach(function(e){var m=/^event_(\d+)$/.exec(e.id||'');if(m)n=Math.max(n,(+m[1])+1);});
  var id='event_'+n;
  // 深拷贝当前赛项结构（赛项配置均为可序列化对象，JSON 克隆足够）
  var ne=JSON.parse(JSON.stringify(src));
  ne.id=id;
  ne.name=src.name+'（副本）';
  S.events.push(ne);
  logAudit('改配置','复制赛项',src.name,ne.name,'赛项与规则');
  CUR_EVENT=id;save();render();
}
function eventRefCount(id){
  var n=0;
  n+=(S.teams||[]).filter(function(t){return t.eventId===id;}).length;
  n+=(S.slots||[]).filter(function(s){return s.eventId===id;}).length;
  n+=(S.disputes||[]).filter(function(d){return d.eventId===id;}).length;
  n+=(S.changeRequests||[]).filter(function(c){return c.eventId===id;}).length;
  n+=(S.evidence||[]).filter(function(e){return e.eventId===id;}).length;
  return n;
}
function removeEvent(id){
  var ev=find(id);if(!ev)return;
  var n=eventRefCount(id);
  if(n>0){alert('该赛项已有 '+n+' 条关联数据（队伍 / 赛程 / 争议 / 工单 / 留底），无法直接删除。\n请先清理相关队伍与赛程，或改用「复制赛事」重建本场。');return;}
  if(!confirm('确认删除赛项「'+ev.name+'」（'+id+'）？\n此操作不可撤销，仅影响本场赛事。'))return;
  S.events=S.events.filter(function(e){return e.id!==id;});
  if(CUR_EVENT===id)CUR_EVENT=(S.events[0]&&S.events[0].id)||'';
  logAudit('改配置','删除赛项',ev.name,'—','赛项与规则');
  save();render();
}
function eventForm(ev){
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'sum';
  var isWS=tpl==='weighted_sum';
  var phaseOpts=(ev.phases||[]).map(function(p){return {id:p.id,name:p.name};}).concat([{id:'overall',name:'整体（主观分）'}]);

function updEvent(k,v){var ev=find(CUR_EVENT);if(!ev)return;ev[k]=v;save();}
var GROUP_PRESETS=['小学组','初中组','高中组'];
var GROUPS_OPEN=false;
function toggleGroupsDD(){GROUPS_OPEN=!GROUPS_OPEN;render();}
function updEventGroup(g,on){var ev=find(CUR_EVENT);if(!ev)return;ev.groups=ev.groups||[];if(on){if(ev.groups.indexOf(g)<0)ev.groups.push(g);}else{ev.groups=ev.groups.filter(function(x){return x!==g;});}save();}
function groupsDropdown(ev){
  var sel=(ev.groups||[]);
  var label=sel.length?sel.join('、'):'未选择';
  var body=GROUP_PRESETS.map(function(g){
    var on=sel.indexOf(g)>=0;
    return '<label class="dd-opt"><input type="checkbox" '+(on?'checked':'')+' onchange="updEventGroup(\''+g+'\',this.checked)"> '+esc(g)+'</label>';
  }).join('');
  return '<div class="dd">'+
    '<button type="button" class="dd-sum" onclick="toggleGroupsDD()">'+esc(label)+'<span class="caret">▾</span></button>'+
    (GROUPS_OPEN?'<div class="dd-body">'+body+'</div><div class="dd-backdrop" onclick="toggleGroupsDD()"></div>':'')+
  '</div>';
}
function updEventRounds(v){var ev=find(CUR_EVENT);if(!ev)return;ev.rounds=Number(v)||1;save();render();}
/* ⚠️ 界面已不再提供入口（计分规则只读展示，见 tplText）。
   保留此函数是为了：① 历史/外部调用；② 以后赛制若改口要用别的模板，接回下拉即可 ——
   它负责的「切模板时保留 params.refTime」逻辑仍然是有用的参考。 */
function updEventTpl(v){
  var ev=find(CUR_EVENT);if(!ev)return;
  var before=(ev.scoreRule&&ev.scoreRule.template)||'—';
  var _keepRef=(ev.scoreRule&&ev.scoreRule.params&&ev.scoreRule.params.refTime!=null)?ev.scoreRule.params.refTime:null;
  ev.scoreRule={template:v,params:{}};
  /* 切模板不该把「赛项总时间」抹掉 —— 它是时间奖励的基准，后端引擎也读这个字段 */
  if(_keepRef!=null)ev.scoreRule.params.refTime=_keepRef;
  logAudit('改配置',ev.name+' · 计分规则',before,v,'赛项规则调整');
  save();
}
function updTieBreak(v){var ev=find(CUR_EVENT);if(!ev)return;ev.rankRule.tieBreak=v.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);save();}
function updTieBreakPreset(v){
  var ev=find(CUR_EVENT);if(!ev)return;
  var before=tieName(ev.rankRule.tieBreak);
  ev.rankRule.tieBreak=v.split(',').map(function(s){return s.trim();}).filter(Boolean);
  logAudit('改配置',ev.name+' · 同分裁决规则',before,tieName(ev.rankRule.tieBreak),'赛项规则调整');
  save();
}

/* 判罚模板恒显示「仅记录不扣分」—— 本赛制只有这一种（与 tplName 恒显示「直接求和」对称）。
   存量数据里若还是历史值（per_card / none），加载时已由 migrate 归一；后端则由迁移 0013 归一。
   所以这里不再按值区分 —— 否则界面会显示出一个赛制里根本不存在的模板名。
   签名保留参数是为了调用点读起来自然。 */
function penName(t){return '仅记录不扣分';}
function ensureCardRules(){
  var ev=find(CUR_EVENT);if(!ev)return null;
  if(!ev.penaltyRule)ev.penaltyRule={template:'record_only',params:{}};
  if(!ev.penaltyRule.params)ev.penaltyRule.params={};
  if(!ev.penaltyRule.cardRules)ev.penaltyRule.cardRules={enabled:true,redThreshold:3,reasons:[]};
  var cr=ev.penaltyRule.cardRules;
  if(!cr.reasons)cr.reasons=[];
  if(cr.enabled==null)cr.enabled=true;   /* 未配置 = 开：旧数据没这个字段，不能当成关 */
  if(cr.redThreshold==null)cr.redThreshold=3;
  if(!ev.penaltyRule.template)ev.penaltyRule.template='record_only';
  if(!ev.disputeTypes)ev.disputeTypes=[
    {code:'D01',label:'选手申诉（对判罚有异议）'},
    {code:'D02',label:'重复打分（同队同轮出现 2 份成绩）'},
    {code:'D03',label:'用时争议（计时 / 停表异议）'},
    {code:'D04',label:'器材故障 / 其他'}
  ];
  return cr;
}
function updCardTpl(v){

function parseCSV(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()!=='';});
  return lines.map(function(l){
    var out=[],cur='',q=false;
    for(var i=0;i<l.length;i++){
      var c=l[i];
      if(q){
        if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c;
      }else{
        if(c==='"')q=true; else if(c===','){out.push(cur);cur='';} else cur+=c;
      }
    }
    out.push(cur);
    return out.map(function(s){return s.trim();});
  });
}
function autoMap(headers,fields){

  fields.forEach(function(f){

      var s=String(h).replace(/\s/g,'');
      if(f.k==='team_number'&&(s.indexOf('编号')>=0||s.indexOf('队号')>=0||s.toLowerCase().indexOf('number')>=0))idx=i;
      else if(f.k==='team_name'&&(s.indexOf('队伍名')>=0||s.indexOf('队名')>=0||s==='名称'))idx=i;
      else if(f.k==='school'&&(s.indexOf('学校')>=0||s.indexOf('机构')>=0||s.indexOf('单位')>=0))idx=i;
      else if(f.k==='coach'&&(s.indexOf('教练')>=0||s.indexOf('指导')>=0||s.indexOf('教师')>=0))idx=i;
      else if(f.k==='group_code'&&(s.indexOf('组别')>=0||s.indexOf('年级')>=0||s.indexOf('学段')>=0))idx=i;
      else if(f.k==='event_code'&&(s.indexOf('赛项')>=0||s.indexOf('项目')>=0||s.indexOf('赛道')>=0))idx=i;
      else if(f.k==='members'&&(s.indexOf('成员')>=0||s.indexOf('队员')>=0||s.indexOf('选手')>=0||s.indexOf('学生')>=0))idx=i;
    });
    m[f.k]=idx;
  });
  return m;
}

  if(o.team_number&&!/^\d+$/.test(o.team_number))errs.push('队伍编号须为纯数字（当前「'+o.team_number+'」）');

  var evId=impIsBulk()?IMP.bulkEvent:EVENT_BY_NAME[o.event_code];
  if(!impIsBulk()&&o.event_code&&!evId)errs.push('未知赛项「'+o.event_code+'」');
  if(impIsBulk()&&!evId)errs.push('未选定本批写入的赛项');
  var ev=evId?find(evId):null;
  if(ev&&o.group_code&&(ev.groups||[]).indexOf(o.group_code)<0)errs.push('组别「'+o.group_code+'」不属于赛项「'+ev.name+'」');
  if(o.team_number&&counts&&counts[o.team_number]>1)errs.push('编号在文件中出现 '+counts[o.team_number]+' 次，需人工裁决');
  if(errs.length)return {status:'conflict',errs:errs,changes:[],canFile:false,reason:'invalid'};
  var mt=null;
  for(var i=0;i<S.teams.length;i++){if(S.teams[i].no===o.team_number){mt=S.teams[i];break;}}
  if(!mt)return {status:'insert',errs:[],changes:[],canFile:false};
  var curEv=find(mt.eventId),changes=[];
  var pairs=[['team_name','name','队伍名称'],['school','school','学校'],['coach','coach','教练'],['group_code','group','组别']];
  if(impIsBulk())pairs.push(['members','members','成员']);   /* bulk 多一项成员名单 */
  pairs.forEach(function(p){
    var oldV=(mt[p[1]]||'');
    var newV=o[p[0]]||'';
    if(oldV!==newV)changes.push({label:p[2],old:oldV||'—',new:newV||'—',structural:(p[2]==='组别')});
  });
  /* 「赛项」不在文件里 —— 与「本批目标赛项」比 id（比名字更稳，赛项改名不会误报变更） */
  if(evId&&mt.eventId!==evId){
    changes.push({label:'赛项',old:((curEv&&curEv.name)||'—'),new:((ev&&ev.name)||'—'),structural:true});
  }
  var hasScore=anyScoreOf(S.scores,mt.id);
  if(hasScore&&changes.some(function(c){return c.structural;})){

function impEff(it){

  if(undecided){

    fileName:IMP.fileName||'（粘贴 / 样例数据）',summary:eff,

  IMP.mode='wizard';IMP.step=5;   /* 第 5 态：完成页（否则成功提示会被立刻切走，用户看不到结果） */
  render();

/* ---------- 撤回 ---------- */
function impRevoke(id){
  if(readonlyGuard())return;
  var t=null;
  impTaskList().forEach(function(x){if(x.id===id)t=x;});
  if(!t)return;
  if(t.legacy){alert('这是升级前的历史导入记录，没有回滚快照，无法撤回。');return;}
  if(t.status==='revoked'){alert('这批导入已经撤回过了。');return;}
  if(t.affectedScores>0){
    alert('撤回被拒绝：\n该批导入涉及的队伍已有 '+t.affectedScores+' 支产生成绩。\n撤回会破坏成绩与队伍的归属关系，请手工处理。');
    return;
  }
  var sn=t.snapshot||{added:[],updated:[]};
  if(!confirm('确认撤回这批导入？\n\n· 撤销本次新增 '+sn.added.length+' 支\n· 回滚本次更新 '+sn.updated.length+' 支\n\n撤回会另写一条记录，原记录保留可查。'))return;
  sn.added.forEach(function(tid){S.teams=S.teams.filter(function(x){return x.id!==tid;});});
  sn.updated.forEach(function(u){
    var mt=null;
    for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===u.id){mt=S.teams[i];break;}}
    if(!mt)return;
    var b=u.before||{};
    mt.name=b.name;mt.school=b.school;mt.coach=b.coach;mt.group=b.group;mt.eventId=b.eventId;mt.source=b.source;
    if('members' in b)mt.members=b.members;
  });
  t.status='revoked';t.revokedAt=nowStr();
  impTaskList().unshift({id:uid('it_'),ts:nowStr(),operator:currentUser().name,source:t.source||'excel',
    fileName:'（撤回）'+(t.fileName||''),summary:{insert:0,update:0,skip:0,conflict:0},
    status:'revoked',detail:[{act:'revoke',no:'—',name:'撤回 '+(t.fileName||'')}],affectedScores:0,snapshot:null});
  save();render();
}
/* ---------- .xlsx 直读（零依赖：ZIP central directory + DecompressionStream + XML 扫描） ---------- */
function xmlUnescape(s){
  return String(s==null?'':s)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(Number(d));})
    .replace(/&amp;/g,'&');
}
function colIndexFromRef(ref){
  var m=/^([A-Z]+)/.exec(String(ref||'').toUpperCase());
  if(!m)return -1;
  var s=m[1],n=0;
  for(var i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);
  return n-1;
}
function parseSharedStringsXml(xml){
  var out=[],re=/<si\b[^>]*>([\s\S]*?)<\/si>/g,m;
  while((m=re.exec(xml))){
    var blk=m[1],s='',t=/<t\b[^>]*>([\s\S]*?)<\/t>/g,tm;
    while((tm=t.exec(blk)))s+=xmlUnescape(tm[1]);
    out.push(s);
  }
  return out;
}
function parseSheetXml(xml,shared){
  var grid=[],rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g,rm;
  while((rm=rowRe.exec(xml))){
    var rowXml=rm[1],arr=[],cellRe=/<c\b([^>]*?)\/>|<c\b([^>]*?)>([\s\S]*?)<\/c>/g,cm;
    while((cm=cellRe.exec(rowXml))){
      var attrs=(cm[1]!=null?cm[1]:(cm[2]||'')),inner=cm[3]||'';
      var rA=/r="([^"]+)"/.exec(attrs);
      var ci=rA?colIndexFromRef(rA[1]):arr.length;
      if(ci<0)ci=arr.length;
      var tA=/t="([^"]+)"/.exec(attrs);
      var t=tA?tA[1]:'';
      var val='';
      if(t==='inlineStr'||t==='str'){
        var it=/<t\b[^>]*>([\s\S]*?)<\/t>/.exec(inner);
        val=it?xmlUnescape(it[1]):'';
      }else{
        var v=/<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        if(v){
          val=v[1];
          if(t==='s'){var si=Number(val);val=(shared&&shared[si]!=null)?shared[si]:'';}
          else val=xmlUnescape(val);
        }
      }
      arr[ci]=String(val);
    }
    for(var q=0;q<arr.length;q++)if(arr[q]==null)arr[q]='';
    if(arr.some(function(x){return String(x).trim()!=='';}))grid.push(arr);
  }
  return grid;
}
async function inflateRaw(data){
  if(typeof DecompressionStream==='undefined')throw new Error('当前环境不支持解压，请改用「粘贴 CSV」兜底通道');
  var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(st).text();
}
async function unzipXlsx(u8){
  var dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  var eocd=-1;
  for(var i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0)throw new Error('不是有效的 .xlsx（未找到 ZIP 结构）');
  var count=dv.getUint16(eocd+10,true),cdOff=dv.getUint32(eocd+16,true),p=cdOff,entries=[];
  for(var k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nameLen=dv.getUint16(p+28,true);
    var extraLen=dv.getUint16(p+30,true);
    var cmtLen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    entries.push({name:name,method:method,csize:csize,lho:lho});
    p+=46+nameLen+extraLen+cmtLen;
  }
  var wanted=/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/;
  var out={};
  for(var j=0;j<entries.length;j++){
    var e=entries[j];
    if(!wanted.test(e.name))continue;
    var lnl=dv.getUint16(e.lho+26,true),lel=dv.getUint16(e.lho+28,true);
    var start=e.lho+30+lnl+lel;
    var data=u8.subarray(start,start+e.csize);
    out[e.name]=(e.method===0)?new TextDecoder().decode(data):await inflateRaw(data);

}
async function readXlsxGrid(u8){
  var files=await unzipXlsx(u8);
  var shared=files['xl/sharedStrings.xml']?parseSharedStringsXml(files['xl/sharedStrings.xml']):[];
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);})
    .sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});

async function impHandleFile(file){
  if(!file)return;
  IMP.error='';IMP.fileName=file.name||'';IMP.busy=true;IMP.diff=null;IMP.grid=null;IMP.headers=null;IMP.decisions={};
  render();

    var nm=(file.name||'').toLowerCase();
    if(/\.csv$/.test(nm)){
      var text=await file.text();
      IMP.busy=false;IMP.text=text;IMP.fromExcel=false;IMP.showPaste=true;
      impParse();                     /* 第 1 步 → 第 2 步：只读表头 */
      return;
    }
    if(/\.xls$/.test(nm))throw new Error('.xls 为旧版二进制格式，请在 Excel 中另存为 .xlsx 后重试');
    if(!/\.xlsx$/.test(nm))throw new Error('仅支持 .xlsx / .csv（当前：'+(file.name||'未知')+'）');

/* ---------- 视图 4：队伍管理 ---------- */
function viewTeams(){
  var opts=S.events.map(function(e){return '<option value="'+e.id+'" '+(e.id===CUR_EVENT?'selected':'')+'>'+esc(e.name)+'</option>';}).join('');
  var ev=find(CUR_EVENT)||S.events[0];
  var tms=ev?S.teams.filter(function(t){return t.eventId===ev.id;}):[];
  var rows=tms.map(function(t){
    /* 进度列与「分台与顺位」卡**共用一个 teamScoreTag()**：三态互斥（已签 / 已录 / 待录）。
       原先这里是「签字 + 成绩」两个维度并排 —— 同一队会显出 4 个标签，而"第 N 轮未签 + 第 N 轮待录"
       其实是同一件事（还没录）的两种说法，读起来像 4 个状态。抽成一处也更难改漏。 */
    var prog=teamScoreTag(t);
    var st=t.status==='withdrawn'?'<span class="tag err">退赛</span>':'<span class="tag ok">在册</span>';
    var src=(t.source==='excel')?'<span class="tag b">WRC 导入</span>':((t.source==='excel_bulk')?'<span class="tag b">批量导入</span>':'<span class="tag">'+esc(impSourceName(t.source))+'</span>');
    var ev0=find(t.eventId)||{groups:['小学组','初中组']};
    var gOpts=(ev0.groups||['小学组','初中组']).map(function(g){return '<option '+(g===t.group?'selected':'')+'>'+esc(g)+'</option>';}).join('');
    var _sn=seatName(t.seatId);
    var seatCell=(t.seatId&&_sn!=='—')?(esc(_sn)+'<div class="small muted">'+sessionName(t.session)+'</div>'):'<span class="muted">未分台</span>';
    return '<tr><td><b>'+esc(t.no||'—')+'</b></td>'+
      '<td><b>'+esc(t.name)+'</b><div class="small muted">'+esc(t.members||'—')+'</div></td>'+
      '<td class="small">'+esc(t.school||'—')+'</td><td class="small">'+esc(t.coach||'—')+'</td>'+
      '<td><select style="max-width:112px" onchange="changeTeamGroup(\''+t.id+'\',this.value)">'+gOpts+'</select></td>'+
      '<td class="small">'+seatCell+'</td>'+
      '<td>'+st+'</td><td class="small">'+src+'</td>'+
      '<td>'+prog+'</td>'+
      '<td><span class="row tight"><button class="btn sm" onclick="toggleWithdraw(\''+t.id+'\')">'+(t.status==='withdrawn'?'恢复':'弃赛')+'</button>'+
      '<button class="btn sm danger" onclick="delTeam(\''+t.id+'\')">删除</button></span></td></tr>';
  }).join('');
  return '<div class="card"><h2>新增队伍 <small>手动录入通道（现场补录 / 临时队伍）</small></h2>'+
    '<div class="grid g3">'+

function selTeamEvent(id){CUR_EVENT=id;CUR_TEAM=null;render();}
function addTeam(){
  var n=(document.getElementById('ntName')||{}).value||'';
  var no=((document.getElementById('ntNo')||{}).value||'').trim();
  if(!n.trim()){alert('请填写队伍名称');return;}
  if(!no||!/^\d+$/.test(no)){alert('队伍编号必填且须为纯数字');return;}
  if(S.teams.some(function(t){return t.no===no;})){alert('队伍编号 '+no+' 已存在（编号须唯一）');return;}
  S.teams.push({id:uid('tm'),no:no,name:n.trim(),
    school:((document.getElementById('ntSchool')||{}).value||'').trim(),
    coach:((document.getElementById('ntCoach')||{}).value||'').trim(),
    eventId:CUR_EVENT,group:((document.getElementById('ntGroup')||{}).value||'').trim(),
    members:((document.getElementById('ntMembers')||{}).value||'').trim(),
    session:'both',   /* 参赛轮次默认「两轮」= 常态（一队上午第1轮、下午第2轮都打） */
    status:'active',source:'manual'});
  save();render();
}
function delTeam(id){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!confirm('删除该队伍及其成绩？'))return;
  S.teams=S.teams.filter(function(x){return x.id!==id;});
  delete S.scores[id];
  logAudit('删队',(t?t.name+'（'+t.no+'）':id),'在册','已删除','队伍数据清理');
  save();render();
}
function toggleWithdraw(id){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t)return;
  var to=(t.status==='withdrawn')?'active':'withdrawn';
  if(to==='withdrawn'&&!confirm('将「'+t.name+'」标记为弃赛？队伍与历史成绩保留（软删除，不物理删除）。'))return;
  var before=t.status||'active';
  t.status=to;
  logAudit('弃赛',t.name+'（'+t.no+'）',before,to,to==='withdrawn'?'选手弃赛（软删除，保留历史成绩）':'恢复参赛');
  save();render();
}
function changeTeamGroup(id,g){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t||t.group===g)return;
  var before=t.group;
  t.group=g;
  logAudit('改组',t.name+'（'+t.no+'）',before,g,'组别调整');
  save();render();
}
/* ---------- 分台与顺位（队伍管理页内） ---------- */
/* 依据《裁判打分系统》P2：平板端队列 = 本赛台队伍（按绑定自动过滤）+ 第 X 顺位 / 共 N 队；
   提交即终态下，完成度 = 赛项 × 组别级（多赛台汇总）。故此处维护「队伍 → 赛台 + 赛台内顺位」。 */
var TEAM_SEAT_GROUP='';
function selSeatGroup(v){TEAM_SEAT_GROUP=v;render();}
/* 分台卡自己的赛项下拉：分台是按赛项算的，而「赛台与赛程编排」页原先没有赛项上下文
   （搬到本页后必须有，否则不知道在给哪个赛项分台）。 */
function selSeatEvent(v){TEAM_SEAT_GROUP='';selSeatGroup('');CUR_EVENT=v;CUR_TEAM=null;render();}
function findTeam(id){var a=S.teams||[];for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function teamScoreTag(t){
  if(t.status==='withdrawn')return '<span class="tag err">退赛</span>';
  var rds=teamRounds(find(t.eventId)||{},t);
  /* 1 轮赛项只有一轮 —— 给每个标签再加「第 1 轮」前缀是纯噪音（现场只会读成"又强调了一次"）。
     2 轮赛项下前缀是必需的：同一个格子里要区分上午 / 下午两轮，不写轮次根本分不清。
     ⚠️ 前缀按**赛项**判（同列统一），但轮次只列该队**实际参赛**的（见 teamRounds）——
     否则只打第 1 轮的队会永远挂着「第 2 轮待录」，与发布门"已就位"自相矛盾。 */
  var one=(expectedRounds(find(t.eventId)||{}).length<2);
  return rds.map(function(rn){
    var rec=scoreRec(t.id,rn);
    var lb=one?'':('第 '+rn+' 轮');
    if(rec&&rec.signed)return '<span class="tag ok">'+lb+'已签</span>';
    if(rec&&Object.keys(rec.tasks||{}).length)return '<span class="tag b">'+lb+'已录</span>';
    return '<span class="tag">'+lb+'待录</span>';
  }).join(' ');
}
function teamSeatTeams(evId,group,seatId){
  return (S.teams||[]).filter(function(t){
    return t.eventId===evId&&t.status!=='withdrawn'&&(t.seatId||'')===seatId&&(!group||t.group===group);
  }).sort(function(a,b){return (Number(a.order)||9999)-(Number(b.order)||9999);});
}
/* ---------- 参赛轮次（第 1 轮 / 第 2 轮）----------
   赛制事实（用户 2026/10/09 确认）：**一个赛项里一支队伍要打两轮 —— 上午第 1 轮、下午第 2 轮**。
   所以「上午 / 下午」本质是轮次，而不是"分批"；常态值是「两轮」，只在某队确实只打一轮时才改。
   放在**队伍级**而不是场次级，是为了保住"单一事实源"：场次队伍全由它派生，不再有第二套存储。 */
var SESSIONS=[['1','第 1 轮'],['2','第 2 轮'],['both','两轮']];
function sessionName(v){for(var i=0;i<SESSIONS.length;i++){if(SESSIONS[i][0]===v)return SESSIONS[i][1];}return '两场';}
/* 参赛轮次：'both' = 两轮都打（= 赛制常态：一队上午第 1 轮、下午第 2 轮）。
   sessionHas(v, rn) 判断"这支队在第 rn 轮上不上场" —— 用**轮次**而不是时段，
   因为时段与轮次是绑定的（上午=第 1 轮、下午=第 2 轮），按轮次匹配更本质、也与后端 round_no 对齐。 */
function sessionHas(v,rn){v=v||'both';return v==='both'||String(rn)===String(v);}
function sessionOpts(cur){var c=cur||'both';return SESSIONS.map(function(x){
  return '<option value="'+x[0]+'" '+(c===x[0]?'selected':'')+'>'+x[1]+'</option>';}).join('');}
function setTeamSession(id,v){
  if(!perm('ref'))return;
  var t=findTeam(id);if(!t)return;
  var before=sessionName(t.session);
  t.session=v||'both';
  if(before!==sessionName(t.session))logAudit('分台',t.name+' 参赛轮次',before,sessionName(t.session),'轮次调整');
  save();render();
}

      '<tbody>'+(rows||'<tr><td colspan="6" class="muted">该赛台暂无队伍</td></tr>')+'</tbody></table></div>'+

      '<tbody>'+unassigned.map(function(t){return teamRow(t,'—');}).join('')+'</tbody></table></div></div>'
    : '';

  var evOpts2=S.events.map(function(e){return '<option value="'+e.id+'" '+(e.id===ev.id?'selected':'')+'>'+esc(e.name)+'</option>';}).join('');
  return '<div class="card"><div class="row">'+

      '<b>④ 分台可跨赛项复用</b>：同一张赛台在不同时段可承载不同赛项 / 组别（见「赛台与赛程编排」），分台与顺位不冲突。<br>'+

      +'只在某队确实只打一轮时才改它。<br>'+

      +'要只重排一部分就勾选后用「按编号均分选中队伍」。<br>'+

function moveTeamOrder(id,dir){if(!perm('ref'))return;
  var t=findTeam(id);if(!t||!t.seatId)return;
  var list=teamSeatTeams(t.eventId,TEAM_SEAT_GROUP,t.seatId);
  var idx=-1;for(var i=0;i<list.length;i++){if(list[i].id===id){idx=i;break;}}
  var to=idx+dir;
  if(idx<0||to<0||to>=list.length)return;
  var tmp=list[idx];list[idx]=list[to];list[to]=tmp;
  list.forEach(function(x,k){x.order=k+1;});
  logAudit('分台',seatName(t.seatId)+' 出赛顺位',t.name+' 原第 '+(idx+1)+' 位',t.name+' 现第 '+(to+1)+' 位','队列顺序调整');
  save();render();
}
function setTeamSeat(id,seatId){if(!perm('ref'))return;
  var t=findTeam(id);if(!t)return;
  if((t.seatId||'')===(seatId||''))return;
  var before=t.seatId?seatName(t.seatId):'未分台';
  t.seatId=seatId||'';
  if(t.seatId){
    var list=teamSeatTeams(t.eventId,TEAM_SEAT_GROUP,t.seatId);
    list.forEach(function(x,k){x.order=k+1;});
  }else{t.order=0;}
  logAudit('分台',t.name+'（'+t.no+'）',before,t.seatId?seatName(t.seatId):'未分台','队伍分台');
  save();render();
}
function autoDistributeSeats(){if(!perm('ref'))return;
  var ev=find(CUR_EVENT);if(!ev)return;
  var pool=(S.teams||[]).filter(function(t){
    return t.eventId===ev.id&&t.status!=='withdrawn'&&(!TEAM_SEAT_GROUP||t.group===TEAM_SEAT_GROUP);
  });
  if(!pool.length){alert('该赛项没有在册队伍');return;}
  if(!S.seats.length){alert('还没有配置赛台，请先到「赛台与赛程编排」新建赛台');return;}
  if(!confirm('一键自动分台：把 '+pool.length+' 支队伍按**编号顺序**平均分到 '+S.seats.length+' 张赛台？\n\n'
    +'· 顺序可预期：按编号升序排队，依次铺到各赛台（'+S.seats.map(function(x){return x.name;}).join(' → ')+' → 循环）\n'
    +'· 会覆盖现有分台与顺位；参赛轮次（第 1 / 第 2 轮）保持不变\n'
    +'· 场次里的队伍由分台**自动派生**，不用再逐场次分配'))return;
  /* 按编号升序排队后再轮流铺 —— "自动分台"的关键：结果可预期、可复算、可对着名单核对。
     原实现直接吃 S.teams 的库内顺序（≈导入顺序），现场看不出规律，等于每次结果不同。 */
  var ordered=pool.slice().sort(function(a,b){return (Number(a.no)||0)-(Number(b.no)||0);});
  var buckets={};S.seats.forEach(function(x){buckets[x.id]=[];});
  ordered.forEach(function(t,i){buckets[S.seats[i%S.seats.length].id].push(t.id);});
  S.seats.forEach(function(x){
    buckets[x.id].forEach(function(tid,k){var t=findTeam(tid);if(t){t.seatId=x.id;t.order=k+1;}});
  });
  var detail=S.seats.map(function(x){return x.name+' '+buckets[x.id].length+' 队';}).join('；');
  logAudit('分台','一键自动分台（按编号顺序）',pool.length+' 支待分台',detail,'自动均分（可手动调整）');
  save();render();
}
function autoDistributeSeatsSel(){
  if(!perm('ref'))return;
  var ev=find(CUR_EVENT);if(!ev)return;
  var ids=[];var nodes=document.querySelectorAll('.seatpick:checked');
  for(var ni=0;ni<nodes.length;ni++)ids.push(nodes[ni].value);

/* 依据《裁判打分系统》: 姓名 + 裁判码双因子鉴权；赛项×组别×赛台由工作人员后台建档时预绑；
   激活凭据缓存本地后断网也能登录；从未激活的新平板离线首登会被拒绝。 */
var REF_CODE_CHARS='23456789ABCDEFGHJKMNPQRSTUVWXYZ';   /* 6 位无歧义字符：排除 0 O 1 I L 等易混字符 */
function genRefCode(){
  function pick(){return REF_CODE_CHARS.charAt(Math.floor(Math.random()*REF_CODE_CHARS.length));}
  var c='',guard=0;
  do{c='';for(var i=0;i<6;i++)c+=pick();guard++;}
  while((S.referees||[]).some(function(r){return r.code===c;})&&guard<500);
  return c;
}
function findRef(id){var a=S.referees||[];for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function refRoleName(r){return r==='chief'?'裁判长':'普通裁判';}
function refRoleVal(n){return String(n||'').indexOf('长')>=0?'chief':'judge';}
function refBound(r){return !!(r&&r.bind&&r.bind.seatId);}
function refBindText(r){
  if(!refBound(r))return '<span class="muted">未预绑赛台</span>';
  var ev=find(r.bind.eventId)||{name:'—'};
  return esc(ev.name)+' · '+esc(r.bind.group||'—')+' · '+esc(seatName(r.bind.seatId));
}
function refStatusTag(r){
  if(r.status==='disabled')return '<span class="tag err">已停用</span>';
  if(!refBound(r))return '<span class="tag warn">未预绑赛台</span>';
  if(r.status==='activated')return '<span class="tag ok">已激活</span>';
  return '<span class="tag b">已发码 · 未激活</span>';
}

function bulkRefImport(){if(!perm('ref'))return;

  var lines=ta.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var n=0,skip=0,codes=[];
  lines.forEach(function(l){
    var p=l.split(/[,，]/);
    var nm=(p[0]||'').trim();
    if(!nm||(S.referees||[]).some(function(r){return r.name===nm;})){skip++;return;}
    var role=refRoleVal(p[1]);
    var evNm=(p[2]||'').trim();
    var ev=null;for(var i=0;i<S.events.length;i++){if(S.events[i].name===evNm||S.events[i].id===evNm){ev=S.events[i];break;}}
    var seatNm=(p[4]||'').trim();
    var seat='';for(var j=0;j<S.seats.length;j++){if(S.seats[j].name===seatNm){seat=S.seats[j].id;break;}}
    var code=genRefCode();
    S.referees.push({id:uid('rf'),name:nm,phone:'',role:role,code:code,status:'issued',
      bind:{eventId:ev?ev.id:'',group:(p[3]||'').trim(),seatId:seat},activatedAt:'',lastSeen:'',device:''});

  });

function updRefField(i,k,v){

function updRefBind(i,k,v){

function reissueCode(i){if(!perm('ref'))return;

function toggleRefDisable(i){if(!perm('ref'))return;

function delReferee(i){if(!perm('ref'))return;

/* ---------- 视图 12：执裁排班 ---------- */
/* 依据《裁判打分系统》P7c note4：执裁 assignment 由后台赛程 / 赛台排班下发；
   本赛台当日无待执裁场次 → 平板端裁判长「执裁」页签呈现 P7c 空状态。 */
var DUTY_DATE='2026-09-17';   /* 演示用比赛日（与种子数据同日） */
function slotTitle(sl){
  var ev=find(sl.eventId)||{name:'—'};
  return seatName(sl.seatId)+' · '+sl.period+' · 第 '+Number(sl.round||1)+' 轮 · '+ev.name+' · '+(sl.group||'—');
}
function slotJudges(sl){return (sl.judges||[]).filter(function(id){return !!findRef(id);});}
function dutySortedSlots(){
  return S.slots.slice().sort(function(a,b){
    var pa=(a.period==='上午'?0:1),pb=(b.period==='上午'?0:1);
    if(pa!==pb)return pa-pb;
    if(Number(a.round||1)!==Number(b.round||1))return Number(a.round||1)-Number(b.round||1);
    var na=seatName(a.seatId),nb=seatName(b.seatId);
    return na<nb?-1:(na>nb?1:0);
  });
}
function refsOfSlot(sl){
  var out=[];
  slotJudges(sl).forEach(function(id){var r=findRef(id);if(r)out.push({r:r,role:'judge'});});
  return out;
}
function refDutyRefs(refId){
  return dutySortedSlots().filter(function(sl){
    return (sl.judges||[]).indexOf(refId)>=0;
  });
}
function addJudgeToSlot(sid){if(!perm('ref'))return;
  var sl=slotById(sid);if(!sl)return;
  var el=document.getElementById('jd_'+sid);if(!el)return;
  var rid=el.value;if(!rid){alert('请先在下拉里选择裁判');return;}
  sl.judges=sl.judges||[];
  if(sl.judges.indexOf(rid)>=0){alert('该裁判已在本场次');return;}
  sl.judges.push(rid);
  var r=findRef(rid);
  logAudit('排班',slotTitle(sl),'—','增加裁判 '+(r?r.name:rid),'场次裁判指派');
  save();render();
}
function removeJudge(sid,rid){if(!perm('ref'))return;
  var sl=slotById(sid);if(!sl)return;
  sl.judges=(sl.judges||[]).filter(function(x){return x!==rid;});
  var r=findRef(rid);
  logAudit('排班',slotTitle(sl),'有 '+(r?r.name:rid),'—','取消裁判指派');
  save();render();
}
function clearSlotDuty(sid){if(!perm('ref'))return;
  var sl=slotById(sid);if(!sl)return;
  var n=refsOfSlot(sl).length;
  if(!n)return;
  if(!confirm('清空该场次执裁安排（'+n+' 人）？'))return;
  sl.judges=[];
  logAudit('排班',slotTitle(sl),n+' 人已排','已清空','重新排班');
  save();render();
}
function autoAssignDuty(){if(!perm('ref'))return;
  var hit=0,miss=[];
  S.slots.forEach(function(sl){
    if(isExtraSlot(sl))return;
    var pool=(S.referees||[]).filter(function(r){
      return r.status!=='disabled'&&r.bind&&r.bind.seatId===sl.seatId&&
             r.bind.eventId===sl.eventId&&r.bind.group===sl.group;
    });
    if(!pool.length){miss.push(slotTitle(sl));return;}
    var judges=pool.filter(function(r){return r.role!=='chief';});
    sl.judges=judges.map(function(r){return r.id;});
    hit++;
  });
  logAudit('排班','一键按预绑排班',miss.length+' 个场次无匹配裁判',hit+' 个场次已按预绑填充','按「赛项 × 组别 × 赛台」预绑自动匹配');
  save();
  alert('已排班 '+hit+' 个场次。'+(miss.length?('\n\n以下 '+miss.length+' 个场次预绑范围内没有裁判，需手动指派或先补裁判档案：\n'+miss.join('\n')):''));
  render();
}

    '</div>'+

      '<b>② 触发条件是「有赛台、无场次」</b>：登录本身已要求预绑赛台（见「裁判档案与裁判码」），所以空状态只可能是「今日没排到活」，不可能是「没绑赛台」。<br>'+
