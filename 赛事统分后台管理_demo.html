<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainCo 赛事统分后台管理 · Demo</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#e4e8ee;--txt:#1b2027;--muted:#6b7280;
  --brand:#185FA5;--brand-d:#124a80;--ok:#2f6b0f;--warn:#9a6410;--err:#a32d2d;
  --okbg:#eaf3de;--warnbg:#faeeda;--errbg:#fcebeb;--soft:#f7f9fc;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
.side{width:228px;flex:0 0 228px;background:#0e1a2b;color:#c7d3e3;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid #1e2f47;margin-bottom:14px}
.brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2f7fd1,#5b4bc4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 30px}
.brand b{display:block;color:#fff;font-size:14px;line-height:1.3}
.brand span{font-size:11.5px;color:#7d8ea6}
.ngroup{font-size:11px;color:#61728c;letter-spacing:.06em;padding:12px 8px 6px}
.ni{display:block;padding:9px 12px;border-radius:8px;color:#c7d3e3;cursor:pointer;margin-bottom:3px;font-size:13.5px;user-select:none}
.ni:hover{background:#182a42;color:#fff}
.ni.on{background:#1b63ab;color:#fff;font-weight:500}
.side .foot{margin-top:18px;padding:10px 12px;border-radius:8px;background:#132339;font-size:11.5px;color:#7d8ea6;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:8;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:#eef4fb;color:#1c5288;border:1px solid #d8e6f5}
.pill i{width:7px;height:7px;border-radius:50%;background:#3fae5a;display:inline-block}
.wrap{padding:20px 22px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g12{grid-template-columns:260px minmax(0,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lb{font-size:12.5px;color:var(--muted)}
.kpi .nm{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.kpi .ft{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfcfe}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--txt)}
.btn:hover{border-color:#c3ccd8}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--err);border-color:#f0c9c9}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid #cfe2f6;border-color:var(--brand)}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
input[type=range]{padding:0;border:none;background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#eef2f7;color:#4a5768}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:var(--err)}
.tag.b{background:#e8f1fb;color:#1c5288}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li:last-child{border-bottom:none}
.li:hover{background:var(--soft)}
.li.on{background:#eaf2fb;border-left:3px solid var(--brand);padding-left:9px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.note{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#41506a;line-height:1.7}
.drop{display:block;border:2px dashed #c3ccd8;border-radius:12px;padding:26px 20px;text-align:center;cursor:pointer;background:#fbfcfe}
.drop:hover{border-color:var(--brand);background:#f4f9fe}
.drop b{display:block;font-size:14px;color:var(--brand);margin-bottom:4px}
.drop span{font-size:12.5px;color:var(--muted)}
.slot{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:96px;cursor:pointer}
.slot:hover{border-color:#a9c6e6}
.slot.sel{border-color:var(--brand);box-shadow:0 0 0 2px #d9e8f7}
.slot.extra{border-color:#f0c9a0;background:#fffaf3}
.slot.empty{border:1px dashed #c3ccd8;background:#fbfcfe;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;min-height:96px}
.slot.empty:hover{border-color:var(--brand);color:var(--brand)}
.screen-box{background:#0d1b2a;border-radius:12px;padding:16px 20px;color:#e8eef6}
.screen-box .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #22384f;padding-bottom:9px;margin-bottom:10px;font-size:13px}
.screen-box .hd b{font-size:15px;color:#fff}
.screen-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed #1d3145;font-size:13.5px}
.screen-row:last-child{border-bottom:none}
.screen-row .rk{width:32px;text-align:center;font-weight:700;color:#8fd0ff}
.screen-row .tm{flex:1.4;font-weight:600;color:#fff}
.screen-row .sc{flex:2.4;color:#a9bed4;font-size:12.5px}
.screen-row .aw{flex:0.9;text-align:right;color:#ffd479;font-size:12.5px}
.screen-foot{text-align:center;font-size:11.5px;color:#6d8399;padding-top:9px;border-top:1px solid #1d3145;margin-top:8px}
.range{display:flex;align-items:center;gap:10px}
.range b{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.thumb{text-align:center;font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between}
.vres{margin-top:10px;font-size:12.5px;line-height:1.8}
.vres .e{color:var(--err)}
.vres .w{color:var(--warn)}
.vres .k{color:var(--ok)}
.snap{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.pub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.pub h3{margin:0 0 4px;font-size:17px;text-align:center;font-weight:600}
.pub .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px}
.award1{color:#a32d2d;font-weight:500}
.award2{color:#9a6410;font-weight:500}
.award3{color:#2f6b0f;font-weight:500}
.dd{position:relative;display:inline-block;min-width:240px;z-index:60}
.dd-sum{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:#222}
.dd-sum:hover{border-color:#bbb}
.dd .caret{color:#888;font-size:11px;flex:none}
.dd-backdrop{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,0)}
.dd-body{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:56;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column;gap:2px}
.dd-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.dd-opt:hover{background:#f4f7fb}
.dd-opt input{margin:0;width:15px;height:15px;accent-color:var(--ok)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g12,.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BrainCo 赛事统分后台管理 · 单文件 Demo
   参考开源：SRComp(compstate 配置治理/榜单)、CodaLab(competition.yaml 声明式赛项)、
             ICPC CCS(contest.json + 实时 standings)、The Purple Standard(任务原语)
   数据模型对齐：赛事统分系统_配置Schema_v1.json / 三赛项种子数据.json
   ============================================================ */
var KEY='brainco_scoring_admin_v1';
/* ---------- 赛事（场次）索引 ----------
   口径：「赛事」= 一次具体举办（如「2026 WRC 中国区总决赛 · 杭州」）；
         「赛项」= 赛事内的比赛项目（脑机星球 / 火星救援 / 未来之城），见 S.events。
   过去只有「赛项」这一层，全站数据是单场赛事的扁平库；
   现在每场赛事拥有独立数据空间（独立 localStorage key），队伍 / 成绩 / 规则快照 / 锁 /
   工单 / 留底 / 审计 / 裁判码 全部按赛事隔离，切换赛事 = 切换整套数据。 */
var CKEY='brainco_contests_v1';   /* 赛事索引（唯一一份，跨赛事共享） */
var CONTESTS=[];                  /* [{id,name,season,start,end,venue,host,status,createdAt,updatedAt,archivedAt,note}] */
var CUR_CONTEST='';               /* 当前赛事 id */
var CONTEST_STATUS={prep:'筹备中',live:'进行中',done:'已结束',archived:'已归档'};
/* 「当前赛事」按**标签**独立存 sessionStorage：
   两地同时办赛时，总部一台电脑开多个标签，各自守自己那场，互不带走。
   索引里的 cur 只作为「新标签的默认起点」。 */
var CKEY_CUR='brainco_contests_cur_tab';
var REF_TIME=120;                 // 时间奖励基准时长（秒），demo 常量，实际由赛制给定
var TIERS={'一等奖':0.1,'二等奖':0.2,'三等奖':0.3};

var VIEW='dash';
var CUR_EVENT='brain_planet';     // 赛项与规则页当前编辑赛项
var SCORE_EVENT='brain_planet';   // 裁判打分页当前赛项
var CUR_TEAM=null;                // 打分页当前队伍
var RANK_EVENT='brain_planet';    // 榜单页当前赛项
var PUB_EVENT='brain_planet';     // 公示页当前赛项
var PUB_ANON=false;
var SCORE_ENTRY_ROLE='sync';      // 后台录入身份：ops=工作人员代录 / sync=现场回传（平板）；默认按现场回传记账，手工代录需手动切换

/* 本机偏好存储键（后台需联网使用：不做离线兜底、不做后端双模式） */
var STORE_KEY='brainco_backend_v1';   // 沿用旧键名，保留已保存的录入身份偏好
function loadEntryRole(){try{var v=localStorage.getItem(STORE_KEY+'_entryrole_v2');if(v==='ops'||v==='sync')SCORE_ENTRY_ROLE=v;}catch(e){}}
function saveEntryRole(){try{localStorage.setItem(STORE_KEY+'_entryrole_v2',SCORE_ENTRY_ROLE);}catch(e){}}
loadEntryRole();

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(p){return p+Math.random().toString(36).slice(2,7);}
function download(name,text,mime){
  var b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
}
function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

       opinion:'裁定更正：按原始明细复现后下调（自批 · 已生成告警）',takeover:''},

    ],
    /* 争议工单台账 D-00x */
    disputes:[
      {no:'D-001',teamId:'bp2',eventId:'brain_planet',group:'小学组',type:'用时争议（计时 / 停表异议）',
       source:'裁判端 P5.10',by:'王老师',ts:'2026-09-17 09:40',status:'已裁定',

/* 已删除赛事的墓碑：防止「合并式写入」把别的标签刚删掉的赛事又救回来 */
function removedKey(){return CKEY+'_removed';}
function loadTomb(){try{var r=localStorage.getItem(removedKey());if(r){var a=JSON.parse(r);if(a&&a.length)return a;}}catch(e){}return [];}
function addTomb(id){var t=loadTomb();if(t.indexOf(id)<0){t.push(id);try{localStorage.setItem(removedKey(),JSON.stringify(t));}catch(e){}}}

/* 合并式写入：先读盘上最新索引，按 id 合并后再写回。
   原实现是「整份覆盖」，实测两地同时办赛时会出事故：
   A 场地新建的赛事，被 B 场地一次普通保存（内存里还是旧索引）整份覆盖 → 赛事从索引消失（数据成孤儿）。
   合并规则：盘上有而本标签没有的 → 收编（别的标签新建的）；同 id → updatedAt 更新的赢。 */
function saveContests(){
  var diskList=[];
  try{var raw=localStorage.getItem(CKEY);if(raw){var d=JSON.parse(raw);diskList=(d&&d.list)||[];}}catch(e){}
  var tomb=loadTomb(),mem={};
  CONTESTS.forEach(function(c){if(c&&c.id)mem[c.id]=c;});
  var out=[],seen={};
  function push(c){if(!c||!c.id)return;if(tomb.indexOf(c.id)>=0)return;if(seen[c.id])return;seen[c.id]=1;out.push(c);}
  function pick(a,b){if(!a)return b;if(!b)return a;return ((b.updatedAt||'')>(a.updatedAt||''))?b:a;}
  diskList.forEach(function(c){push(pick(mem[c.id],c));});
  CONTESTS.forEach(push);
  if(!out.length)out=CONTESTS.slice();
  CONTESTS=out;
  try{localStorage.setItem(CKEY,JSON.stringify({cur:CUR_CONTEST,list:CONTESTS}));}catch(e){}
}

   不另写一套算分（两套算法迟早会漂移）。 */
function withContestData(cid,fn){
  var raw=null;try{raw=localStorage.getItem(ckey(cid));}catch(e){}
  if(!raw)return null;
  var keepS=S,keepCur=CUR_CONTEST;

  try{return fn(S);}finally{S=keepS;CUR_CONTEST=keepCur;}
}

function patchContestData(cid,fn){
  var raw=null;try{raw=localStorage.getItem(ckey(cid));}catch(e){}
  if(!raw)return null;
  var d=JSON.parse(raw);
  var r=fn(d);

}

function writeContest(cid,fn){

}

  if(!d)return {events:0,teams:0,signed:0,published:0,queued:0,ready:false};
  var signed=0,scores=d.scores||{};
  for(var k in scores){if(scores[k]&&scores[k].signed)signed++;}
  var queued=0;(d.changeRequests||[]).forEach(function(r){if(r.status==='待审批')queued++;});
  (d.disputes||[]).forEach(function(x){if(x.status==='待裁定')queued++;});
  (d.alerts||[]).forEach(function(a){if(a.status==='待处理')queued++;});
  return {events:(d.events||[]).length,teams:(d.teams||[]).length,signed:signed,
    published:Object.keys(d.published||{}).length,queued:queued,ready:true};

/* ---------- 计分引擎（替代原 Excel 公式，对应引擎改造设计 compute_total） ---------- */
function getInputItems(ev){
  var items=(ev.tasks||[]).map(function(t){return clone(t);});
  (ev.bonusRules||[]).forEach(function(b){
    if(b.template==='count_bonus'&&b.params&&b.params.taskId){
      var tid=b.params.taskId;
      if(!items.some(function(i){return i.id===tid;})){
        items.push({id:tid,name:tid+'（计数项）',type:'count',weight:b.params.perUnit,control:'counter'});
      }
    }
  });
  return items;
}
function taskRawScore(t,val){
  if(val===''||val==null)return null;
  if(t.type==='toggle')return val?Number(t.maxScore)||0:0;
  if(t.type==='enum'){var m=t.enumMap||{};return Object.prototype.hasOwnProperty.call(m,val)?Number(m[val]):0;}
  if(t.type==='count')return (Number(val)||0)*(Number(t.weight)||0);
  return Number(val)||0;
}
function computeTotal(ev,rec){
  rec=rec||{};
  var st=rec.tasks||{};
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'weighted_sum';
  var tasks=ev.tasks||[];
  var base=0,scored=0;
  if(tpl==='weighted_sum'){
    tasks.forEach(function(t){
      var raw=taskRawScore(t,st[t.id]);
      if(raw==null)return;
      scored++;
      var norm=(t.type==='numeric'&&t.maxScore)?raw/t.maxScore*100:raw;
      base+=norm*(Number(t.weight)||0);
    });
  }else if(tpl==='sum'){
    tasks.forEach(function(t){var raw=taskRawScore(t,st[t.id]);if(raw==null)return;scored++;base+=raw;});
  }else{
    var vals=tasks.map(function(t){return taskRawScore(t,st[t.id]);}).filter(function(v){return v!=null;});
    scored=vals.length;
    base=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:0;
  }
  var bonus=0;
  (ev.bonusRules||[]).forEach(function(b){
    var p=b.params||{};
    if(b.template==='time_bonus'){
      var t=Number(rec.time)||0;
      if(t>0){var v=(REF_TIME-t)*(Number(p.perSecond)||0);if(v<0)v=0;if(p.cap!=null)v=Math.min(v,Number(p.cap));bonus+=v;}
    }else if(b.template==='count_bonus'&&p.taskId){
      var c=Number(st[p.taskId])||0;var w=c*(Number(p.perUnit)||0);if(p.cap!=null)w=Math.min(w,Number(p.cap));bonus+=w;
    }
  });
  /* 判罚（黄 / 红牌）不计分：官方口径为只作记录 + 影响并列排序，不参与任何算分。
     仅当赛项被显式配成 per_card（历史配置兼容）时才按牌扣分。 */
  var penalty=0;
  if(ev.penaltyRule&&ev.penaltyRule.template==='per_card'){
    var q=ev.penaltyRule.params||{};
    penalty=(Number(rec.yellow)||0)*(Number(q.yellow)||0)+(Number(rec.red)||0)*(Number(q.red)||0);
  }
  var yellow=Number(rec.yellow)||0, red=Number(rec.red)||0;
  return {total:Math.max(0,base+bonus-penalty),base:base,bonus:bonus,penalty:penalty,yellow:yellow,red:red,
          complete:tasks.length>0&&scored===tasks.length};
}
function phaseSubtotal(ev,rec,phaseId){
  rec=rec||{};var st=rec.tasks||{};
  var sum=0;
  (ev.tasks||[]).forEach(function(t){
    if(t.phase!==phaseId)return;
    var raw=taskRawScore(t,st[t.id]);
    if(raw==null)return;
    sum+=raw;
  });
  return sum;
}
/* 「取消资格」= 不可撤销 + 成绩作废 + 不进榜单不计奖项；与「弃赛」（队伍主动退赛，可恢复）是两件事 */
function activeDqOf(teamId){
  var a=S.dqCases||[];
  for(var i=0;i<a.length;i++){if(a[i].teamId===teamId&&a[i].status==='已生效')return a[i];}
  return null;
}
function isVoided(teamId){return !!activeDqOf(teamId);}
function voidedTeamsOf(evId){
  return (S.teams||[]).filter(function(t){return t.eventId===evId&&isVoided(t.id);});
}
function substituteMode(){return (S.substituteRule&&S.substituteRule.mode)==='rank'?'rank':'none';}
function substituteModeName(){return substituteMode()==='rank'?'按名次顺延':'不递补（空缺不补）';}
/* 原榜 = 取消资格之前的排名与奖项（含作废队），用于「影响预览」与「空缺奖项」判定 */
function rankAll(evId){
  var ev=find(evId);if(!ev)return [];
  var tb=(ev.rankRule&&ev.rankRule.tieBreak)||['score','time'];
  var list=S.teams.filter(function(t){return t.eventId===evId;}).map(function(t){
    var r=S.scores[t.id]||{};
    var c=computeTotal(ev,r);
    return {team:t,total:c.total,base:c.base,bonus:c.bonus,penalty:c.penalty,yellow:c.yellow,red:c.red,complete:c.complete,time:Number(r.time)||0};
  });
  list.sort(function(a,b){
    if(b.total!==a.total)return b.total-a.total;
    for(var i=0;i<tb.length;i++){if(tb[i]==='time'&&a.time!==b.time)return a.time-b.time;}
    return a.team.name.localeCompare(b.team.name,'zh');
  });
  var tiers=(ev.rankRule&&ev.rankRule.awardTiers)||{};
  var idx=0;
  Object.keys(tiers).forEach(function(name){
    var cnt=Math.ceil(list.length*(Number(tiers[name])||0));
    for(var i=0;i<cnt&&idx<list.length;i++,idx++)list[idx].origAward=name;
  });
  list.forEach(function(r,i){r.origRank=i+1;r.award=r.origAward||'';});
  return list;
}
function applyAwards(list,n,tiers){
  list.forEach(function(r){r.award='';});
  var idx=0;
  Object.keys(tiers).forEach(function(name){
    var cnt=Math.ceil(n*(Number(tiers[name])||0));
    for(var i=0;i<cnt&&idx<list.length&&idx<n;i++,idx++)list[idx].award=name;
  });
}
function standings(evId){
  var ev=find(evId);if(!ev)return [];
  var tiers=(ev.rankRule&&ev.rankRule.awardTiers)||{};
  var all=rankAll(evId);
  var rows=all.filter(function(r){return !isVoided(r.team.id);});
  if(substituteMode()==='rank'){
    applyAwards(rows,rows.length,tiers);                       /* 顺延：下一名替补上位 */
  }else{
    rows.forEach(function(r){r.award=r.origAward||'';});        /* 不递补：沿用原榜奖项，作废队的奖项空缺 */
  }
  rows.forEach(function(r,i){
    r.rank=i+1;
    r.tie=(i>0&&rows[i-1].total===r.total);
  });
  return rows;
}
/* 作废队 + 因此空缺的奖项（不递补时才可能空缺） */
function voidedInfo(evId){
  var all=rankAll(evId);
  var rows=all.filter(function(r){return !isVoided(r.team.id);});
  var voided=all.filter(function(r){return isVoided(r.team.id);});
  var vacant=[];
  if(substituteMode()!=='rank'){
    voided.forEach(function(v){
      if(v.origAward&&!rows.some(function(r){return r.award===v.origAward;})&&vacant.indexOf(v.origAward)<0)vacant.push(v.origAward);
    });
  }
  return {voided:voided,vacant:vacant,all:all};
}
function validateEvent(ev){
  var errs=[],warns=[];
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'';
  var wsum=(ev.tasks||[]).reduce(function(s,t){return s+(Number(t.weight)||0);},0);
  if(tpl==='weighted_sum'&&Math.abs(wsum-1)>0.001)warns.push('numeric 任务权重之和 = '+wsum.toFixed(2)+'，weighted_sum 下建议 = 1.0');
  var seen={};
  (ev.tasks||[]).forEach(function(t){
    if(seen[t.id])errs.push('任务 id 重复：'+t.id);
    seen[t.id]=1;
    if(!t.name)errs.push('存在未命名的任务');
    if(t.type==='enum'&&(!t.enumMap||!Object.keys(t.enumMap).length))errs.push('enum 任务「'+t.name+'」缺少等级映射 enumMap');
  });
  (ev.bonusRules||[]).forEach(function(b,i){
    if(b.template==='count_bonus'){
      var tid=b.params&&b.params.taskId;
      if(!tid)errs.push('奖励规则 #'+(i+1)+' 未指定 taskId');
      else{
        var okAny=(ev.bonusRules||[]).some(function(x){return x.params&&x.params.taskId===tid;})||(ev.tasks||[]).some(function(t){return t.id===tid;});
        if(!okAny)errs.push('奖励规则 #'+(i+1)+' 引用的任务「'+tid+'」不存在');
      }
    }
  });
  var tierSum=Object.keys(ev.rankRule&&ev.rankRule.awardTiers||{}).reduce(function(a,k){return a+Number(ev.rankRule.awardTiers[k]||0);},0);
  if(tierSum>1.0001)warns.push('奖项占比之和 = '+tierSum.toFixed(2)+'，建议 ≤ 1.0');
  if(tierSum===0)warns.push('奖项占比全为 0，榜单将不分配奖项');
  if(ev.customFormula!=null)errs.push('customFormula 必须为 null（本期 A 档不支持自定义公式）');
  var rds=Number(ev.rounds||1);
  if(rds>=2){
    var hasR1=false,hasR2=false;
    (S.slots||[]).forEach(function(x){
      if(x.eventId!==ev.id)return;
      if(Number(x.round||1)===2)hasR2=true;else hasR1=true;
    });
    if(hasR1&&!hasR2)warns.push('本赛项配置为 '+rds+' 轮，但赛程里只有第 1 轮场次，未安排第 2 轮（见「赛台与赛程编排」）');
  }
  return {errs:errs,warns:warns};
}

function createContest(){
  var n=(NC.name||'').trim();

  var id=uid('ct_');
  var stf=parseStaff(NC.staff);
  if(!stf.length)stf=[currentUser().name];   /* 不填就默认当前登录人 */
  var c={id:id,name:n,season:(NC.season||'').trim(),start:NC.start||'',end:NC.end||'',
    venue:(NC.venue||'').trim(),host:(NC.host||'').trim(),staff:stf,status:'prep',
    createdAt:nowStr(),updatedAt:nowStr(),archivedAt:'',note:''};
  var data;
  if(NC.mode==='copy' && contestById(NC.src)){
    data=clone(loadContest(NC.src));
    /* 复制赛项与规则配置，不复制队伍与成绩（新赛事的人是另一批、成绩从零开始） */
    data.teams=[];data.scores={};
    data.published={};data.pubDirty={};data.handoff={};data.locks={};
    data.alerts=[];data.changeRequests=[];data.disputes=[];data.dqCases=[];data.evidence=[];
    data.auditLogs=[];data.importLogs=[];data.snapshots=[];
    data.slots=(data.slots||[]).map(function(x){return Object.assign({},x,{teams:[],chief:'',judges:[],snapshot:null});});
    /* 裁判名册：可勾选是否沿用。沿用也只带「人」（姓名/电话/角色），裁判码与赛台绑定是赛事级凭证，一律清空。 */
    data.referees=NC.copyRefs
      ? (data.referees||[]).map(function(r){return Object.assign({},r,{code:'',status:'issued',bind:{eventId:'',group:'',seatId:''},activatedAt:'',lastSeen:'',device:''});})
      : [];
    c.note='由「'+contestName(NC.src)+'」复制赛项与规则配置新建（不含队伍与成绩'+(NC.copyRefs?'，裁判名册沿用、裁判码需重发':'，裁判名册不带入')+'）';

/* 只读快照：不改当前赛事，直接读每一场自己的数据空间 */
function contestSnapshot(cid){
  var d=null;
  try{var raw=localStorage.getItem(ckey(cid));if(raw)d=JSON.parse(raw);}catch(e){}
  var c=contestById(cid)||{};
  var out={id:cid,name:c.name||'',status:c.status||'',start:c.start||'',end:c.end||'',
    venue:c.venue||'',staff:(c.staff||[]).slice(),ready:!!d,
    teams:0,signed:0,published:0,req:0,dis:0,alert:0,events:[]};
  if(!d)return out;
  out.teams=(d.teams||[]).length;
  var scores=d.scores||{};
  for(var k in scores){if(scores[k]&&scores[k].signed)out.signed++;}
  out.published=Object.keys(d.published||{}).length;
  (d.changeRequests||[]).forEach(function(r){if(r.status==='待审批')out.req++;});
  (d.disputes||[]).forEach(function(r){if(r.status==='待裁定')out.dis++;});
  (d.alerts||[]).forEach(function(r){if(r.status==='待处理')out.alert++;});
  out.events=(d.events||[]).map(function(e){
    var tms=(d.teams||[]).filter(function(t){return t.eventId===e.id;});
    return {name:e.name,teams:tms.length,
      signed:tms.filter(function(t){var r=scores[t.id];return !!(r&&r.signed);}).length,
      published:!!((d.published||{})[e.id])};
  });
  return out;
}
/* 排班冲突：同一个值守人被排到赛期重叠的两场 —— 这是真冲突，必须重新安排人 */
function staffConflicts(){
  var out=[];
  CONTESTS.forEach(function(a){
    CONTESTS.forEach(function(b){
      if(a.id>=b.id)return;
      if(!overlappingContests(a).some(function(x){return x.id===b.id;}))return;
      var both=(a.staff||[]).filter(function(n){return (b.staff||[]).indexOf(n)>=0;});
      if(both.length)out.push({a:a,b:b,names:both});
    });
  });
  return out;
}

/* ---------- 开赛就绪度：运营最关心的一句话「这场能不能开赛」 ---------- */
function readinessOf(cid){
  var cur=CUR_CONTEST,box={v:null};
  function run(){
    var teams=S.teams||[],slots=(S.slots||[]).filter(function(x){return x.type!=='extra';});
    var evs=S.events||[],refs=S.referees||[];
    box.v={
      events:evs.length,teams:teams.length,slots:slots.length,refs:refs.length,
      ruleBad:evs.filter(function(e){return validateEvent(e).errs.length>0;}).length,
      unseated:teams.filter(function(t){return !t.seatId;}).length,
      emptySlots:slots.filter(function(x){return !((x.teams||[]).length);}).length,
      unstaffed:slots.filter(function(x){return !x.chief&&!((x.judges||[]).length);}).length,
      idle:refs.filter(function(r){return r.status!=='activated';}).length
    };
  }
  if(cid===cur)run();else withContestData(cid,function(){run();});
  return box.v;
}
function readinessItems(cid){
  var r=readinessOf(cid);if(!r)return null;
  var items=[
    {k:'规则已校验',ok:r.events>0&&r.ruleBad===0,good:r.events+' 个赛项全部通过',
     bad:(r.events===0?'还没有配置赛项':(r.ruleBad+' 个赛项配置有误')),view:'events'},
    {k:'队伍已导入',ok:r.teams>0,good:r.teams+' 支在册',
     bad:'还没有队伍（可走 WRC 报名导入，或手工补报）',view:'import'},
    {k:'队伍已分台',ok:r.teams>0&&r.unseated===0,good:r.teams+' 支全部分台',
     bad:(r.unseated+' 支未分台 —— 到「队伍管理」点「自动分台」'),view:'teams'},
    {k:'场次已排队伍',ok:r.slots>0&&r.emptySlots===0,good:r.slots+' 个场次都排了队伍',
     bad:(r.slots===0?'还没有编排场次':(r.emptySlots+' 个场次还是空的 —— 到「赛台与赛程」点「按赛台分配队伍」')),view:'seats'},
    {k:'裁判已激活',ok:r.refs>0&&r.idle===0,good:r.refs+' 人全部激活',
     bad:(r.refs===0?'还没有裁判档案':(r.idle+' 人未激活 —— 本人还没在平板上登录过，现场最容易卡在这里')),view:'referees'},
    {k:'场次已排班',ok:r.slots>0&&r.unstaffed===0,good:'全部场次已排班',
     bad:r.unstaffed+' 个场次没排裁判 —— 到「执裁排班」一键按预绑排班',view:'duty'}
  ];
  return {r:r,items:items,bad:items.filter(function(x){return !x.ok;})};
}

var XR={contests:{},event:'all',group:'all'};
function xrInit(){if(!Object.keys(XR.contests).length)CONTESTS.forEach(function(c){XR.contests[c.id]=true;});}
function xrToggle(cid){xrInit();XR.contests[cid]=!XR.contests[cid];render();}
function xrAll(on){xrInit();CONTESTS.forEach(function(c){XR.contests[c.id]=!!on;});render();}
function xrSet(k,v){XR[k]=v;render();}
function crossFilterOptions(){
  var evs=[],gs=[];
  CONTESTS.forEach(function(c){
    withContestData(c.id,function(){
      (S.events||[]).forEach(function(e){
        if(!evs.some(function(x){return x.id===e.id;}))evs.push({id:e.id,name:e.name});
        ((e.groups)||[]).forEach(function(g){if(gs.indexOf(g)<0)gs.push(g);});
      });
    });
  });
  return {evs:evs,gs:gs};
}
/* 逐场逐赛项取榜单，按「队名 + 学校」把同一支队伍跨场合起来 */
function crossRanks(){
  xrInit();
  var byTeam={},order=[],champs=[],used=0;
  CONTESTS.forEach(function(c){
    if(!XR.contests[c.id])return;
    if(!contestSnapshot(c.id).ready)return;
    used++;
    withContestData(c.id,function(){
      (S.events||[]).forEach(function(ev){
        if(XR.event!=='all'&&ev.id!==XR.event)return;
        var rows=standings(ev.id);
        rows.forEach(function(r){
          if(XR.group!=='all'&&(r.team.group||'')!==XR.group)return;
          var key=(r.team.name||'')+'|'+(r.team.school||'');
          if(!byTeam[key]){byTeam[key]={key:key,name:r.team.name,school:r.team.school||'',members:r.team.members||'',items:[]};order.push(key);}
          byTeam[key].items.push({contestId:c.id,contest:c.name,event:ev.name,group:r.team.group||'',
            rank:r.rank,total:r.total,award:r.award||'',of:rows.length});
        });
        if(rows.length)champs.push({contest:c.name,event:ev.name,group:rows[0].team.group||'',
          name:rows[0].team.name,school:rows[0].team.school||'',total:rows[0].total,award:rows[0].award||''});
      });
    });
  });
  var list=order.map(function(k){
    var t=byTeam[k];
    t.count=t.items.length;
    t.best=Math.min.apply(null,t.items.map(function(x){return x.rank;}));
    t.avg=t.items.reduce(function(a,b){return a+b.total;},0)/t.count;
    t.awards=t.items.map(function(x){return x.award;}).filter(function(a){return !!a;});
    t.froms=t.items.map(function(x){return x.contest;}).filter(function(v,i,a){return a.indexOf(v)===i;});
    t.multi=(t.froms.length>1);
    return t;
  });
  /* 刻意不按总分排序：跨赛事赛制/难度不同，总分不可比。按「参赛场次 → 最佳名次 → 平均分」看趋势 */
  list.sort(function(a,b){return (b.count-a.count)||(a.best-b.best)||(b.avg-a.avg)||a.name.localeCompare(b.name,'zh');});
  champs.sort(function(a,b){return (a.contest+a.event).localeCompare(b.contest+b.event,'zh');});
  return {list:list,champs:champs,used:used};
}

/* ---------- 跨赛事人员复用（复用的是「人」，不是凭证） ---------- */
function refereePool(){
  var pool={},order=[];
  var curId=CUR_CONTEST;   /* 必须在进入 withContestData 之前抓下来 —— 里面 CUR_CONTEST 会被临时换掉 */
  CONTESTS.forEach(function(c){
    withContestData(c.id,function(){
      (S.referees||[]).forEach(function(r){
        var k=(r.name||'')+'|'+(r.phone||'');
        if(!pool[k]){pool[k]={key:k,name:r.name,phone:r.phone,role:r.role,froms:[],cur:false,code:''};order.push(k);}
        if(pool[k].froms.indexOf(c.id)<0)pool[k].froms.push(c.id);
        if(c.id===curId){pool[k].cur=true;pool[k].code=r.code||'';}
      });
    });
  });
  return order.map(function(k){return pool[k];});
}
function importReferee(key){
  if(readonlyGuard())return;
  var p=refereePool().filter(function(x){return x.key===key;})[0];
  if(!p){alert('未找到该人员。');return;}
  if(p.cur){alert('「'+p.name+'」已经在当前赛事的裁判档案里了。');return;}
  S.referees=S.referees||[];
  var used={};S.referees.forEach(function(r){used[r.id]=true;});
  var id;do{id=uid('rf_');}while(used[id]);
  S.referees.push({id:id,name:p.name,phone:p.phone,role:p.role,code:'',status:'issued',
    bind:{eventId:'',group:'',seatId:''},activatedAt:'',lastSeen:'',device:''});
  logAudit('改配置','裁判档案 · 复用人员 '+p.name,'（不在本场名单）','已加入（待发裁判码）','跨赛事人员复用');
  render();
}
function importAllReferees(){
  if(readonlyGuard())return;
  var pool=refereePool().filter(function(x){return !x.cur;});
  if(!pool.length){alert('没有可复用的人员（其他赛事的裁判都已在当前赛事名单里）。');return;}
  if(!confirm('把其他赛事的 '+pool.length+' 位裁判加入「'+contestName(CUR_CONTEST)+'」？\n（只带入姓名 / 电话 / 角色；裁判码与赛台绑定是赛事级凭证，不会带过来，导入后需重新发放裁判码）'))return;
  S.referees=S.referees||[];
  var used={};S.referees.forEach(function(r){used[r.id]=true;});
  pool.forEach(function(p){
    var id;do{id=uid('rf_');}while(used[id]);used[id]=true;
    S.referees.push({id:id,name:p.name,phone:p.phone,role:p.role,code:'',status:'issued',

  render();
}

function selEvent(id){CUR_EVENT=id;render();}
function addEvent(){
  var src=S.events.find(function(e){return e.id===CUR_EVENT;})||S.events[0];
  if(!src){alert('暂无可复制的赛项，请先重置种子。');return;}
  var n=1;
  S.events.forEach(function(e){var m=/^event_(\d+)$/.exec(e.id||'');if(m)n=Math.max(n,(+m[1])+1);});
  var id='event_'+n;
  // 深拷贝当前赛项结构（赛项配置均为可序列化对象，JSON 克隆足够）
  var ne=JSON.parse(JSON.stringify(src));
  ne.id=id;
  ne.name=src.name+'（副本）';
  S.events.push(ne);
  logAudit('改配置','复制赛项',src.name,ne.name,'赛项与规则');
  CUR_EVENT=id;save();render();
}
function eventRefCount(id){
  var n=0;
  n+=(S.teams||[]).filter(function(t){return t.eventId===id;}).length;
  n+=(S.slots||[]).filter(function(s){return s.eventId===id;}).length;
  n+=(S.disputes||[]).filter(function(d){return d.eventId===id;}).length;
  n+=(S.changeRequests||[]).filter(function(c){return c.eventId===id;}).length;
  n+=(S.evidence||[]).filter(function(e){return e.eventId===id;}).length;
  return n;
}
function removeEvent(id){
  var ev=find(id);if(!ev)return;
  var n=eventRefCount(id);
  if(n>0){alert('该赛项已有 '+n+' 条关联数据（队伍 / 赛程 / 争议 / 工单 / 留底），无法直接删除。\n请先清理相关队伍与赛程，或改用「复制赛事」重建本场。');return;}
  if(!confirm('确认删除赛项「'+ev.name+'」（'+id+'）？\n此操作不可撤销，仅影响本场赛事。'))return;
  S.events=S.events.filter(function(e){return e.id!==id;});
  if(CUR_EVENT===id)CUR_EVENT=(S.events[0]&&S.events[0].id)||'';
  logAudit('改配置','删除赛项',ev.name,'—','赛项与规则');
  save();render();
}

  }).join('');

    var _unit=_isCount&&t.weight!=null?Number(t.weight):0;

      wCell=isWS?'<td><div class="small muted" style="margin-bottom:3px">权重</div><input type="number" step="0.05" value="'+(t.weight==null?'':t.weight)+'" oninput="updTask('+i+',\'weight\',this.value)"></td>':'<td class="muted">—（不使用）</td>';
    }else{
      wCell='<td class="muted">—（不适用）</td>';
    }
    return '<tr>'+
      '<td><input value="'+esc(t.name)+'" oninput="updTask('+i+',\'name\',this.value)"></td>'+
      '<td><select onchange="updTask('+i+',\'type\',this.value)">'+
        ['numeric','count','enum','toggle'].map(function(x){return '<option value="'+x+'" '+(t.type===x?'selected':'')+'>'+taskTypeName(x)+'</option>';}).join('')+
      '</select><div class="small muted">'+esc(TASK_TYPE_HINT[t.type]||'')+'</div></td>'+
      '<td><input type="number" value="'+(t.maxScore==null?'':t.maxScore)+'" oninput="updTask('+i+',\'maxScore\',this.value)">'+(_isCount?'<div class="small muted">数量上限</div>':'')+'</td>'+
      wCell+

        phaseOpts.map(function(p){return '<option value="'+p.id+'" '+(t.phase===p.id?'selected':'')+'>'+esc(p.name)+'</option>';}).join('')+
      '</select></td>'+
      '<td><select onchange="updTask('+i+',\'control\',this.value)">'+controlOptions(t.control)+'</select></td>'+
      '<td><button class="btn sm danger" onclick="delTask('+i+')">删</button></td>'+
    '</tr>';
  }).join('');
  var bonusRows=(ev.bonusRules||[]).map(function(b,i){
    var p=b.params||{};
    var paramHtml;
    if(b.template==='time_bonus'){

function penName(t){return {record_only:'仅记录不扣分',per_card:'按牌扣分',none:'不扣分'}[t]||t||'仅记录不扣分';}
function ensureCardRules(){
  var ev=find(CUR_EVENT);if(!ev)return null;
  if(!ev.penaltyRule)ev.penaltyRule={template:'record_only',params:{}};
  if(!ev.penaltyRule.params)ev.penaltyRule.params={};
  if(!ev.penaltyRule.cardRules)ev.penaltyRule.cardRules={redThreshold:3,allowDirectRed:true,reasons:[]};
  var cr=ev.penaltyRule.cardRules;
  if(!cr.reasons)cr.reasons=[];
  if(cr.redThreshold==null)cr.redThreshold=3;
  if(cr.allowDirectRed==null)cr.allowDirectRed=true;
  if(!ev.penaltyRule.template)ev.penaltyRule.template='record_only';
  if(!ev.disputeTypes)ev.disputeTypes=[
    {code:'D01',label:'选手申诉（对判罚有异议）'},
    {code:'D02',label:'重复打分（同队同轮出现 2 份成绩）'},
    {code:'D03',label:'用时争议（计时 / 停表异议）'},
    {code:'D04',label:'器材故障 / 其他'}
  ];
  return cr;
}
function updCardTpl(v){
  var ev=find(CUR_EVENT);if(!ev)return;ensureCardRules();

  ev.penaltyRule.template=v;

}

  cr.reasons.push({code:(card==='red'?'R':'Y')+('0'+(n+1)).slice(-2),card:card,label:''});
  logAudit('改配置',ev.name+' · '+(card==='red'?'红牌':'黄牌')+'事由','—','新增 1 条','赛项判罚事由按赛项配置');

function parseCSV(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()!=='';});
  return lines.map(function(l){
    var out=[],cur='',q=false;
    for(var i=0;i<l.length;i++){
      var c=l[i];
      if(q){
        if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c;
      }else{
        if(c==='"')q=true; else if(c===','){out.push(cur);cur='';} else cur+=c;
      }
    }
    out.push(cur);
    return out.map(function(s){return s.trim();});
  });
}
function autoMap(headers){
  var m={};
  WRC_FIELDS.forEach(function(f){
    var idx=-1;
    headers.forEach(function(h,i){
      if(idx>=0)return;
      var s=String(h).replace(/\s/g,'');
      if(f.k==='team_number'&&(s.indexOf('编号')>=0||s.indexOf('队号')>=0||s.toLowerCase().indexOf('number')>=0))idx=i;
      else if(f.k==='team_name'&&(s.indexOf('队伍名')>=0||s.indexOf('队名')>=0||s==='名称'))idx=i;
      else if(f.k==='school'&&(s.indexOf('学校')>=0||s.indexOf('机构')>=0||s.indexOf('单位')>=0))idx=i;
      else if(f.k==='coach'&&(s.indexOf('教练')>=0||s.indexOf('指导')>=0||s.indexOf('教师')>=0))idx=i;
      else if(f.k==='group_code'&&(s.indexOf('组别')>=0||s.indexOf('年级')>=0||s.indexOf('学段')>=0))idx=i;
      else if(f.k==='event_code'&&(s.indexOf('赛项')>=0||s.indexOf('项目')>=0||s.indexOf('赛道')>=0))idx=i;
    });
    m[f.k]=idx;
  });
  return m;
}

function ingestGrid(grid){
  if(!grid||grid.length<2){IMP.error='数据不足：至少需要「表头 + 1 行数据」';IMP.diff=null;render();return;}
  var headers=grid[0].map(function(s){return String(s==null?'':s).trim();}).map(function(s,i){return s||('列'+(i+1));});
  var dataRows=grid.slice(1).filter(function(r){return r&&r.some(function(c){return String(c==null?'':c).trim()!=='';});});
  if(!dataRows.length){IMP.error='未解析到有效数据行';IMP.diff=null;render();return;}
  if(!IMP.headers||IMP.headers.join('|')!==headers.join('|')){
    IMP.headers=headers;
    IMP.mapping=autoMap(headers);
  }
  var items=[],firstIdx={};
  dataRows.forEach(function(r,ri){
    var o={_row:ri+2};
    WRC_FIELDS.forEach(function(f){
      var idx=IMP.mapping[f.k];
      o[f.k]=(idx>=0&&idx!=null&&r[idx]!=null)?String(r[idx]):'';
    });
    var errs=[];
    WRC_FIELDS.forEach(function(f){ if(f.required&&!o[f.k])errs.push('缺少「'+f.label+'」'); });
    if(o.team_number&&!/^\d+$/.test(o.team_number))errs.push('队伍编号须为纯数字（当前「'+o.team_number+'」）');
    var evId=EVENT_BY_NAME[o.event_code];
    if(o.event_code&&!evId)errs.push('未知赛项「'+o.event_code+'」');
    var ev=evId?find(evId):null;
    if(ev&&o.group_code&&(ev.groups||[]).indexOf(o.group_code)<0)errs.push('组别「'+o.group_code+'」不属于赛项「'+ev.name+'」');
    var dup=false;
    if(o.team_number){
      if(firstIdx[o.team_number]==null)firstIdx[o.team_number]=ri+2;
      else dup=true;
    }
    items.push({o:o,errs:errs,evId:evId,dup:dup,dupAt:firstIdx[o.team_number]});
  });
  items.forEach(function(it){
    var o=it.o,status,changes=[];
    if(it.dup)it.errs.push('编号在文件中重复（首次出现在第 '+it.dupAt+' 行），需人工裁决');
    if(it.errs.length){ status='conflict'; }
    else{
      var mt=null;
      for(var i=0;i<S.teams.length;i++){ if(S.teams[i].no===o.team_number){mt=S.teams[i];break;} }
      if(!mt)status='insert';
      else{
        var curEv=find(mt.eventId);
        var pairs=[['team_name','name','队伍名称'],['school','school','学校'],['coach','coach','教练'],['group_code','group','组别'],['event_code','evName','赛项']];
        pairs.forEach(function(p){

          var newV=o[p[0]]||'';

        });

        var structural=changes.some(function(c){return c.label==='组别'||c.label==='赛项';});
        if(hasScore&&structural){ status='conflict'; it.errs.push('该队已有成绩，不允许变更组别/赛项'); }
        else if(changes.length){ status='update'; it.changes=changes; }
        else status='skip';

    it.checked=(status==='insert'||status==='update');
  });
  IMP.diff=items;IMP.error='';IMP.lastResult=null;
  render();
}

/* ---------- .xlsx 直读（零依赖：ZIP central directory + DecompressionStream + XML 扫描） ---------- */
function xmlUnescape(s){
  return String(s==null?'':s)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(Number(d));})
    .replace(/&amp;/g,'&');
}
function colIndexFromRef(ref){
  var m=/^([A-Z]+)/.exec(String(ref||'').toUpperCase());
  if(!m)return -1;
  var s=m[1],n=0;
  for(var i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);
  return n-1;
}
function parseSharedStringsXml(xml){
  var out=[],re=/<si\b[^>]*>([\s\S]*?)<\/si>/g,m;
  while((m=re.exec(xml))){
    var blk=m[1],s='',t=/<t\b[^>]*>([\s\S]*?)<\/t>/g,tm;
    while((tm=t.exec(blk)))s+=xmlUnescape(tm[1]);
    out.push(s);
  }
  return out;
}
function parseSheetXml(xml,shared){
  var grid=[],rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g,rm;
  while((rm=rowRe.exec(xml))){
    var rowXml=rm[1],arr=[],cellRe=/<c\b([^>]*?)\/>|<c\b([^>]*?)>([\s\S]*?)<\/c>/g,cm;
    while((cm=cellRe.exec(rowXml))){
      var attrs=(cm[1]!=null?cm[1]:(cm[2]||'')),inner=cm[3]||'';
      var rA=/r="([^"]+)"/.exec(attrs);
      var ci=rA?colIndexFromRef(rA[1]):arr.length;
      if(ci<0)ci=arr.length;
      var tA=/t="([^"]+)"/.exec(attrs);
      var t=tA?tA[1]:'';
      var val='';
      if(t==='inlineStr'||t==='str'){
        var it=/<t\b[^>]*>([\s\S]*?)<\/t>/.exec(inner);
        val=it?xmlUnescape(it[1]):'';
      }else{
        var v=/<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        if(v){
          val=v[1];
          if(t==='s'){var si=Number(val);val=(shared&&shared[si]!=null)?shared[si]:'';}
          else val=xmlUnescape(val);
        }
      }
      arr[ci]=String(val);
    }
    for(var q=0;q<arr.length;q++)if(arr[q]==null)arr[q]='';
    if(arr.some(function(x){return String(x).trim()!=='';}))grid.push(arr);
  }
  return grid;
}
async function inflateRaw(data){
  if(typeof DecompressionStream==='undefined')throw new Error('当前环境不支持解压，请改用「粘贴 CSV」兜底通道');
  var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(st).text();
}
async function unzipXlsx(u8){
  var dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  var eocd=-1;
  for(var i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0)throw new Error('不是有效的 .xlsx（未找到 ZIP 结构）');
  var count=dv.getUint16(eocd+10,true),cdOff=dv.getUint32(eocd+16,true),p=cdOff,entries=[];
  for(var k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nameLen=dv.getUint16(p+28,true);
    var extraLen=dv.getUint16(p+30,true);
    var cmtLen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    entries.push({name:name,method:method,csize:csize,lho:lho});
    p+=46+nameLen+extraLen+cmtLen;
  }
  var wanted=/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/;
  var out={};
  for(var j=0;j<entries.length;j++){
    var e=entries[j];
    if(!wanted.test(e.name))continue;
    var lnl=dv.getUint16(e.lho+26,true),lel=dv.getUint16(e.lho+28,true);
    var start=e.lho+30+lnl+lel;
    var data=u8.subarray(start,start+e.csize);
    out[e.name]=(e.method===0)?new TextDecoder().decode(data):await inflateRaw(data);
  }
  return out;
}
async function readXlsxGrid(u8){
  var files=await unzipXlsx(u8);
  var shared=files['xl/sharedStrings.xml']?parseSharedStringsXml(files['xl/sharedStrings.xml']):[];
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);})
    .sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});
  if(!sheets.length)throw new Error('未找到工作表（xl/worksheets/sheet1.xml）');
  return parseSheetXml(files[sheets[0]],shared);
}
async function impHandleFile(file){
  if(!file)return;
  IMP.error='';IMP.fileName=file.name||'';IMP.busy=true;IMP.diff=null;render();
  try{
    var nm=(file.name||'').toLowerCase();
    if(/\.csv$/.test(nm)){
      var text=await file.text();
      IMP.busy=false;IMP.text=text;IMP.fromExcel=false;IMP.showPaste=true;
      ingestGrid(parseCSV(text));
      return;
    }
    if(/\.xls$/.test(nm))throw new Error('.xls 为旧版二进制格式，请在 Excel 中另存为 .xlsx 后重试');
    if(!/\.xlsx$/.test(nm))throw new Error('仅支持 .xlsx / .csv（当前：'+(file.name||'未知')+'）');
    var buf=new Uint8Array(await file.arrayBuffer());
    var grid=await readXlsxGrid(buf);
    IMP.busy=false;IMP.fromExcel=true;IMP.text='';
    ingestGrid(grid);
  }catch(e){
    IMP.busy=false;IMP.diff=null;
    IMP.error='Excel 解析失败：'+((e&&e.message)?e.message:e);
    render();
  }
}

    var sc=S.scores[t.id]||{};
    var signed=sc.signed?'<span class="tag ok">已签字</span>':'<span class="tag">未签字</span>';
    var has=sc.tasks?'<span class="tag b">有成绩</span>':'<span class="tag">待录入</span>';
    var st=t.status==='withdrawn'?'<span class="tag err">退赛</span>':'<span class="tag ok">在册</span>';
    var src=t.source==='excel'?'<span class="tag b">WRC 导入</span>':(t.source==='manual'?'手动录入':esc(t.source||'—'));
    var ev0=find(t.eventId)||{groups:['小学组','初中组']};
    var gOpts=(ev0.groups||['小学组','初中组']).map(function(g){return '<option '+(g===t.group?'selected':'')+'>'+esc(g)+'</option>';}).join('');
    return '<tr><td><b>'+esc(t.no||'—')+'</b></td>'+
      '<td><b>'+esc(t.name)+'</b><div class="small muted">'+esc(t.members||'—')+'</div></td>'+
      '<td class="small">'+esc(t.school||'—')+'</td><td class="small">'+esc(t.coach||'—')+'</td>'+
      '<td><select style="max-width:112px" onchange="changeTeamGroup(\''+t.id+'\',this.value)">'+gOpts+'</select></td>'+
      '<td>'+st+'</td><td class="small">'+src+'</td>'+
      '<td>'+has+' '+signed+'</td>'+
      '<td><span class="row tight"><button class="btn sm" onclick="toggleWithdraw(\''+t.id+'\')">'+(t.status==='withdrawn'?'恢复':'弃赛')+'</button>'+
      '<button class="btn sm danger" onclick="delTeam(\''+t.id+'\')">删除</button></span></td></tr>';
  }).join('');
  return '<div class="card"><h2>新增队伍 <small>手动录入通道（现场补录 / 临时队伍）</small></h2>'+
    '<div class="grid g3">'+
      '<div class="fld"><label>队伍编号（纯数字 · 唯一）</label><input id="ntNo" placeholder="如 5001"></div>'+
      '<div class="fld"><label>队伍名称</label><input id="ntName" placeholder="如 星河队"></div>'+
      '<div class="fld"><label>组别</label><input id="ntGroup" placeholder="如 小学组"></div>'+
      '<div class="fld"><label>学校 / 机构</label><input id="ntSchool" placeholder="如 杭州实验小学"></div>'+
      '<div class="fld"><label>指导教师</label><input id="ntCoach" placeholder="如 张老师"></div>'+
      '<div class="fld"><label>成员（/ 分隔）</label><input id="ntMembers" placeholder="如 张三 / 李四"></div>'+
    '</div>'+
    '<div class="row"><button class="btn primary" onclick="addTeam()">添加到「'+esc(ev?ev.name:'')+'」</button>'+
      '<span class="sp" style="flex:1"></span>'+
      '<button class="btn" onclick="toggleBulk()">批量导入（CSV）</button></div>'+
    '<div id="bulkBox" style="display:none;margin-top:12px">'+
      '<div class="fld"><label>每行一队：编号,队伍名称,组别,学校,教练,成员（编号与名称必填，其余可留空）</label>'+
      '<textarea id="bulkText" placeholder="5001,星河队,小学组,杭州实验小学,张老师,张三/李四&#10;5002,追光队,小学组,杭州实验小学,李老师,王五/赵六"></textarea></div>'+
      '<button class="btn primary" onclick="bulkImport()">导入</button>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h2>队伍列表 <small>按赛项筛选</small></h2>'+
    '<div class="row" style="margin-bottom:10px"><select style="max-width:220px" onchange="selTeamEvent(this.value)">'+opts+'</select>'+
      '<span class="small muted">共 '+tms.length+' 支队伍</span>'+
    '</div>'+
    '<table><thead><tr><th>编号</th><th>队伍 / 成员</th><th>学校</th><th>教练</th><th>组别</th><th>状态</th><th>来源</th><th>进度</th><th></th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="9" class="muted">该赛项暂无队伍</td></tr>')+'</tbody></table>'+
  '</div>'+
  seatPanel();
}
function selTeamEvent(id){CUR_EVENT=id;CUR_TEAM=null;render();}
function toggleBulk(){var b=document.getElementById('bulkBox');if(b)b.style.display=b.style.display==='none'?'block':'none';}
function addTeam(){
  var n=(document.getElementById('ntName')||{}).value||'';
  var no=((document.getElementById('ntNo')||{}).value||'').trim();
  if(!n.trim()){alert('请填写队伍名称');return;}
  if(!no||!/^\d+$/.test(no)){alert('队伍编号必填且须为纯数字');return;}
  if(S.teams.some(function(t){return t.no===no;})){alert('队伍编号 '+no+' 已存在（编号须唯一）');return;}
  S.teams.push({id:uid('tm'),no:no,name:n.trim(),
    school:((document.getElementById('ntSchool')||{}).value||'').trim(),
    coach:((document.getElementById('ntCoach')||{}).value||'').trim(),
    eventId:CUR_EVENT,group:((document.getElementById('ntGroup')||{}).value||'').trim(),
    members:((document.getElementById('ntMembers')||{}).value||'').trim(),
    status:'active',source:'manual'});
  save();render();
}
function bulkImport(){
  var ta=document.getElementById('bulkText');if(!ta)return;
  var lines=ta.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var n=0,skip=0;
  lines.forEach(function(l){
    var p=l.split(/[,，]/);
    var no=(p[0]||'').trim(),nm=(p[1]||'').trim();
    if(!no||!nm){skip++;return;}
    if(!/^\d+$/.test(no)||S.teams.some(function(t){return t.no===no;})){skip++;return;}
    S.teams.push({id:uid('tm'),no:no,name:nm,group:(p[2]||'').trim(),school:(p[3]||'').trim(),
      coach:(p[4]||'').trim(),members:(p[5]||'').trim(),eventId:CUR_EVENT,status:'active',source:'manual'});
    n++;
  });
  save();alert('已导入 '+n+' 支队伍'+(skip?('，跳过 '+skip+' 行（编号缺失/重复/非数字）'):''));render();
}
function delTeam(id){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!confirm('删除该队伍及其成绩？'))return;
  S.teams=S.teams.filter(function(x){return x.id!==id;});
  delete S.scores[id];
  logAudit('删队',(t?t.name+'（'+t.no+'）':id),'在册','已删除','队伍数据清理');
  save();render();
}
function toggleWithdraw(id){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t)return;
  var to=(t.status==='withdrawn')?'active':'withdrawn';
  if(to==='withdrawn'&&!confirm('将「'+t.name+'」标记为弃赛？队伍与历史成绩保留（软删除，不物理删除）。'))return;
  var before=t.status||'active';
  t.status=to;
  logAudit('弃赛',t.name+'（'+t.no+'）',before,to,to==='withdrawn'?'选手弃赛（软删除，保留历史成绩）':'恢复参赛');
  save();render();
}
function changeTeamGroup(id,g){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t||t.group===g)return;
  var before=t.group;
  t.group=g;
  logAudit('改组',t.name+'（'+t.no+'）',before,g,'组别调整');
  save();render();
}
/* ---------- 分台与顺位（队伍管理页内） ---------- */
/* 依据《裁判打分系统》P2：平板端队列 = 本赛台队伍（按绑定自动过滤）+ 第 X 顺位 / 共 N 队；
   P10 完成度 = 赛项 × 组别级（多赛台汇总）。故此处维护「队伍 → 赛台 + 赛台内顺位」。 */
var TEAM_SEAT_GROUP='';
function selSeatGroup(v){TEAM_SEAT_GROUP=v;render();}
function findTeam(id){var a=S.teams||[];for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function teamScoreTag(t){
  var sc=S.scores[t.id]||{};
  if(t.status==='withdrawn')return '<span class="tag err">退赛</span>';
  if(sc.signed)return '<span class="tag ok">已签字</span>';
  if(sc.tasks)return '<span class="tag b">已录入</span>';
  return '<span class="tag">待录入</span>';
}
function teamSeatTeams(evId,group,seatId){
  return (S.teams||[]).filter(function(t){
    return t.eventId===evId&&t.status!=='withdrawn'&&(t.seatId||'')===seatId&&(!group||t.group===group);
  }).sort(function(a,b){return (Number(a.order)||9999)-(Number(b.order)||9999);});
}
function seatPanel(){
  var ev=find(CUR_EVENT)||S.events[0];
  if(!ev)return '';
  var pool=(S.teams||[]).filter(function(t){
    return t.eventId===ev.id&&t.status!=='withdrawn'&&(!TEAM_SEAT_GROUP||t.group===TEAM_SEAT_GROUP);
  });
  var assigned=pool.filter(function(t){return !!t.seatId;}).length;
  var unassigned=pool.filter(function(t){return !t.seatId;});
  var usedSeats=[];S.seats.forEach(function(x){
    if(pool.some(function(t){return t.seatId===x.id;}))usedSeats.push(x.id);
  });
  var done=pool.filter(function(t){var sc=S.scores[t.id]||{};return !!sc.signed;}).length;
  var kpi=function(lb,nm,ft){return '<div class="kpi"><div class="lb">'+lb+'</div><div class="nm">'+nm+'</div><div class="ft">'+ft+'</div></div>';};
  var gOpts=[''].concat(ev.groups||[]).map(function(g){
    return '<option value="'+esc(g)+'" '+(TEAM_SEAT_GROUP===g?'selected':'')+'>'+(g?esc(g):'全部组别')+'</option>';
  }).join('');

  function teamRow(t,pos){
    var sOpts='<option value="">（未分台）</option>'+S.seats.map(function(x){
      return '<option value="'+x.id+'" '+(t.seatId===x.id?'selected':'')+'>'+esc(x.name)+'</option>';}).join('');
    return '<tr>'+
      '<td class="num">'+(pos||'—')+'</td>'+
      '<td><b>'+esc(t.no||'—')+'</b></td>'+
      '<td>'+esc(t.name)+'<div class="small muted">'+esc(t.members||'—')+'</div></td>'+
      '<td class="small">'+esc(t.group||'—')+'</td>'+
      '<td>'+teamScoreTag(t)+'</td>'+
      '<td><span class="row tight">'+
        '<button class="btn sm" onclick="moveTeamOrder(\''+t.id+'\',-1)">↑</button>'+
        '<button class="btn sm" onclick="moveTeamOrder(\''+t.id+'\',1)">↓</button>'+
        '<select style="max-width:112px" onchange="setTeamSeat(\''+t.id+'\',this.value)">'+sOpts+'</select>'+
      '</span></td></tr>';
  }
  var blocks=usedSeats.map(function(sid){
    var list=teamSeatTeams(ev.id,TEAM_SEAT_GROUP,sid);
    var rows=list.map(function(t,i){return teamRow(t,i+1);}).join('');
    return '<div style="margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px">'+
      '<div class="row" style="justify-content:space-between">'+
        '<b>'+esc(seatName(sid))+'</b>'+
        '<span class="small muted">'+list.length+' 支队伍 · 出赛顺位 1–'+list.length+'</span>'+
      '</div>'+
      '<div style="overflow:auto">'+
      '<table style="margin-top:6px"><thead><tr><th class="num" style="width:60px">顺位</th><th style="width:96px">编号</th><th>队伍 / 成员</th><th style="width:90px">组别</th><th style="width:88px">进度</th><th style="width:250px">调整（↑↓ 换位 / 改派赛台）</th></tr></thead>'+
      '<tbody>'+(rows||'<tr><td colspan="6" class="muted">该赛台暂无队伍</td></tr>')+'</tbody></table></div>'+
    '</div>';
  }).join('');

  var unBlock=unassigned.length
    ? '<div style="margin-top:12px;border:1px dashed #f6ad55;border-radius:8px;padding:10px 12px;background:#fffaf0">'+
      '<div class="row" style="justify-content:space-between"><b>未分台</b><span class="small muted">'+unassigned.length+' 支 · 平板端不会出现在任何赛台队列里</span></div>'+
      '<div style="overflow:auto"><table style="margin-top:6px"><thead><tr><th class="num" style="width:60px">顺位</th><th style="width:96px">编号</th><th>队伍 / 成员</th><th style="width:90px">组别</th><th style="width:88px">进度</th><th style="width:250px">调整（↑↓ 换位 / 改派赛台）</th></tr></thead>'+
      '<tbody>'+unassigned.map(function(t){return teamRow(t,'—');}).join('')+'</tbody></table></div></div>'
    : '';

  return '<div class="card"><div class="row">'+
      '<h2 style="margin:0">分台与顺位 <small>'+esc(ev.name)+' · 平板端队列口径</small></h2>'+
      '<span class="sp" style="flex:1"></span>'+
      '<select style="max-width:140px" onchange="selSeatGroup(this.value)">'+gOpts+'</select>'+
      '<button class="btn primary" onclick="autoDistributeSeats()">按人数均分到赛台</button>'+
      '<button class="btn" onclick="clearTeamSeats()">清空分台</button>'+
    '</div>'+
    '<div class="grid g4" style="margin-top:12px">'+
      kpi('该赛项队伍',pool.length,TEAM_SEAT_GROUP?('组别：'+TEAM_SEAT_GROUP):'全部组别（不含退赛）')+
      kpi('已分台',assigned,'未分台 '+unassigned.length+' 支')+
      kpi('占用赛台',usedSeats.length,'仅统计有队伍的赛台')+

function moveTeamOrder(id,dir){if(!perm('ref'))return;
  var t=findTeam(id);if(!t||!t.seatId)return;
  var list=teamSeatTeams(t.eventId,TEAM_SEAT_GROUP,t.seatId);
  var idx=-1;for(var i=0;i<list.length;i++){if(list[i].id===id){idx=i;break;}}
  var to=idx+dir;
  if(idx<0||to<0||to>=list.length)return;
  var tmp=list[idx];list[idx]=list[to];list[to]=tmp;
  list.forEach(function(x,k){x.order=k+1;});
  logAudit('分台',seatName(t.seatId)+' 出赛顺位',t.name+' 原第 '+(idx+1)+' 位',t.name+' 现第 '+(to+1)+' 位','队列顺序调整');
  save();render();
}
function setTeamSeat(id,seatId){if(!perm('ref'))return;
  var t=findTeam(id);if(!t)return;
  if((t.seatId||'')===(seatId||''))return;
  var before=t.seatId?seatName(t.seatId):'未分台';
  t.seatId=seatId||'';
  if(t.seatId){
    var list=teamSeatTeams(t.eventId,TEAM_SEAT_GROUP,t.seatId);
    list.forEach(function(x,k){x.order=k+1;});
  }else{t.order=0;}
  logAudit('分台',t.name+'（'+t.no+'）',before,t.seatId?seatName(t.seatId):'未分台','队伍分台');
  save();render();
}
function autoDistributeSeats(){if(!perm('ref'))return;
  var ev=find(CUR_EVENT);if(!ev)return;
  var pool=(S.teams||[]).filter(function(t){
    return t.eventId===ev.id&&t.status!=='withdrawn'&&(!TEAM_SEAT_GROUP||t.group===TEAM_SEAT_GROUP);
  });
  if(!pool.length){alert('该赛项没有在册队伍');return;}
  if(!S.seats.length){alert('还没有配置赛台，请先到「赛台与赛程编排」新建赛台');return;}
  if(!confirm('把 '+pool.length+' 支队伍按人数均分到 '+S.seats.length+' 张赛台？\n将覆盖现有分台与顺位。\n\n'
    +'注意：这一步只把队伍排到「赛台」。还要到「赛台与赛程」对各个场次点「按赛台分配队伍」，'
    +'队伍才会排进具体时段（否则场次里仍然是空的）。'))return;
  var buckets={};S.seats.forEach(function(x){buckets[x.id]=[];});
  pool.forEach(function(t,i){buckets[S.seats[i%S.seats.length].id].push(t.id);});
  S.seats.forEach(function(x){
    buckets[x.id].forEach(function(tid,k){var t=findTeam(tid);if(t){t.seatId=x.id;t.order=k+1;}});
  });
  var detail=S.seats.map(function(x){return x.name+' '+buckets[x.id].length+' 队';}).join('；');
  logAudit('分台','按人数均分赛台',pool.length+' 支待分台',detail,'自动均分（可手动调整）');
  save();render();
}
function clearTeamSeats(){if(!perm('ref'))return;
  var ev=find(CUR_EVENT);if(!ev)return;
  if(!confirm('清空该赛项全部队伍的分台与顺位？'))return;
  var n=0;(S.teams||[]).forEach(function(t){if(t.eventId===ev.id&&t.seatId){t.seatId='';t.order=0;n++;}});
  logAudit('分台','清空分台',n+' 支已分台','—','重新编排');
  save();render();
}

/* 依据《裁判打分系统》: 姓名 + 裁判码双因子鉴权；赛项×组别×赛台由工作人员后台建档时预绑；
   激活凭据缓存本地后断网也能登录；从未激活的新平板离线首登会被拒绝。 */
var REF_CODE_CHARS='23456789ABCDEFGHJKMNPQRSTUVWXYZ';   /* 6 位无歧义字符：排除 0 O 1 I L 等易混字符 */
function genRefCode(){
  function pick(){return REF_CODE_CHARS.charAt(Math.floor(Math.random()*REF_CODE_CHARS.length));}
  var c='',guard=0;
  do{c='';for(var i=0;i<6;i++)c+=pick();guard++;}
  while((S.referees||[]).some(function(r){return r.code===c;})&&guard<500);
  return c;
}
function findRef(id){var a=S.referees||[];for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function refRoleName(r){return r==='chief'?'裁判长':'普通裁判';}
function refRoleVal(n){return String(n||'').indexOf('长')>=0?'chief':'judge';}
function refBound(r){return !!(r&&r.bind&&r.bind.seatId);}
function refBindText(r){
  if(!refBound(r))return '<span class="muted">未预绑赛台</span>';
  var ev=find(r.bind.eventId)||{name:'—'};
  return esc(ev.name)+' · '+esc(r.bind.group||'—')+' · '+esc(seatName(r.bind.seatId));
}
function refStatusTag(r){
  if(r.status==='disabled')return '<span class="tag err">已停用</span>';
  if(!refBound(r))return '<span class="tag warn">未预绑赛台</span>';
  if(r.status==='activated')return '<span class="tag ok">已激活</span>';
  return '<span class="tag b">已发码 · 未激活</span>';
}
