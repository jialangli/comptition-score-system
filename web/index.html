<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainCo 赛事统分后台管理 · Demo</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#e4e8ee;--txt:#1b2027;--muted:#6b7280;
  --brand:#185FA5;--brand-d:#124a80;--ok:#2f6b0f;--warn:#9a6410;--err:#a32d2d;
  --okbg:#eaf3de;--warnbg:#faeeda;--errbg:#fcebeb;--soft:#f7f9fc;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
.side{width:228px;flex:0 0 228px;background:#0e1a2b;color:#c7d3e3;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid #1e2f47;margin-bottom:14px}
.brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2f7fd1,#5b4bc4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 30px}
.brand b{display:block;color:#fff;font-size:14px;line-height:1.3}
.brand span{font-size:11.5px;color:#7d8ea6}
.ngroup{font-size:11px;color:#61728c;letter-spacing:.06em;padding:12px 8px 6px}
.ni{display:block;padding:9px 12px;border-radius:8px;color:#c7d3e3;cursor:pointer;margin-bottom:3px;font-size:13.5px;user-select:none}
.ni:hover{background:#182a42;color:#fff}
.ni.on{background:#1b63ab;color:#fff;font-weight:500}
/* 本期暂不做的入口：置灰不可点（.ni.off 必须同时覆盖 :hover，否则鼠标划过仍会变亮） */
.ni.off{color:#5b6b7e;cursor:not-allowed}
.ni.off:hover{background:transparent;color:#5b6b7e}
.nib{float:right;margin-top:2px;font-size:10px;line-height:14px;color:#7b8ea3;border:1px solid #2b3f57;border-radius:4px;padding:0 5px}
.side .foot{margin-top:18px;padding:10px 12px;border-radius:8px;background:#132339;font-size:11.5px;color:#7d8ea6;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:8;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:#eef4fb;color:#1c5288;border:1px solid #d8e6f5}
.pill i{width:7px;height:7px;border-radius:50%;background:#3fae5a;display:inline-block}
.wrap{padding:20px 22px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g12{grid-template-columns:260px minmax(0,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lb{font-size:12.5px;color:var(--muted)}
.kpi .nm{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.kpi .ft{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfcfe}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--txt)}
.btn:hover{border-color:#c3ccd8}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--err);border-color:#f0c9c9}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--txt)}
/* 只读值：长得像输入框，但不给点、也不给改 —— 用于「本赛制只有一种」的配置项 */
.ro{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#f4f6f8;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid #cfe2f6;border-color:var(--brand)}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
input[type=range]{padding:0;border:none;background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#eef2f7;color:#4a5768}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:var(--err)}
.tag.b{background:#e8f1fb;color:#1c5288}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li:last-child{border-bottom:none}
.li:hover{background:var(--soft)}
.li.on{background:#eaf2fb;border-left:3px solid var(--brand);padding-left:9px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.note{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#41506a;line-height:1.7}
.drop{display:block;border:2px dashed #c3ccd8;border-radius:12px;padding:26px 20px;text-align:center;cursor:pointer;background:#fbfcfe}
.drop:hover{border-color:var(--brand);background:#f4f9fe}
.drop b{display:block;font-size:14px;color:var(--brand);margin-bottom:4px}
.drop span{font-size:12.5px;color:var(--muted)}
.slot{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:96px;cursor:pointer}
.slot:hover{border-color:#a9c6e6}
.slot.sel{border-color:var(--brand);box-shadow:0 0 0 2px #d9e8f7}
.slot.extra{border-color:#f0c9a0;background:#fffaf3}
.slot.empty{border:1px dashed #c3ccd8;background:#fbfcfe;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;min-height:96px}
.slot.empty:hover{border-color:var(--brand);color:var(--brand)}
.screen-box{background:#0d1b2a;border-radius:12px;padding:16px 20px;color:#e8eef6}
.screen-box .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #22384f;padding-bottom:9px;margin-bottom:10px;font-size:13px}
.screen-box .hd b{font-size:15px;color:#fff}
.screen-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed #1d3145;font-size:13.5px}
.screen-row:last-child{border-bottom:none}
.screen-row .rk{width:32px;text-align:center;font-weight:700;color:#8fd0ff}
.screen-row .tm{flex:1.4;font-weight:600;color:#fff}
.screen-row .sc{flex:2.4;color:#a9bed4;font-size:12.5px}
.screen-row .aw{flex:0.9;text-align:right;color:#ffd479;font-size:12.5px}
.screen-foot{text-align:center;font-size:11.5px;color:#6d8399;padding-top:9px;border-top:1px solid #1d3145;margin-top:8px}
.range{display:flex;align-items:center;gap:10px}
.range b{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.thumb{text-align:center;font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between}
.vres{margin-top:10px;font-size:12.5px;line-height:1.8}
.vres .e{color:var(--err)}
.vres .w{color:var(--warn)}
.vres .k{color:var(--ok)}
.snap{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.pub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.pub h3{margin:0 0 4px;font-size:17px;text-align:center;font-weight:600}
.pub .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px}
.award1{color:#a32d2d;font-weight:500}
.award2{color:#9a6410;font-weight:500}
.award3{color:#2f6b0f;font-weight:500}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g12,.g2,.g3{grid-template-columns:1fr}}
/* 苹果风格滑动开关：用于「黄牌计数器」这类「开 / 关」型配置项。
   关闭即整块规则停用，所以控件本身要能一眼看出状态，而不是靠文字描述。 */
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none;vertical-align:middle;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;left:0;right:0;top:0;bottom:0;background:#cbd5e0;border-radius:13px;transition:background .18s}
.sw i:before{content:'';position:absolute;width:22px;height:22px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i:before{transform:translateX(18px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BrainCo 赛事统分后台管理 · 单文件 Demo
   参考开源：SRComp(compstate 配置治理/榜单)、CodaLab(competition.yaml 声明式赛项)、
             ICPC CCS(contest.json + 实时 standings)、The Purple Standard(任务原语)
   数据模型对齐：赛事统分系统_配置Schema_v1.json / 三赛项种子数据.json
   ============================================================ */
var KEY='brainco_scoring_admin_v1';
var REF_TIME=120;                 /* 时间奖励基准时长的**全局兜底**（秒）：优先取赛项总时间 eventTotalSec(ev)，没配才用它 */
/* ---------- 赛项总时间（整场倒计时总长）· 时间奖励明细 ----------
   这两个是**不同的东西**，别混：
     · 赛项总时间 —— 这场比赛给队伍的总时长（裁判端 appbar 的「/ 总 03:45」，整场倒计时）
     · 时间奖励   —— 奖励时间 = 赛项总时间 − 本队实际用时（省下来的秒数），
                     再按「每 1 秒几分」折算成加分（例：总 60 秒、用时 50 秒 → 奖励时间 10 秒）

   赛项总时间取值优先级：
     Σ 阶段时长（多阶段赛项，见「赛项与规则配置」的阶段表）
     → ev.scoreRule.params.refTime（单阶段 / 无阶段赛项直接填的值；后端引擎读的也是这个字段）
     → 全局兜底 REF_TIME。 */
function eventTotalSec(ev){
  var ps=(ev&&ev.phases)||[],i,s=0;
  for(i=0;i<ps.length;i++){s+=Number(ps[i].durationSec)||0;}
  if(ps.length&&s>0)return s;
  var v=(ev&&ev.scoreRule&&ev.scoreRule.params)?ev.scoreRule.params.refTime:null;
  if(v!=null&&v!==''){v=Number(v);if(v>0)return v;}
  return REF_TIME;
}
/* 单阶段 / 无阶段赛项：直接填的「赛项总时间」写进 params.refTime（后端引擎同字段，口径一致）。
   只有一个阶段时，改的其实是那一段的时长 —— 不制造第二个真相。 */
function setEventTotalSec(sec){
  var ev=find(CUR_EVENT);if(!ev)return;
  var ps=ev.phases||[],v=Number(sec)||0;
  if(v<=0)return;
  if(ps.length>=2)return;                 /* 多阶段：总时间 = Σ阶段时长，界面上是只读的 */
  if(ps.length===1){ps[0].durationSec=v;syncEventTotal(ev);}
  else{ev.scoreRule=ev.scoreRule||{template:'sum',params:{}};ev.scoreRule.params=ev.scoreRule.params||{};ev.scoreRule.params.refTime=v;}
  save();   /* 不 render：输入框正在打字，重渲染会丢焦点（与 updPhase 同一考虑） */
}
/* 有阶段时把 Σ 阶段时长镜像进 params.refTime：后端引擎只认这个字段，
   不镜像就会出现「前端按 03:45 算、后端按旧的 120 算」的口径漂移。 */
function syncEventTotal(ev){
  if(!ev)return;
  var ps=ev.phases||[],i,s=0;
  for(i=0;i<ps.length;i++){s+=Number(ps[i].durationSec)||0;}
  if(!ps.length||s<=0)return;
  ev.scoreRule=ev.scoreRule||{template:'sum',params:{}};
  ev.scoreRule.params=ev.scoreRule.params||{};
  ev.scoreRule.params.refTime=s;
}
/* 时间奖励明细：奖励时间（秒）= 赛项总时间 − 本队用时；再按每 1 秒几分折算，封顶后就是本项加分。 */
function timeBonusInfo(ev,rec){
  var all=(ev&&ev.bonusRules)||[],i,tb=null;
  for(i=0;i<all.length;i++){if(all[i].template==='time_bonus'){tb=all[i];break;}}
  var p=(tb&&tb.params)||{};
  var total=eventTotalSec(ev);
  var used=Number(rec&&rec.time)||0;
  var reward=used>0?Math.max(0,total-used):0;
  var raw=reward*(Number(p.perSecond)||0);
  return {has:!!tb,total:total,used:used,reward:reward,
          perSecond:p.perSecond,cap:p.cap,
          score:(p.cap!=null?Math.min(raw,Number(p.cap)):raw)};
}
/* 秒 → mm:ss（总时间 / 用时都用它显示，避免各处各写一份格式化） */
function mmss(sec){
  sec=Math.max(0,Math.round(Number(sec)||0));
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
var TIERS={'一等奖':0.1,'二等奖':0.2,'三等奖':0.3};

var VIEW='dash';
var CUR_EVENT='brain_planet';     // 赛项与规则页当前编辑赛项
var SCORE_EVENT='brain_planet';   // 裁判打分页当前赛项
var CUR_TEAM=null;                // 打分页当前队伍
var RANK_EVENT='brain_planet';    // 榜单页当前赛项
var PUB_EVENT='brain_planet';     // 公示页当前赛项
var PUB_ANON=false;
var SCORE_ENTRY_ROLE='ops';       // 后台录入身份：ops=运营代录 / sync=现场回传（平板）

/* ---------- 身份与赛事维度（每次请求都声明）----------
   后端 internal/api/middleware.go 用两个请求头定位一次请求的归属：
     · X-Operator —— 审计留痕里的「操作人」；不带则记成「运营（未声明）」，
                     于是导入记录 / 队伍变更的操作人全是一片「未声明」，留痕失去意义。
     · X-Contest  —— 本次读写落到哪一场赛事的数据分区；不带则回落到默认分区 ct_default，
                     多赛事上线后会出现「在 A 场操作、写进了默认分区」这种静默错位。

   ⚠️ 两者都**不是安全边界**（任何人都能填任意值）：真正的隔离要等后端接上登录态。
      这里只是让联调与演示阶段的归属是对的；后端接鉴权后，把这两个头换成会话推导即可。

   CUR_CONTEST 留空 = 不发送该头 —— 单赛事期的行为与改动前完全一致。
   取值口径与单文件 demo 保持一致（sessionStorage 键 brainco_contests_cur_tab），
   等前端补上多赛事切换时，只需给这个变量赋值，不用再动 backendFetch。 */
var CUR_CONTEST='';
function loadCurContest(){try{CUR_CONTEST=sessionStorage.getItem('brainco_contests_cur_tab')||'';}catch(e){CUR_CONTEST='';}}
loadCurContest();

/* ---------- 后端连接配置 ---------- */
var BACKEND_URL='/api/v1';        // 同域部署时相对路径即可；独立部署可改为 http://localhost:8080/api/v1
var BACKEND_KEY='brainco_backend_v1';
var backendMode=false;            // 是否优先连接后端
var backendStatus='unknown';      // unknown / online / offline / error
var backendBusy=false;            // 是否正在同步
var lastSyncAt='';                // 上次成功同步时间（RFC3339）
function loadBackendMode(){try{backendMode=localStorage.getItem(BACKEND_KEY+'_mode')==='1';}catch(e){backendMode=false;}}
function saveBackendMode(){try{localStorage.setItem(BACKEND_KEY+'_mode',backendMode?'1':'0');}catch(e){}}
function loadLastSyncAt(){try{lastSyncAt=localStorage.getItem(BACKEND_KEY+'_lastSyncAt')||'';}catch(e){lastSyncAt='';}}
function saveLastSyncAt(ts){try{lastSyncAt=ts||'';localStorage.setItem(BACKEND_KEY+'_lastSyncAt',lastSyncAt);}catch(e){}}
function loadEntryRole(){try{var v=localStorage.getItem(BACKEND_KEY+'_entryrole');if(v==='ops'||v==='sync')SCORE_ENTRY_ROLE=v;}catch(e){}}
function saveEntryRole(){try{localStorage.setItem(BACKEND_KEY+'_entryrole',SCORE_ENTRY_ROLE);}catch(e){}}
loadBackendMode();loadLastSyncAt();loadEntryRole();
backendStatus=backendMode?'unknown':'offline';

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(p){return p+Math.random().toString(36).slice(2,7);}
function download(name,text,mime){
  var b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
}
function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

/* ---------- 种子数据 ---------- */
function seedData(){
  return {
    schemaVersion:'1.0',
    configVersion:'v1.0 · 2026-09-16',
    snapshots:[],
    importLogs:[],
    published:{},
    seats:[
      {id:'s1',name:'赛台 1'},
      {id:'s2',name:'赛台 2'},
      {id:'s3',name:'赛台 3'},
      {id:'s4',name:'赛台 4'}
    ],
    slots:[
      {id:'sl1',seatId:'s1',period:'上午',time:'09:00–12:00',eventId:'brain_planet',group:'小学组',type:'normal',teams:['bp1','bp2'],snapshot:null},
      {id:'sl2',seatId:'s2',period:'上午',time:'09:00–12:00',eventId:'brain_planet',group:'初中组',type:'normal',teams:['bp3','bp4'],snapshot:null},
      {id:'sl3',seatId:'s3',period:'上午',time:'09:00–12:00',eventId:'mars_rescue',group:'小学组',type:'normal',teams:['mr1','mr2'],snapshot:null},
      {id:'sl4',seatId:'s4',period:'上午',time:'09:00–12:00',eventId:'mars_rescue',group:'初中组',type:'normal',teams:['mr3'],snapshot:null},
      {id:'sl5',seatId:'s1',period:'下午',time:'14:00–17:00',eventId:'future_city',group:'小学组',type:'normal',teams:['fc1','fc2'],snapshot:null},
      {id:'sl6',seatId:'s2',period:'下午',time:'14:00–17:00',eventId:'future_city',group:'初中组',type:'normal',teams:['fc3','fc4'],snapshot:null},
      {id:'sl7',seatId:'s3',period:'下午',time:'14:00–17:00',eventId:'future_city',group:'小学组',type:'extra',teams:[],
       snapshot:[{no:'9001',name:'新星队',school:'成都教装展学校',coach:'陈老师'}]}

/* ---------- 后端适配层（P5：连接后端 + 离线兜底） ---------- */
// 设计原则：
// 1. S 仍是前端单一事实来源，localStorage 始终兜底保存。
// 2. backendMode=true 时，页面加载后尝试从后端拉取全量数据覆盖 S。
// 3. 本地变更后 save() 会触发 backendSyncSoon()，把成绩批量上行到后端。
// 4. 后端不可用时自动降级提示，不断网也能继续操作（数据在本地）。

function backendFetch(path,opts){
  opts=opts||{};
  var url=BACKEND_URL+path;
  var init={method:opts.method||'GET',headers:{'Accept':'application/json'}};
  /* 身份与赛事维度（详见文件上方「身份与赛事维度」注释，后端见 api/middleware.go）：
     X-Operator 让审计里的操作人是真实的人，X-Contest 让数据落进当前赛事分区。
     补这两行之前，实测后果是——导入记录的操作人显示「运营（未声明）」、
     队伍与导入记录落 contestId: ct_default。

     ⚠️ 操作人必须 encodeURIComponent：HTTP 头值只能是 ByteString（0x00–0xFF），
        直接塞中文名，浏览器会在 fetch 处直接抛
        TypeError: ... value is not a valid ByteString —— 整条请求都发不出去。
        后端读到后会做一次 PathUnescape 还原（见 api/middleware.go CurrentUser）。 */
  init.headers['X-Operator']=encodeURIComponent(currentUser().name);
  if(CUR_CONTEST)init.headers['X-Contest']=CUR_CONTEST;
  if(opts.body){
    init.headers['Content-Type']='application/json';
    init.body=JSON.stringify(opts.body);
  }
  var ctrl=null;
  if(typeof AbortController!=='undefined'){ctrl=new AbortController();init.signal=ctrl.signal;}
  var timer=setTimeout(function(){if(ctrl)ctrl.abort();},opts.timeout||5000);
  return fetch(url,init).then(function(r){
    clearTimeout(timer);
    return r.json().then(function(j){return {ok:r.ok,status:r.status,body:j};});
  }).catch(function(err){
    clearTimeout(timer);
    throw err;
  });
}

function setBackendStatus(st,msg){
  backendStatus=st;
  var el=document.getElementById('backend-status');
  if(el)el.innerHTML=backendStatusHtml(st,msg);
}
function backendStatusHtml(st,msg){
  var map={'online':['#eaf3de','#2f6b0f','已连接后端'],'offline':['#faeeda','#9a6410','离线兜底'],'error':['#fcebeb','#a32d2d','后端异常'],'unknown':['#eef2f7','#4a5768','检测中']};
  var c=map[st]||map['unknown'];
  return '<span class="pill" style="background:'+c[0]+';border-color:'+c[0]+';color:'+c[1]+'">'+c[2]+(msg?': '+esc(msg):'')+'</span>';
}

var backendSyncTimer=null;
function backendSyncSoon(){if(backendSyncTimer)return;backendSyncTimer=setTimeout(function(){backendSyncTimer=null;backendSync();},800);}

function backendSync(){
  if(!backendMode || backendBusy)return;
  backendBusy=true;setBackendStatus('unknown','同步中');
  var scores=[];
  S.teams.forEach(function(t){
    var rec=S.scores[t.id];
    if(rec && rec.signed){
      var item={eventId:t.eventId,no:t.no,roundNo:1,clientId:'web-demo',tasks:rec.tasks||{},time:rec.time||0,signed:!!rec.signed};
      item.yellow=rec.yellow||0;
      item.upgradedRed=rec.upgradedRed||0;
      item.red=rec.red||0;
      scores.push(item);
    }
  });
  backendFetch('/sync',{method:'POST',body:{lastSyncAt:lastSyncAt,scores:scores},timeout:8000})
  .then(function(r){
    if(r.ok && r.body && r.body.code===0){
      if(r.body.data && r.body.data.serverTime)saveLastSyncAt(r.body.data.serverTime);
      setBackendStatus('online',r.body.data?('已同步 '+r.body.data.succeeded+' 条'):'');
    }else{
      var m=(r.body&&r.body.message)||('HTTP '+r.status);
      setBackendStatus('error',m);
    }
  }).catch(function(e){
    setBackendStatus('offline','后端不可达，已存本地');
  }).finally(function(){backendBusy=false;});
}

function backendPushTeams(){
  if(!backendMode || backendBusy)return;
  var ev=find(CUR_EVENT);if(!ev)return;
  var localTeams=S.teams.filter(function(t){return t.eventId===ev.id;});
  if(!localTeams.length){alert('当前赛项没有队伍可推送');return;}
  backendBusy=true;setBackendStatus('unknown','推送队伍中');
  backendFetch('/events/'+ev.id+'/teams?limit=10000')
  .then(function(r){
    if(!r.ok || !r.body || r.body.code!==0){throw new Error((r.body&&r.body.message)||'HTTP '+r.status);}
    var existing={};
    (r.body.data&&r.body.data.teams||[]).forEach(function(t){existing[t.team_no||t.no]=true;});
    var toCreate=localTeams.filter(function(t){return !existing[t.no];});
    if(!toCreate.length){setBackendStatus('online','队伍已同步');backendBusy=false;return;}
    return Promise.all(toCreate.map(function(t){
      return backendFetch('/events/'+ev.id+'/teams',{method:'POST',body:{
        no:t.no,name:t.name,school:t.school||'',coach:t.coach||'',group:t.group||'',members:t.members||''
      },timeout:8000}).then(function(res){
        /* 回填 bId：本地队伍有了后端 ID，归台与参赛轮次才能推得上去（推送前它们只能改本地） */
        if(res.ok && res.body && res.body.code===0 && res.body.data && res.body.data.id){
          t.bId=res.body.data.id;
          /* 新建队伍在后端默认是「两轮」；本地若不是 both，补一次设置，
             否则现场刚设好的「仅第 1 轮」会在推送后悄悄变回两轮 */
          if((t.session||'both')!=='both'){
            return backendFetch('/teams/'+t.bId+'/session',{method:'PUT',
              body:{session:t.session,reason:'推送队伍时同步参赛轮次'},timeout:8000})
              .then(function(){return res;});
          }
        }
        return res;
      });
    })).then(function(rs){
      var ok=0,fail=0;
      rs.forEach(function(res){if(res.ok && res.body && res.body.code===0)ok++;else fail++;});
      setBackendStatus('online','推送 '+ok+' 支，失败 '+fail+' 支');
    });
  }).catch(function(e){
    setBackendStatus('offline','后端不可达，已存本地');
  }).finally(function(){backendBusy=false;});
}

function backendPushSchedule(){
  if(!backendMode || backendBusy)return;
  if(!S.seats.length && !S.slots.length){alert('没有赛台或场次可推送');return;}
  backendBusy=true;setBackendStatus('unknown','推送赛程中');
  Promise.all([backendFetch('/seats?limit=1000'),backendFetch('/slots?limit=1000')])
  .then(function(rs){
    var seatRes=rs[0],slotRes=rs[1];
    if(!seatRes.ok || !seatRes.body || seatRes.body.code!==0){throw new Error('读取赛台失败');}
    if(!slotRes.ok || !slotRes.body || slotRes.body.code!==0){throw new Error('读取场次失败');}
    var backendSeats=(seatRes.body.data&&seatRes.body.data.seats)||[];
    var backendSlots=(slotRes.body.data&&slotRes.body.data.slots)||[];
    var seatMap={}; // 本地 seat.name -> 后端 seat.id
    backendSeats.forEach(function(s){seatMap[s.name]=s.id;});
    var seatCreates=S.seats.filter(function(s){return !seatMap[s.name];}).map(function(s,i){
      return backendFetch('/seats',{method:'POST',body:{name:s.name,sortOrder:i},timeout:8000});
    });
    return Promise.all(seatCreates).then(function(seatRs){
      seatRs.forEach(function(res){
        if(res.ok && res.body && res.body.code===0){
          var data=res.body.data;seatMap[data.name]=data.id;
        }
      });
      var slotKey=function(s){return (s.seatId||'')+'|'+s.period;}; // 本地 slot 用本地 seatId
      var backendSlotKeys={};
      backendSlots.forEach(function(s){backendSlotKeys[(s.seatId||'')+'|'+s.period]=true;});
      var slotCreates=[];
      S.slots.forEach(function(sl){
        var backendSeatId=seatMap[seatName(sl.seatId)];
        if(!backendSeatId)return;
        if(backendSlotKeys[backendSeatId+'|'+sl.period])return;
        slotCreates.push(backendFetch('/slots',{method:'POST',body:{
          seatId:backendSeatId,period:sl.period,time:sl.time,eventId:sl.eventId,group:sl.group,
          type:sl.type||'normal',
          /* 轮次必须显式带上：后端只在省略时按「下午=第 2 轮」兜底，
             而 1 轮赛项的下午场次仍是第 1 轮 —— 落地时漏带，该场次就会派不出队伍 */
          round:Number(sl.round)||roundOfPeriod(sl.period)
        },timeout:8000}));
      });
      return Promise.all(slotCreates);
    }).then(function(slotRs){
      var ok=slotRs.filter(function(r){return r.ok && r.body && r.body.code===0;}).length;
      var fail=slotRs.length-ok;
      /* 赛台可能刚新建，本地→后端的赛台映射作废，重取一次 */
      SEAT_BACKEND_MAP=null;
      /* 归台一起推：场次建好了但队伍没排台，平板端看到的会是「本赛台没有队伍」。
         逐队推、静默 —— 一次赛程推送可能带几十支队，逐队刷状态条没有意义。 */
      var n=0;
      S.teams.forEach(function(t){if(t.bId&&t.seatId){pushTeamSeatToBackend(t,true);n++;}});
      setBackendStatus('online','赛程推送 '+ok+' 成功 '+fail+' 失败'+(n?('，归台同步 '+n+' 支'):''));
    });
  }).catch(function(e){
    setBackendStatus('offline','后端不可达，已存本地');
  }).finally(function(){backendBusy=false;});
}

function loadFromBackend(){
  if(!backendMode)return;
  backendBusy=true;setBackendStatus('unknown','加载中');
  Promise.all([
    backendFetch('/events'),
    backendFetch('/seats'),
    backendFetch('/slots'),
    backendFetch('/audit-logs?limit=1000'),
    backendFetch('/import-logs?limit=1000')
  ]).then(function(rs){
    var evRes=rs[0], seatRes=rs[1], slotRes=rs[2], auditRes=rs[3], impRes=rs[4];
    if(!evRes.ok || !evRes.body || evRes.body.code!==0){throw new Error(evRes.body&&evRes.body.message||'赛项加载失败');}
    // 基础数据映射
    var events=(evRes.body.data&&evRes.body.data.events)||[];
    S.events=events;
    S.seats=(seatRes.body.data&&seatRes.body.data.seats)||[];
    S.slots=((slotRes.body.data&&slotRes.body.data.slots)||[]).map(function(x){
      /* 场次轮次（后端迁移 0017 落列）：老数据 / 老后端可能没有 → 按时段补默认值 */
      x.round=Number(x.round)||roundOfPeriod(x.period);
      return x;
    });
    S.auditLogs=(auditRes.body.data&&auditRes.body.data.logs)||[];
    S.importLogs=(impRes.body.data&&impRes.body.data.logs)||[];
    // 队伍 + 成绩
    S.teams=[];S.scores={};
    var teamReqs=events.map(function(ev){return backendFetch('/events/'+ev.id+'/teams?limit=10000');});
    return Promise.all(teamReqs).then(function(teamRs){
      var scoreReqs=[];
      teamRs.forEach(function(tr,idx){
        var ev=events[idx];
        var teams=(tr.body.data&&tr.body.data.teams)||[];
        teams.forEach(function(t){
          // 后端 Team 字段名：id / event_id / team_no / name / school / coach / group_code / status / members / source
          // bId = 后端数值 ID：归台 / 参赛轮次的写接口都要用它（本地 id 带 tm_ 前缀）
          var tm={id:'tm_'+t.id, bId:t.id, eventId:ev.id, no:t.team_no||t.no, name:t.name,
            school:t.school||'', coach:t.coach||'', group:t.group_code||t.group, members:t.members||'',
            status:t.status||'active', source:t.source||'api',
            // 归台与参赛轮次（迁移 0016 起的后端字段）：未排台时 seatId 为空串
            seatId:(t.seatId==null?'':String(t.seatId)), order:Number(t.seatOrder)||0,
            session:(t.session||'both')};
          S.teams.push(tm);
          scoreReqs.push({req:backendFetch('/teams/'+t.id+'/scores?limit=10'),teamId:tm.id});
        });
      });
      return Promise.all(scoreReqs.map(function(x){return x.req.then(function(r){return {teamId:x.teamId,res:r};});}));
    }).then(function(scoreRs){
      scoreRs.forEach(function(item){
        var recs=(item.res.body.data&&item.res.body.data.scores)||[];
        var best=null;
        recs.forEach(function(r){
          var tm=S.teams.find(function(t){return t.id===item.teamId;});
          var ev=tm?events.find(function(e){return e.id===tm.eventId;}):null;
          var rec={tasks:r.task_values||{},time:r.duration_sec||0,yellow:r.yellow||0,red:r.red||0,signed:!!r.signed};
          var total=ev?computeTotal(ev,rec).total:0;
          if(!best || total>best.total || (total===best.total && rec.time<best.time)){
            best={tasks:r.task_values||{},time:rec.time,yellow:rec.yellow,red:rec.red,signed:rec.signed};
          }
        });
        if(best)S.scores[item.teamId]=best;
      });
      saveLocalOnly();setBackendStatus('online','已加载');render();
    });
  }).catch(function(e){
    setBackendStatus('offline','后端不可达，使用本地数据');
  }).finally(function(){backendBusy=false;});
}

/* ---------- 计分引擎（替代原 Excel 公式，对应引擎改造设计 compute_total） ---------- */
function getInputItems(ev){
  var items=(ev.tasks||[]).map(function(t){return clone(t);});
  (ev.bonusRules||[]).forEach(function(b){
    if(b.template==='count_bonus'&&b.params&&b.params.taskId){
      var tid=b.params.taskId;
      if(!items.some(function(i){return i.id===tid;})){
        items.push({id:tid,name:tid+'（计数项）',type:'count',weight:b.params.perUnit,control:'counter'});
      }
    }
  });
  return items;
}
function taskRawScore(t,val){
  if(val===''||val==null)return null;
  if(t.type==='toggle')return val?Number(t.maxScore)||0:0;
  if(t.type==='enum'){var m=t.enumMap||{};return Object.prototype.hasOwnProperty.call(m,val)?Number(m[val]):0;}
  if(t.type==='count')return (Number(val)||0)*(Number(t.weight)||0);
  return Number(val)||0;
}
function computeTotal(ev,rec){
  rec=rec||{};
  var st=rec.tasks||{};
  /* 兜底用「直接求和」：本赛制只用这一种。历史上兜底是 weighted_sum，而它会把满分
     口径整个改掉（数值项先归一化到 100 分制、再按权重加），兜错时**不报错只静默算错分**。 */
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'sum';
  var tasks=ev.tasks||[];
  var base=0,scored=0;
  if(tpl==='weighted_sum'){
    tasks.forEach(function(t){
      var raw=taskRawScore(t,st[t.id]);
      if(raw==null)return;
      scored++;
      var norm=(t.type==='numeric'&&t.maxScore)?raw/t.maxScore*100:raw;
      base+=norm*(Number(t.weight)||0);
    });
  }else if(tpl==='sum'){
    tasks.forEach(function(t){var raw=taskRawScore(t,st[t.id]);if(raw==null)return;scored++;base+=raw;});
  }else{
    var vals=tasks.map(function(t){return taskRawScore(t,st[t.id]);}).filter(function(v){return v!=null;});
    scored=vals.length;
    base=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:0;
  }
  var bonus=0;
  (ev.bonusRules||[]).forEach(function(b){
    var p=b.params||{};
    if(b.template==='time_bonus'){
      var t=Number(rec.time)||0;
      if(t>0){var v=(eventTotalSec(ev)-t)*(Number(p.perSecond)||0);if(v<0)v=0;if(p.cap!=null)v=Math.min(v,Number(p.cap));bonus+=v;}
    }else if(b.template==='count_bonus'&&p.taskId){
      var c=Number(st[p.taskId])||0;var w=c*(Number(p.perUnit)||0);if(p.cap!=null)w=Math.min(w,Number(p.cap));bonus+=w;
    }
  });
  var penalty=0;
  if(ev.penaltyRule&&ev.penaltyRule.template==='per_card'){
    var q=ev.penaltyRule.params||{};
    penalty=(Number(rec.yellow)||0)*(Number(q.yellow)||0)+(Number(rec.red)||0)*(Number(q.red)||0);
  }
  /* 红牌按赛项规则归一：直接记的 + 黄牌累计升级出来的。
     关闭黄牌计数器时不再升级 —— 「关掉开关」在规则上真的不生效，而不只是把界面藏起来。 */
  var cards=effectiveRed(ev,rec);
  return {total:Math.max(0,base+bonus-penalty),base:base,bonus:bonus,penalty:penalty,
          yellow:cards.yellow,red:cards.red,upgradedRed:cards.upgraded,dq:cards.red>0,
          complete:tasks.length>0&&scored===tasks.length};
}
/* ---------- 牌面计数规则（黄牌计数器 / 累计升级 / 红牌后果） ----------
   与后端 engine/cards.go 同口径，两端必须一致：
     黄牌 —— 记满阈值即升级成红牌**并清零计数**（计数器上限 = 阈值）；本身不产生任何后果。
     红牌 —— 当场取消比赛资格：成绩保留（照常算分、照常留痕），但不排名次、不参评奖项。
     开关 —— 黄牌计数器关闭 = 整个黄牌体系停用（不显示、不累计、不升级红牌）；
             红牌是独立入口，仍可直接记录。 */
/* 判罚模板恒显示「仅记录不扣分」—— 本赛制只有这一种（与 tplName 恒显示「直接求和」对称）。
   存量数据里若还是历史值（per_card / none），加载时已由 migrate 归一；后端则由迁移 0013 归一。
   所以这里不再按值区分 —— 否则界面会显示出一个赛制里根本不存在的模板名。
   签名保留参数是为了调用点读起来自然。 */
function penName(t){return '仅记录不扣分';}
function cardRulesOf(ev){return (ev&&ev.penaltyRule&&ev.penaltyRule.cardRules)||null;}
function cardCounterOn(ev){var c=cardRulesOf(ev);return !(c&&c.enabled===false);}
function redThresholdOf(ev){var c=cardRulesOf(ev);var n=Number(c&&c.redThreshold);return (n>0?n:3);}
function redReasonsOf(ev){
  var c=cardRulesOf(ev);
  return ((c&&c.reasons)||[]).filter(function(r){return (r.card==='red'?'red':'yellow')==='red';});
}
/* 归一后的牌面：黄牌数（当前周期）+ 红牌数（直接记的 + 黄牌升级出来的）
   🔴 2026/10/10 口径变更（用户定）：黄牌**记满阈值即自动升级 1 张红牌并清零黄牌计数**（循环计数），
   所以裁判端黄牌计数器的上限 = 后台「判罚规则 · 累计升级阈值」。
   老数据兼容：yellow 可能仍是"累计值"（>= 阈值）→ 读入时在这里一并归一（结果与旧口径一致）。 */
function effectiveRed(ev,rec){
  var th=redThresholdOf(ev);
  var yellow=Math.max(0,Number(rec&&rec.yellow)||0);
  var red=Math.max(0,Number(rec&&rec.red)||0);
  var up=Math.max(0,Number(rec&&rec.upgradedRed)||0);
  if(cardCounterOn(ev)&&th>0){up+=Math.floor(yellow/th);yellow=yellow%th;}
  return {yellow:yellow,red:red+up,upgraded:up};
}
function standings(evId){
  var ev=S.events.find(function(e){return e.id===evId;});
  if(!ev)return [];
  var rows=S.teams.filter(function(t){return t.eventId===evId;}).map(function(t){
    var r=S.scores[t.id]||{};
    var c=computeTotal(ev,r);
    return {team:t,total:c.total,base:c.base,bonus:c.bonus,penalty:c.penalty,
            yellow:c.yellow,red:c.red,dq:!!c.dq,complete:c.complete,time:Number(r.time)||0};
  });
  var tb=(ev.rankRule&&ev.rankRule.tieBreak)||['score','time'];
  rows.sort(function(a,b){
    /* 红牌 = 当场取消比赛资格：不参与名次，排到榜单最后（分数仍保留可查） */
    if(!!a.dq!==!!b.dq)return a.dq?1:-1;
    if(b.total!==a.total)return b.total-a.total;
    for(var i=0;i<tb.length;i++){
      if(tb[i]==='time'&&a.time!==b.time)return a.time-b.time;
    }
    return a.team.name.localeCompare(b.team.name,'zh');
  });
  /* 名次与奖项只在「有资格」的队伍之间分配：被取消资格的队留在榜内可查，
     但不占名次序号、也不占获奖名额 —— 否则第 1 名被取消后奖项会整段偏移。 */
  var live=rows.filter(function(r){return !r.dq;});
  var n=live.length,tiers=(ev.rankRule&&ev.rankRule.awardTiers)||{};
  var idx=0;
  Object.keys(tiers).forEach(function(name){
    var cnt=Math.ceil(n*(Number(tiers[name])||0));
    for(var i=0;i<cnt&&idx<n;i++,idx++)live[idx].award=name;
  });
  live.forEach(function(r,i){
    r.rank=i+1;
    r.tie=(i>0&&live[i-1].total===r.total);
  });
  rows.forEach(function(r){if(r.dq){r.rank=0;r.tie=false;r.award=undefined;}});
  return rows;
}
function validateEvent(ev){
  var errs=[],warns=[];
  var tpl=(ev.scoreRule&&ev.scoreRule.template)||'';
  var wsum=(ev.tasks||[]).reduce(function(s,t){return s+(Number(t.weight)||0);},0);
  if(tpl==='weighted_sum'&&Math.abs(wsum-1)>0.001)warns.push('numeric 任务权重之和 = '+wsum.toFixed(2)+'，weighted_sum 下建议 = 1.0');
  var seen={};
  (ev.tasks||[]).forEach(function(t){
    if(seen[t.id])errs.push('任务 id 重复：'+t.id);
    seen[t.id]=1;
    if(!t.name)errs.push('存在未命名的任务');
    if(t.type==='enum'&&(!t.enumMap||!Object.keys(t.enumMap).length))errs.push('enum 任务「'+t.name+'」缺少等级映射 enumMap');
  });
  (ev.bonusRules||[]).forEach(function(b,i){
    if(b.template==='count_bonus'){
      var tid=b.params&&b.params.taskId;
      if(!tid)errs.push('奖励规则 #'+(i+1)+' 未指定 taskId');
      else{
        var okAny=(ev.bonusRules||[]).some(function(x){return x.params&&x.params.taskId===tid;})||(ev.tasks||[]).some(function(t){return t.id===tid;});
        if(!okAny)errs.push('奖励规则 #'+(i+1)+' 引用的任务「'+tid+'」不存在');
      }
    }
  });
  var tierSum=Object.keys(ev.rankRule&&ev.rankRule.awardTiers||{}).reduce(function(a,k){return a+Number(ev.rankRule.awardTiers[k]||0);},0);
  if(tierSum>1.0001)warns.push('奖项占比之和 = '+tierSum.toFixed(2)+'，建议 ≤ 1.0');
  if(tierSum===0)warns.push('奖项占比全为 0，榜单将不分配奖项');
  if(ev.customFormula!=null)errs.push('customFormula 必须为 null（本期 A 档不支持自定义公式）');
  return {errs:errs,warns:warns};
}

/* 中文映射层：界面只出现中文，英文键仅用于内部存储与导出 JSON */

var CONTROL_NAMES={slider:'滑块（0–满分）',number:'数字输入',counter:'计数器（增减）',select:'下拉选择',toggle:'开关（是/否）'};
var BONUS_NAMES={time_bonus:'时间奖励（越快加分）',count_bonus:'计数奖励（按数量加分）',none:'无奖励'};
var TIE_NAMES={score:'得分高者优先',time:'用时少者优先'};

/* 本赛制只有「直接求和」一种计分规则 —— 界面上恒显示它，不再出现其它模板名。
   前后端引擎仍保留其它模板的算分分支（历史数据要能逐位复现），但界面已无切换入口，

function tplName(t){return '直接求和';}

function taskTypeName(t){return TASK_TYPES[t]||t||'—';}
function bonusName(t){return BONUS_NAMES[t]||t||'—';}

  var keys=['slider','number','counter','select','toggle'];
  var html=keys.map(function(x){return '<option value="'+x+'" '+(cur===x?'selected':'')+'>'+CONTROL_NAMES[x]+'</option>';}).join('');
  if(cur&&keys.indexOf(cur)<0)html='<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>'+html;

   保留此函数是为了：① 历史/外部调用；② 以后赛制若改口要用别的模板，接回下拉即可 ——
   它负责的「切模板时保留 params.refTime」逻辑仍然是有用的参考。 */
function updEventTpl(v){

  ev.scoreRule={template:v,params:{}};

  if(_keepRef!=null)ev.scoreRule.params.refTime=_keepRef;

function ensureCardRules(){
  var ev=find(CUR_EVENT);if(!ev)return null;
  if(!ev.penaltyRule)ev.penaltyRule={template:'record_only',params:{}};
  if(!ev.penaltyRule.params)ev.penaltyRule.params={};
  if(!ev.penaltyRule.cardRules)ev.penaltyRule.cardRules={enabled:true,redThreshold:3,reasons:[]};
  var cr=ev.penaltyRule.cardRules;
  if(!cr.reasons)cr.reasons=[];
  if(cr.enabled==null)cr.enabled=true;      /* 未配置 = 开：旧数据没这个字段，不能当成关 */
  if(cr.redThreshold==null)cr.redThreshold=3;
  if(!ev.penaltyRule.template)ev.penaltyRule.template='record_only';
  return cr;
}
/* 黄牌计数器总开关。关闭 = 整个黄牌体系停用：裁判端不显示计数器、黄牌不累计、
   也不再有「累计 N 张升级红牌」；红牌是独立入口，仍可照记。 */
function updCardCounter(on){
  var cr=ensureCardRules();if(!cr)return;
  var ev=find(CUR_EVENT);
  cr.enabled=!!on;
  logAudit('改配置',ev.name+' · 黄牌计数器',(on?'关闭':'开启'),(on?'开启':'关闭'),
    on?'黄牌累计与红牌升级生效':'整个黄牌体系停用（不显示、不累计、不升级红牌），红牌仍可直接记录');

function updRedThreshold(v){var cr=ensureCardRules();if(!cr)return;cr.redThreshold=Number(v)||3;save();}
/* 红牌事由的下标映射：redReasonsOf() 是 filter 出来的子集，其序号不等于
   cardRules.reasons 里的下标（历史数据可能混有黄牌事由），所以必须回查真实下标，
   否则会改错条目 —— 这类「看起来对、改在别条上」的缺陷在界面上很难被发现。 */
function redReasonIndexAt(gi){
  var cr=ensureCardRules();if(!cr)return -1;
  var n=0;
  for(var i=0;i<cr.reasons.length;i++){
    if((cr.reasons[i].card==='red'?'red':'yellow')==='red'){
      if(n===gi)return i;
      n++;
    }
  }
  return -1;
}

  cr.reasons.push({code:'R'+('0'+(n+1)).slice(-2),card:'red',label:''});
  logAudit('改配置',ev.name+' · 红牌事由','—','新增 1 条','赛项判罚事由按赛项配置');
  save();render();
}
function updRedReason(gi,k,v){
  var cr=ensureCardRules();if(!cr)return;
  var i=redReasonIndexAt(gi);if(i<0)return;
  cr.reasons[i][k]=v;save();
}
function delRedReason(gi){
  var cr=ensureCardRules();if(!cr)return;

    dv.setUint16(26,nb.length,true);dv.setUint16(28,0,true);lh.set(nb,30);

    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);

  IMP.decisions[i]=v;
  it.checked=(v==='file'&&it.canFile);
  render();
}
function impSkipAllConflicts(){
  (IMP.diff||[]).forEach(function(it){if(it.status==='conflict'&&!(it.i in IMP.decisions)){IMP.decisions[it.i]='skip';it.checked=false;}});
  render();
}
function impToggle(i){
  var it=IMP.diff&&IMP.diff[i];if(!it)return;
  var e=impEff(it);
  if(e!=='insert'&&e!=='update')return;
  it.checked=!it.checked;render();
}
function impToggleAll(v){
  (IMP.diff||[]).forEach(function(it){var e=impEff(it);if(e==='insert'||e==='update')it.checked=!!v;});
  render();
}
/* 改编号：改完就地重算这一行（不是重跑全量） */
function impRenum(i,el){
  var it=IMP.diff&&IMP.diff[i];if(!it)return;
  var nv=String(el&&el.value!=null?el.value:'').replace(/\s/g,'');
  if(!nv)return;
  it.o.team_number=nv;
  delete IMP.decisions[i];
  if(it.server){impBackendPreview();return;}   /* 后端模式：改了数据要服务端重算 */
  impApplyRow(it,impRowCounts(IMP.diff));
  render();
}
/* ---------- 提交 ---------- */
function impCommit(){
  if(!IMP.diff)return;
  /* 未裁决冲突的闸门放在模式分叉之前 —— 两种模式共用，后端模式不得绕过它 */
  var eff=impEffCounts();
  var undecided=(IMP.diff||[]).filter(function(it){return impEff(it)==='conflict';}).length;
  if(undecided){
    alert('还有 '+undecided+' 条冲突未裁决。\n请在第 3 步逐条选择'+
      (backendMode?'（服务端不接受覆盖，只能「以库内为准 / 跳过」，或改编号后重算）':'「以文件为准 / 以库内为准 / 跳过」，或改编号后重算')+
      '；也可点「冲突全部跳过」。');
    return;
  }
  if(backendMode){impBackendCommit();return;}   /* 后端模式：写入交给服务端（与审计同事务） */
  if(readonlyGuard())return;   /* 归档赛事只读 —— 与其它写路径一致，避免「界面改了但没落盘」 */
  var pending=0,affected=0;
  IMP.diff.forEach(function(it){
    var e=impEff(it);
    if((e!=='insert'&&e!=='update')||!it.checked)return;
    pending++;
    if(it.team&&S.scores[it.team.id])affected++;
  });
  if(!pending){alert('没有可应用的行（可能全部为跳过，或都没勾选）。');return;}
  var conflicted=IMP.diff.filter(function(it){return it.status==='conflict';}).length;
  var msg='确认写入？\n\n· 新增 '+eff.insert+' 支\n· 更新 '+eff.update+' 支\n· 跳过 '+eff.skip+' 行\n'+
    (conflicted?('· 其中 '+conflicted+' 行原为冲突，已按你的裁决处理\n'):'')+
    (affected?('· 其中 '+affected+' 支已有成绩：只改报名信息，不动成绩\n'):'')+
    '\n来源：'+(IMP.fileName||'（粘贴 / 样例数据）')+'\n操作人：'+currentUser().name;
  if(!confirm(msg))return;
  var snap={added:[],updated:[]},detail=[];
  IMP.diff.forEach(function(it){
    var e=impEff(it);
    if((e!=='insert'&&e!=='update')||!it.checked)return;
    var o=it.o,bulk=impIsBulk(),evId=bulk?IMP.bulkEvent:EVENT_BY_NAME[o.event_code];
    var src=bulk?'excel_bulk':'excel';   /* 来源分开记 —— 审计里能看清是哪个通道进来的 */
    if(e==='insert'){
      var nid=uid('tm');
      S.teams.push({id:nid,no:o.team_number,name:o.team_name,school:o.school,coach:o.coach,
        eventId:evId,group:o.group_code,members:(o.members||''),status:'active',source:src});
      snap.added.push(nid);
      detail.push({act:'insert',no:o.team_number,name:o.team_name});
    }else{
      var mt=it.team;if(!mt)return;
      snap.updated.push({id:mt.id,before:{name:mt.name,school:mt.school,coach:mt.coach,group:mt.group,eventId:mt.eventId,members:mt.members,source:mt.source}});
      mt.name=o.team_name;mt.school=o.school;mt.coach=o.coach;mt.group=o.group_code;mt.eventId=evId;mt.source=src;
      if(bulk)mt.members=(o.members||'');
      detail.push({act:'update',no:o.team_number,name:o.team_name,changes:it.changes});
    }
  });
  var tasks=impTaskList();
  tasks.unshift({id:uid('it_'),ts:nowStr(),operator:currentUser().name,source:(impIsBulk()?'excel_bulk':'excel'),
    fileName:IMP.fileName||'（粘贴 / 样例数据）',summary:eff,
    status:(conflicted?'partial':'done'),detail:detail,affectedScores:affected,snapshot:snap});
  S.importTasks=tasks.slice(0,50);
  save();
  IMP.lastResult={insert:eff.insert,update:eff.update,skip:eff.skip,conflict:eff.conflict,
    affected:affected,fileName:IMP.fileName||'（粘贴 / 样例数据）'};
  IMP.diff=null;IMP.text='';IMP.headers=null;IMP.grid=null;IMP.decisions={};IMP.parsed=false;IMP.fileName='';IMP.showPaste=false;
  IMP.mode='wizard';IMP.step=5;   /* 第 5 态：完成页（否则成功提示会被立刻切走，用户看不到结果） */
  render();
}
/* ---------- 撤回 ---------- */
function impRevoke(id){
  if(readonlyGuard())return;
  var t=null;
  impTaskList().forEach(function(x){if(x.id===id)t=x;});
  if(!t)return;
  if(t.legacy){alert('这是升级前的历史导入记录，没有回滚快照，无法撤回。');return;}
  if(t.status==='revoked'){alert('这批导入已经撤回过了。');return;}
  if(t.affectedScores>0){
    alert('撤回被拒绝：\n该批导入涉及的队伍已有 '+t.affectedScores+' 支产生成绩。\n撤回会破坏成绩与队伍的归属关系，请手工处理。');
    return;
  }
  var sn=t.snapshot||{added:[],updated:[]};
  if(!confirm('确认撤回这批导入？\n\n· 撤销本次新增 '+sn.added.length+' 支\n· 回滚本次更新 '+sn.updated.length+' 支\n\n撤回会另写一条记录，原记录保留可查。'))return;
  sn.added.forEach(function(tid){S.teams=S.teams.filter(function(x){return x.id!==tid;});});
  sn.updated.forEach(function(u){
    var mt=null;
    for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===u.id){mt=S.teams[i];break;}}
    if(!mt)return;
    var b=u.before||{};
    mt.name=b.name;mt.school=b.school;mt.coach=b.coach;mt.group=b.group;mt.eventId=b.eventId;mt.source=b.source;
    if('members' in b)mt.members=b.members;
  });
  t.status='revoked';t.revokedAt=nowStr();
  impTaskList().unshift({id:uid('it_'),ts:nowStr(),operator:currentUser().name,source:t.source||'excel',
    fileName:'（撤回）'+(t.fileName||''),summary:{insert:0,update:0,skip:0,conflict:0},
    status:'revoked',detail:[{act:'revoke',no:'—',name:'撤回 '+(t.fileName||'')}],affectedScores:0,snapshot:null});
  save();render();
}
/* ---------- .xlsx 直读（零依赖：ZIP central directory + DecompressionStream + XML 扫描） ---------- */
function xmlUnescape(s){
  return String(s==null?'':s)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
    .replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(Number(d));})
    .replace(/&amp;/g,'&');
}
function colIndexFromRef(ref){
  var m=/^([A-Z]+)/.exec(String(ref||'').toUpperCase());
  if(!m)return -1;
  var s=m[1],n=0;
  for(var i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);
  return n-1;
}
function parseSharedStringsXml(xml){
  var out=[],re=/<si\b[^>]*>([\s\S]*?)<\/si>/g,m;
  while((m=re.exec(xml))){
    var blk=m[1],s='',t=/<t\b[^>]*>([\s\S]*?)<\/t>/g,tm;
    while((tm=t.exec(blk)))s+=xmlUnescape(tm[1]);
    out.push(s);
  }
  return out;
}
function parseSheetXml(xml,shared){
  var grid=[],rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g,rm;
  while((rm=rowRe.exec(xml))){
    var rowXml=rm[1],arr=[],cellRe=/<c\b([^>]*?)\/>|<c\b([^>]*?)>([\s\S]*?)<\/c>/g,cm;
    while((cm=cellRe.exec(rowXml))){
      var attrs=(cm[1]!=null?cm[1]:(cm[2]||'')),inner=cm[3]||'';
      var rA=/r="([^"]+)"/.exec(attrs);
      var ci=rA?colIndexFromRef(rA[1]):arr.length;
      if(ci<0)ci=arr.length;
      var tA=/t="([^"]+)"/.exec(attrs);
      var t=tA?tA[1]:'';
      var val='';
      if(t==='inlineStr'||t==='str'){
        var it=/<t\b[^>]*>([\s\S]*?)<\/t>/.exec(inner);
        val=it?xmlUnescape(it[1]):'';
      }else{
        var v=/<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        if(v){
          val=v[1];
          if(t==='s'){var si=Number(val);val=(shared&&shared[si]!=null)?shared[si]:'';}
          else val=xmlUnescape(val);
        }
      }
      arr[ci]=String(val);
    }
    for(var q=0;q<arr.length;q++)if(arr[q]==null)arr[q]='';
    if(arr.some(function(x){return String(x).trim()!=='';}))grid.push(arr);
  }
  return grid;
}
async function inflateRaw(data){
  if(typeof DecompressionStream==='undefined')throw new Error('当前环境不支持解压，请改用「粘贴 CSV」兜底通道');
  var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(st).text();
}
async function unzipXlsx(u8){
  var dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  var eocd=-1;
  for(var i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0)throw new Error('不是有效的 .xlsx（未找到 ZIP 结构）');
  var count=dv.getUint16(eocd+10,true),cdOff=dv.getUint32(eocd+16,true),p=cdOff,entries=[];
  for(var k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nameLen=dv.getUint16(p+28,true);
    var extraLen=dv.getUint16(p+30,true);
    var cmtLen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    entries.push({name:name,method:method,csize:csize,lho:lho});
    p+=46+nameLen+extraLen+cmtLen;
  }
  var wanted=/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/;
  var out={};
  for(var j=0;j<entries.length;j++){
    var e=entries[j];
    if(!wanted.test(e.name))continue;
    var lnl=dv.getUint16(e.lho+26,true),lel=dv.getUint16(e.lho+28,true);
    var start=e.lho+30+lnl+lel;
    var data=u8.subarray(start,start+e.csize);
    out[e.name]=(e.method===0)?new TextDecoder().decode(data):await inflateRaw(data);
  }
  return out;
}
async function readXlsxGrid(u8){
  var files=await unzipXlsx(u8);
  var shared=files['xl/sharedStrings.xml']?parseSharedStringsXml(files['xl/sharedStrings.xml']):[];
  var sheets=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);})
    .sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});
  if(!sheets.length)throw new Error('未找到工作表（xl/worksheets/sheet1.xml）');
  return parseSheetXml(files[sheets[0]],shared);
}
async function impHandleFile(file){
  if(!file)return;
  IMP.error='';IMP.fileName=file.name||'';IMP.busy=true;IMP.diff=null;IMP.grid=null;IMP.headers=null;IMP.decisions={};
  render();
  try{
    var nm=(file.name||'').toLowerCase();
    if(/\.csv$/.test(nm)){
      var text=await file.text();
      IMP.busy=false;IMP.text=text;IMP.fromExcel=false;IMP.showPaste=true;
      impParse();                     /* 第 1 步 → 第 2 步：只读表头 */
      return;
    }
    if(/\.xls$/.test(nm))throw new Error('.xls 为旧版二进制格式，请在 Excel 中另存为 .xlsx 后重试');
    if(!/\.xlsx$/.test(nm))throw new Error('仅支持 .xlsx / .csv（当前：'+(file.name||'未知')+'）');
    var buf=new Uint8Array(await file.arrayBuffer());
    var grid=await readXlsxGrid(buf);
    IMP.fromExcel=true;IMP.text='';
    impAdoptGrid(grid);
  }catch(e){
    IMP.busy=false;IMP.diff=null;IMP.grid=null;IMP.headers=null;
    IMP.error='Excel 解析失败：'+((e&&e.message)?e.message:e);
    render();
  }
}
function impFilePicked(input){ var f=input&&input.files&&input.files[0]; impHandleFile(f); }
function impDrop(ev){
  ev.preventDefault();
  var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];
  if(f)impHandleFile(f);
}
function impTogglePaste(){IMP.showPaste=!IMP.showPaste;render();}

function impBulkTargetBox(){

}
function impSetBulkEvent(id){
  IMP.bulkEvent=id;
  if(IMP.grid){IMP.step=3;ingestGrid(IMP.grid);if(backendMode)impBackendPreview();}else{IMP.diff=null;render();}
}
/* ================= 后端模式：导入走服务端权威接口 =================
   本仓后端已有 POST /imports/preview 与 POST /imports/commit ——
   服务端会**重新算一遍比对结果**、只采纳客户端勾选的行号、并把写入与 import_logs 审计放同一事务。
   所以 backendMode 下预览与提交都交给服务端，前端不再自己算、也不自己写。

   三处与本地模式的能力差异（如实反映，不做假的"看起来一样"）：
     · 冲突行由服务端标记 selectable=false → **不提供「以文件为准」覆盖**，只能跳过或改编号；
     · 服务端没有撤回接口 → 任务列表在 backendMode 下不显示「撤回」；
     · 预览/提交都以「单个赛项」为单位 → 多赛项文件按赛项分组，逐组调用。 */
function impRowsByEvent(){
  var bulk=impIsBulk(),map={},order=[];
  (IMP.diff||[]).forEach(function(it){
    var eid=bulk?IMP.bulkEvent:EVENT_BY_NAME[it.o.event_code];
    if(!eid)return;
    if(!map[eid]){map[eid]=[];order.push(eid);}
    map[eid].push(it.o);
  });
  return {map:map,order:order};
}
function impToRemoteRows(list){
  return list.map(function(o){
    return {no:o.team_number,name:o.team_name,school:o.school||'',coach:o.coach||'',
      group:o.group_code||'',members:o.members||'',lineNo:o._row};
  });
}
function impBackendPreview(){
  if(!IMP.diff||!IMP.diff.length){IMP.error=IMP.error||'没有可校验的行。';render();return;}
  var g=impRowsByEvent();
  if(!g.order.length){IMP.error='没有可提交到后端的行：表里的「赛项」无法识别（请检查列映射）。';render();return;}
  IMP.busy=true;IMP.error='';render();
  Promise.all(g.order.map(function(eid){
    return backendFetch('/imports/preview',{method:'POST',body:{eventId:eid,rows:impToRemoteRows(g.map[eid])}})
      .then(function(r){return {eid:eid,res:r};});
  })).then(function(rs){
    IMP.busy=false;
    var items=[],bad=[];
    rs.forEach(function(x){
      if(!x.res.ok||!x.res.body||x.res.body.code!==0){bad.push(x);return;}
      var d=x.res.body.data||{};
      var ev=find(x.eid)||{};
      (d.rows||[]).forEach(function(rw){
        var o={_row:rw.line,
          team_number:(rw.row&&rw.row.no)||'',team_name:(rw.row&&rw.row.name)||'',
          school:(rw.row&&rw.row.school)||'',coach:(rw.row&&rw.row.coach)||'',
          group_code:(rw.row&&rw.row.group)||'',members:(rw.row&&rw.row.members)||'',
          event_code:ev.name||''};
        var team=null;
        for(var i=0;i<S.teams.length;i++){if(S.teams[i].no===o.team_number){team=S.teams[i];break;}}
        items.push({i:items.length,o:o,status:rw.status,
          errs:(rw.conflicts||[]).slice(),
          changes:(rw.changes||[]).map(function(c2){return {label:c2.label,old:c2.before||'—',new:c2.after||'—',structural:false};}),
          canFile:!!rw.canOverride,  /* 由服务端判定：只有「结构性变更」才允许人工裁决「以文件为准」 */
          team:team,checked:!!rw.selectable,server:true});
      });
    });
    if(bad.length){
      IMP.error='服务端预览失败：'+bad.map(function(x){
        return ((find(x.eid)||{}).name||x.eid)+' — '+((x.res.body&&x.res.body.message)||'未知错误');}).join('；');
    }
    IMP.diff=items;IMP.decisions={};IMP.f={st:'all',kw:''};
    IMP.step=3;render();
  })['catch'](function(e){IMP.busy=false;IMP.error='服务端预览失败：'+((e&&e.message)?e.message:e);render();});
}
function impBackendCommit(){
  if((IMP.diff||[]).some(function(it){return impEff(it)==='conflict';})){alert('还有未裁决的冲突行，请先在第 3 步处理。');return;}
  var g=impRowsByEvent(),jobs={},forcedBy={},count=0,forcedCount=0;
  (IMP.diff||[]).forEach(function(it){
    if(!it.checked)return;
    var eid=impIsBulk()?IMP.bulkEvent:EVENT_BY_NAME[it.o.event_code];
    if(!eid)return;
    (jobs[eid]=jobs[eid]||[]).push(it.o._row);count++;
    /* 冲突行只有被人工裁决为「以文件为准」才会走到这里（impDecide 只在 canFile 时勾选）。
       服务端要求逐行显式声明 —— 这里按行号把裁决传过去，不搞"整批强制"。 */
    if(it.status==='conflict'&&IMP.decisions[it.i]==='file'){
      (forcedBy[eid]=forcedBy[eid]||[]).push({line:it.o._row,mode:'file'});
      forcedCount++;
    }
  });
  var ids=g.order.filter(function(eid){return jobs[eid]&&jobs[eid].length;});
  if(!ids.length){alert('没有勾选任何可写入的行。');return;}
  var msg='确认写入后端？\n\n· 提交 '+ids.length+' 个赛项、共 '+count+' 行\n'+
    '· 服务端会重新比对一次，只采纳你勾选的行号\n'+
    '· 写入与 import_logs 审计在同一事务内\n'+
    (forcedCount?('· 其中 '+forcedCount+' 行为人工裁决「以文件为准」，会**强制覆盖**库内\n'):'')+
    '· 服务端不支持撤回，导错了要在队伍管理里手工改\n\n'+
    '来源：'+(IMP.fileName||'（粘贴 / 样例数据）');
  if(!confirm(msg))return;
  IMP.busy=true;render();
  Promise.all(ids.map(function(eid){
    return backendFetch('/imports/commit',{method:'POST',body:{eventId:eid,
      rows:impToRemoteRows(g.map[eid]),selectedLines:jobs[eid],
      overrides:forcedBy[eid]||[],
      note:'前端导入：'+(IMP.fileName||'粘贴数据')}}).then(function(r){return {eid:eid,res:r};});
  })).then(function(rs){
    IMP.busy=false;
    var total={insert:0,update:0,skip:0,conflict:0},fail=[];
    rs.forEach(function(x){
      if(!x.res.ok||!x.res.body||x.res.body.code!==0){fail.push(x);return;}
      var s=(x.res.body.data&&x.res.body.data.summary)||{};
      total.insert+=s.insert||0;total.update+=s.update||0;total.skip+=s.skip||0;total.conflict+=s.conflict||0;
    });
    if(fail.length){
      alert('有 '+fail.length+' 个赛项提交失败：\n'+fail.map(function(x){
        return '· '+((find(x.eid)||{}).name||x.eid)+'：'+((x.res.body&&x.res.body.message)||'未知错误');}).join('\n'));
    }
    IMP.lastResult={insert:total.insert,update:total.update,skip:total.skip,conflict:total.conflict,
      affected:0,fileName:IMP.fileName||'（粘贴 / 样例数据）'};
    IMP.diff=null;IMP.headers=null;IMP.grid=null;IMP.decisions={};IMP.parsed=false;IMP.fileName='';IMP.text='';
    IMP.mode='wizard';IMP.step=5;render();
    if(backendMode)loadFromBackend();   /* 任务列表以服务端 import_logs 为权威，重新拉一次 */
  })['catch'](function(e){IMP.busy=false;alert('提交失败：'+((e&&e.message)?e.message:e));render();});
}

      (backendMode?('　<b style="color:#1b63ab">写入后端</b>（服务端重算 + 同事务审计，无撤回）'):'')+
      (affected?('　其中 <b>'+affected+'</b> 支已有成绩：<b>只改报名信息，不动成绩</b>'):'')+'</div>'+
    '<div class="hint">写入是<b>合并式</b>：只 upsert 勾选的行，不删除任何队伍；退赛队伍请到「队伍管理」标记，不在导入里处理。提交后会生成一条导入任务记录（带回滚快照，可在任务列表撤回）。</div>'+

function selTeamEvent(id){CUR_EVENT=id;CUR_TEAM=null;render();}
function addTeam(){
  var n=(document.getElementById('ntName')||{}).value||'';
  var no=((document.getElementById('ntNo')||{}).value||'').trim();
  if(!n.trim()){alert('请填写队伍名称');return;}
  if(!no||!/^\d+$/.test(no)){alert('队伍编号必填且须为纯数字');return;}
  if(S.teams.some(function(t){return t.no===no;})){alert('队伍编号 '+no+' 已存在（编号须唯一）');return;}
  S.teams.push({id:uid('tm'),no:no,name:n.trim(),
    school:((document.getElementById('ntSchool')||{}).value||'').trim(),
    coach:((document.getElementById('ntCoach')||{}).value||'').trim(),
    eventId:CUR_EVENT,group:((document.getElementById('ntGroup')||{}).value||'').trim(),
    members:((document.getElementById('ntMembers')||{}).value||'').trim(),
    status:'active',source:'manual'});
  save();render();
}
function delTeam(id){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!confirm('删除该队伍及其成绩？'))return;
  S.teams=S.teams.filter(function(x){return x.id!==id;});
  delete S.scores[id];
  logAudit('删队',(t?t.name+'（'+t.no+'）':id),'在册','已删除','队伍数据清理');
  save();render();
}
function toggleWithdraw(id){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t)return;
  var to=(t.status==='withdrawn')?'active':'withdrawn';
  if(to==='withdrawn'&&!confirm('将「'+t.name+'」标记为弃赛？队伍与历史成绩保留（软删除，不物理删除）。'))return;
  var before=t.status||'active';
  t.status=to;
  logAudit('弃赛',t.name+'（'+t.no+'）',before,to,to==='withdrawn'?'选手弃赛（软删除，保留历史成绩）':'恢复参赛');
  save();render();
}
function changeTeamGroup(id,g){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t||t.group===g)return;
  var before=t.group;
  t.group=g;
  logAudit('改组',t.name+'（'+t.no+'）',before,g,'组别调整');
  save();render();
}

/* 参赛轮次：某队下午不来时改这里（成绩**全部保留**、榜单标「仅第 N 轮」），
   比整队弃赛轻得多。它会改变该队出现在哪些场次里（派生按轮次过滤），
   所以后端也记一条留痕（PUT /teams/{id}/session）。 */
function changeTeamSession(id,v){
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===id){t=S.teams[i];break;}}
  if(!t)return;
  var before=t.session||'both';
  if(before===v)return;
  t.session=v;
  if(backendMode&&t.bId){
    backendFetch('/teams/'+t.bId+'/session',{method:'PUT',
      body:{session:v,reason:'现场调整参赛轮次'},timeout:8000})
    .then(function(r){
      if(r&&r.ok===false){throw new Error((r.body&&r.body.message)||('HTTP '+r.status));}
      setBackendStatus('online','参赛轮次已同步');
    }).catch(function(e){
      setBackendStatus('error','参赛轮次未同步到后端：'+(e&&e.message?e.message:'网络错误'));
    });
  }
  logAudit('改配置',t.name+' 参赛轮次',sessionName(before),sessionName(v),'现场调整');
  save();render();
}

        '<option value="ops" '+(SCORE_ENTRY_ROLE==='ops'?'selected':'')+'>运营代录</option>'+

      '</select>'+

function selScoreEvent(id){SCORE_EVENT=id;CUR_TEAM=null;render();}
function selScoreTeam(id){CUR_TEAM=id;render();}
function setEntryRole(v){SCORE_ENTRY_ROLE=v;saveEntryRole();render();}
function scoreForm(ev){
  if(!CUR_TEAM)return '<h2>录入</h2><div class="hint">请选择左侧队伍。</div>';
  var team=S.teams.find(function(t){return t.id===CUR_TEAM;});
  var rec=S.scores[CUR_TEAM]||(S.scores[CUR_TEAM]={tasks:{},time:0,yellow:0,red:0,signed:false});
  rec.tasks=rec.tasks||{};
  var items=getInputItems(ev);
  var fields=items.map(function(it){
    var v=rec.tasks[it.id];
    var ctl;
    if(it.type==='toggle'){
      ctl='<label class="row tight" style="cursor:pointer"><input type="checkbox" style="width:auto" '+((v===true||v==='true')?'checked':'')+' onchange="setScore(\''+it.id+'\',this.checked)"> <span class="small">已完成</span></label>';
    }else if(it.type==='enum'){
      var en=it.enumMap||{};var keys=Object.keys(en);
      if(!keys.length)keys=['优','良','中','差'];
      ctl='<select onchange="setScore(\''+it.id+'\',this.value)"><option value="">-- 请选择 --</option>'+
        keys.map(function(k){return '<option value="'+esc(k)+'" '+(v===k?'selected':'')+'>'+esc(k)+(en[k]!=null?'（'+en[k]+'分）':'')+'</option>';}).join('')+'</select>';
    }else if(it.type==='count'){
      ctl='<input type="number" min="0" value="'+(v==null?'':esc(v))+'" oninput="setScore(\''+it.id+'\',this.value)">';
    }else{
      var mx=it.maxScore||100;
      ctl='<div class="range"><input type="range" min="0" max="'+mx+'" value="'+(v==null?0:esc(v))+'" oninput="setScore(\''+it.id+'\',this.value);this.nextElementSibling.nextElementSibling.textContent=this.value">'+
          '<span class="thumb" style="flex:1;justify-content:space-between"><i>0</i><i>'+mx+'</i></span><b>'+(v==null?0:esc(v))+'</b></div>';
    }
    return '<div class="fld"><label>'+esc(it.name)+' <span class="tag">'+esc(taskTypeName(it.type))+'</span>'+

  }).join('');

  var tbInfo=timeBonusInfo(ev,rec);   /* 本队用时 → 奖励时间（= 总时间 − 用时） */

  return (SCORE_ENTRY_ROLE==='ops'
    ? '<div class="note" style="margin-bottom:10px"><b>运营代录</b>：本页为运营在后台代录 / 管理成绩，提交后成绩以「运营代录」身份留痕；现场裁判自录成绩请走平板评分端。</div>'
    : '')+
    '<h2>成绩录入 <small>'+esc(team?team.name:'')+' · '+esc(ev.name)+' · '+(SCORE_ENTRY_ROLE==='ops'?'运营代录':'现场回传')+'</small></h2>'+
    fields+
    '<hr class="sep">'+
    '<div class="grid g3">'+
      '<div class="fld"><label>用时（秒）</label><input type="number" min="0" value="'+(rec.time||'')+'" oninput="setMeta(\'time\',this.value)"></div>'+
      '<div class="fld"><label>黄牌数</label><input type="number" min="0" value="'+(rec.yellow||'')+'" oninput="setMeta(\'yellow\',this.value)"></div>'+
      '<div class="fld"><label>红牌数</label><input type="number" min="0" value="'+(rec.red||'')+'" oninput="setMeta(\'red\',this.value)"></div>'+
    '</div>'+
    '<div class="note" style="margin-bottom:12px">时间奖励：比赛总时间 <b>'+(tbInfo.has?mmss(tbInfo.total)+'（'+tbInfo.total+' 秒）':'—')+'</b> − 本队用时 <b>'+(tbInfo.used>0?mmss(tbInfo.used)+'（'+tbInfo.used+' 秒）':'未填')+'</b> = 奖励时间 <b>'+tbInfo.reward+' 秒</b>，每 1 秒 +'+(tbInfo.perSecond==null?'—':tbInfo.perSecond)+' 分'+(tbInfo.cap==null?'（不封顶）':'（封顶 '+tbInfo.cap+' 分）')+' → 本项 +'+tbInfo.score.toFixed(1)+' 分。</div>'+
    '<div class="row" style="justify-content:space-between">'+
      '<label class="row tight" style="cursor:pointer"><input type="checkbox" style="width:auto" '+(rec.signed?'checked':'')+' onchange="toggleSign(this.checked)"> <span class="small">选手代表已签字确认</span></label>'+
      '<span class="small">实时预估总分：<b id="preview" style="font-size:16px;color:#185FA5">'+computeTotal(ev,rec).total.toFixed(1)+'</b></span>'+
    '</div>'+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn" onclick="requestScoreChange()">发起改分申请（需裁判长授权）</button>'+

    '</div>'+
    '<div class="hint" style="margin-top:10px">录入即存本地（离线优先）；联网后随裁判码同步。未来之城 V7.3 双队对抗时，两队选手代表均需签字。</div>';
}
function curRec(){
  if(!CUR_TEAM)return null;
  if(!S.scores[CUR_TEAM])S.scores[CUR_TEAM]={tasks:{},time:0,yellow:0,red:0,signed:false};
  if(!S.scores[CUR_TEAM].tasks)S.scores[CUR_TEAM].tasks={};
  S.scores[CUR_TEAM].enteredBy=SCORE_ENTRY_ROLE;
  return S.scores[CUR_TEAM];
}
function setScore(tid,v){var r=curRec();if(!r)return;r.tasks[tid]=v;save();refreshPreview();}
function setMeta(k,v){var r=curRec();if(!r)return;r[k]=Number(v)||0;save();refreshPreview();}
function toggleSign(v){var r=curRec();if(!r)return;r.signed=!!v;save();}
function refreshPreview(){
  var ev=find(SCORE_EVENT);var r=curRec();var el=document.getElementById('preview');
  if(ev&&r&&el)el.textContent=computeTotal(ev,r).total.toFixed(1);
}
function requestScoreChange(){
  var ev=find(SCORE_EVENT),r=curRec();
  if(!ev||!r||!CUR_TEAM){alert('请先选择队伍。');return;}
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===CUR_TEAM){t=S.teams[i];break;}}
  var before=computeTotal(ev,r).total.toFixed(1);
  var reason=prompt('改分申请：请填写申诉 / 复核原因（裁判长授权后生效）','申诉复核');
  if(!reason)return;
  logAudit('改分',(t?t.name+'（'+t.no+'）':CUR_TEAM)+' · '+ev.name,'总分 '+before,'总分 '+before+'（待裁判长授权）',(SCORE_ENTRY_ROLE==='ops'?'运营代录 ':'')+reason);
  alert('改分申请已记录，等待裁判长授权。\n依据：裁判提交后禁止直接改分，须走审批并留痕。');
  render();
}

function viewRank(){

  var ev=find(RANK_EVENT)||S.events[0];
  var rows=ev?standings(ev.id):[];
  var body=rows.map(function(r){

/* ---------- 视图 8：赛台与赛程编排 ---------- */
var CUR_SLOT=null;
function periodTime(p){return p==='上午'?'09:00–12:00':'14:00–17:00';}
function slotById(id){for(var i=0;i<S.slots.length;i++){if(S.slots[i].id===id)return S.slots[i];}return null;}
function slotOfSeat(seatId,period){for(var i=0;i<S.slots.length;i++){var x=S.slots[i];if(x.seatId===seatId&&x.period===period)return x;}return null;}
function slotCountOfSeat(seatId){var n=0;S.slots.forEach(function(x){if(x.seatId===seatId)n++;});return n;}
function seatName(id){for(var i=0;i<S.seats.length;i++){if(sameId(S.seats[i].id,id))return S.seats[i].name;}return '—';}
/* 场次队伍 = **派生**（唯一事实源是队伍级归台：seatId / order / session）。
   判据与后端 loadDerivedTeams 同口径：
     同赛台 && 同赛项 && 同组别 && 在册 && 该队参赛轮次覆盖本场次轮次；
   顺序 = 台内顺位（它就是现场叫号顺序）。
   独立场次（加时赛 / 重赛）不走派生 —— 它的队伍来自场内快照。 */
function slotTeams(sl){
  if(!sl)return [];
  if(isExtraSlot(sl))return (sl.snapshot||[]).map(function(x){return {no:x.no,name:x.name,school:x.school||'',temp:true};});
  var rn=Number(sl.round||roundOfPeriod(sl.period));
  return (S.teams||[]).filter(function(t){
    return t.eventId===sl.eventId&&t.group===sl.group&&sameId(t.seatId,sl.seatId)
      &&t.status!=='withdrawn'&&sessionHas(t.session,rn);
  }).sort(function(a,b){return (Number(a.order)||9999)-(Number(b.order)||9999);})
   .map(function(t){return {no:t.no,name:t.name,school:t.school||'',id:t.id,temp:false,
     session:(t.session||'both'),order:Number(t.order)||0};});
}
function addSeat(){
  var name=prompt('新赛台名称：','赛台 '+(S.seats.length+1));
  if(!name)return;
  S.seats.push({id:uid('seat'),name:String(name).trim()});
  logAudit('调赛台','新增赛台','—',String(name).trim(),'现场加开赛台');
  render();
}
function renameSeat(i){
  var s=S.seats[i];if(!s)return;
  var name=prompt('赛台名称：',s.name);if(!name)return;
  var before=s.name;s.name=String(name).trim();
  logAudit('调赛台','赛台改名',before,s.name,'运营调整');
  save();render();
}
function delSeat(id){
  var s=null;for(var i=0;i<S.seats.length;i++){if(S.seats[i].id===id){s=S.seats[i];break;}}
  if(!s)return;
  var used=slotCountOfSeat(id);
  if(!confirm('删除「'+s.name+'」？'+(used?('该赛台下 '+used+' 个场次将一并移除。'):'')))return;
  S.seats=S.seats.filter(function(x){return x.id!==id;});
  S.slots=S.slots.filter(function(x){return x.seatId!==id;});
  if(CUR_SLOT&&!slotById(CUR_SLOT))CUR_SLOT=null;
  logAudit('调赛台','删除赛台',s.name,'—','现场撤台');
  save();render();
}
function addSlot(seatId,period){
  var ev=S.events[0]||{id:'',groups:[]};
  var sl={id:uid('sl'),seatId:seatId,period:period,time:periodTime(period),eventId:ev.id,
          group:(ev.groups&&ev.groups[0])||'小学组',type:'normal',
          /* 轮次：默认按时间段绑定（上午=1、下午=2）；1 轮赛项排在下午时需手工改成 1 */
          round:roundOfPeriod(period),teams:[],snapshot:null};
  S.slots.push(sl);CUR_SLOT=sl.id;
  logAudit('调赛台','新增场次',seatName(seatId)+' · '+period,sl.group,'赛程编排');
  save();render();
}
function delSlot(id){
  var sl=slotById(id);if(!sl)return;
  if(!confirm('删除该场次？'))return;
  S.slots=S.slots.filter(function(x){return x.id!==id;});
  if(CUR_SLOT===id)CUR_SLOT=null;
  logAudit('调赛台','删除场次',sl.period+' · '+sl.group,'—','赛程调整');
  save();render();
}
function openSlot(id){CUR_SLOT=id;render();}
/* 非正式场次（加时赛 / 重赛）：独立场次，队伍来自场内快照，不参与派生、不写队伍主库。
   两者机制完全相同，只有「为什么打」不同 —— 判据一律走 isExtraSlot()，
   **不要**再写 sl.type==='extra'（新增类型时会漏点，且漏点不报错：独立场次会被当正式场次走派生）。 */
function isExtraSlot(sl){return !!sl&&(sl.type==='extra'||sl.type==='rematch');}
/* 参赛轮次判据 —— 与后端 model.TeamSession.Includes / Rounds 逐字同口径：
   'both' 两轮都打、'1' 只打第 1 轮、'2' 只打第 2 轮。
   场次队伍派生的匹配条件就是「该队参赛轮次覆盖本场次轮次」。 */
function sessionHas(v,rn){v=v||'both';return v==='both'||String(rn)===String(v);}
function sessionName(v){v=v||'both';return v==='1'?'仅第 1 轮':(v==='2'?'仅第 2 轮':'两轮');}
/* 时段 → 轮次的**默认**绑定（上午=1、下午=2）。只是默认值：
   赛项只有 1 轮时，那一场可能被排在下午，此时它仍是第 1 轮 —— 所以轮次落字段。 */
function roundOfPeriod(p){return p==='下午'?2:1;}
/* 归台比较一律走字符串：本地新建赛台是 uid（字符串），从后端拉回来的是数字 id ——
   用 === 比较就会出现「队伍明明排了台，界面却显示未排台」。 */
function sameId(a,b){return String(a==null?'':a)===String(b==null?'':b);}
function slotKindName(sl){if(!sl||!sl.type||sl.type==='normal')return '正式场次';return sl.type==='rematch'?'重赛':'加时赛';}
function slotSet(id,k,v){
  var sl=slotById(id);if(!sl)return;
  var before=String(sl[k]==null?'—':sl[k]);
  sl[k]=v;
  if(k==='type'){
    /* 场次类型切换：独立场次（加时赛 / 重赛）用场内快照；正式场次的队伍来自
       「队伍归台」**派生** —— 所以这里只维护快照，不再维护任何「场次队伍」列表
       （那套已废弃：写它等于造出第二套事实源，而与派生结果不一致时谁也说不清以哪边为准）。 */
    if(v&&v!=='normal'){sl.snapshot=sl.snapshot||[];}
    else{sl.snapshot=null;}
  }
  var label=(k==='eventId')?'赛项':(k==='group'?'组别':'场次类型');
  logAudit('调赛台','修改场次·'+label,before,String(v==null?'—':v),'赛程调整');
  save();render();
}
/* ---------- 归台同步到后端 ----------
   本地改完归台后推给后端（PUT /teams/{id}/seat）。两点必须说清：

   1) 只有**后端已存在**的队伍（bId）能推 —— 本地手工新增、还没「推送队伍到后端」的队伍
      没有 bId，改本地即可，等推送之后再对齐（否则要么 404，要么推出一支重号队伍）。
   2) 本地赛台 id 与后端赛台 id 不是一回事（本地新建的是 uid 字符串，后端是自己分配的数字），
      所以按**赛台名称**建一次映射并缓存，避免每次改派都多查一遍赛台列表。 */
var SEAT_BACKEND_MAP=null;
function loadSeatBackendMap(){
  if(SEAT_BACKEND_MAP)return Promise.resolve(SEAT_BACKEND_MAP);
  return backendFetch('/seats?limit=1000').then(function(r){
    var map={};
    if(r.ok&&r.body&&r.body.code===0){
      var bs=(r.body.data&&r.body.data.seats)||[];
      S.seats.forEach(function(s){
        for(var i=0;i<bs.length;i++){if(bs[i].name===s.name){map[String(s.id)]=bs[i].id;break;}}
      });
    }
    SEAT_BACKEND_MAP=map;
    return map;
  });
}
/* quiet=true 时不改状态条：一次自动分台会连推多队，逐队刷状态条没有意义 */
function pushTeamSeatToBackend(t,quiet){
  if(!backendMode||!t||!t.bId)return;
  loadSeatBackendMap().then(function(map){
    var bid=map[String(t.seatId==null?'':t.seatId)];
    var body=bid?{seatId:bid,seatOrder:Number(t.order)||1,reason:'现场调整赛台'}
                :{seatId:0,seatOrder:0,reason:'现场取消归台'};
    return backendFetch('/teams/'+t.bId+'/seat',{method:'PUT',body:body,timeout:8000});
  }).then(function(r){
    if(r&&r.ok===false){throw new Error((r.body&&r.body.message)||('HTTP '+r.status));}
    if(!quiet)setBackendStatus('online','归台已同步');
  }).catch(function(e){
    /* 后端不可用不阻断现场：本地已经改了，界面照常，只在状态条上提示一句 */
    if(!quiet)setBackendStatus('error','归台未同步到后端：'+(e&&e.message?e.message:'网络错误'));
  });
}

/* 一键自动分台：把该场次所在「赛项 + 组别 + 时段」的队伍按**编号升序**轮流铺到各张赛台。
   写的是**队伍级归台**（seatId / order），不是场次队伍 —— 场次队伍由派生得到，
   写场次等于造出第二套事实源。算法与后端 AutoAssignSlot 同口径。 */
function autoAssignSeats(slotId){
  var sl=slotById(slotId);if(!sl)return;
  if(isExtraSlot(sl)){alert(slotKindName(sl)+'场次请用「导入队伍编号」建立场内快照，不参与自动分台。');return;}
  var targets=S.slots.filter(function(x){return x.period===sl.period&&!isExtraSlot(x)&&x.eventId===sl.eventId&&x.group===sl.group;});
  if(!targets.length){alert('该时段没有同赛项同组别的可用场次，请先配置赛台场次。');return;}
  var pool=S.teams.filter(function(t){return t.eventId===sl.eventId&&t.group===sl.group&&t.status!=='withdrawn';});
  if(!pool.length){alert('该赛项该组别没有在册队伍。');return;}
  /* 编号升序：真实赛制应以 WRC 叫号表为序，叫号表尚未接入，编号序是当前唯一确定且可解释的顺序 */
  pool.sort(function(a,b){return String(a.no).localeCompare(String(b.no),'zh');});
  var counts={};
  targets.forEach(function(x){counts[String(x.seatId)]=0;});
  pool.forEach(function(t,i){
    var x=targets[i%targets.length];
    counts[String(x.seatId)]++;
    t.seatId=String(x.seatId);
    t.order=counts[String(x.seatId)];
    pushTeamSeatToBackend(t,true);
  });
  var detail=targets.map(function(x){return seatName(x.seatId)+' '+counts[String(x.seatId)]+' 队';}).join('；');
  logAudit('调赛台','自动分台',pool.length+' 支待分配',detail,'按编号升序均衡到各赛台');
  if(backendMode)setBackendStatus('online','已按编号自动分台，归台同步中');
  save();render();
}
/* 手动改派：把队伍归到另一张赛台（顺位续在该台同赛项同组别的末尾）。
   ⚠️ 改的是**队伍归台**，不是「场次队伍」—— 场次队伍是派生的，改场次不会真的生效。 */
function moveTeamToSeat(teamId,seatId){
  if(!seatId)return;
  var t=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].id===teamId){t=S.teams[i];break;}}
  if(!t)return;
  if(sameId(t.seatId,seatId))return;
  var from=t.seatId||'';
  t.seatId=String(seatId);
  var max=0;
  S.teams.forEach(function(x){
    if(sameId(x.seatId,seatId)&&x.eventId===t.eventId&&x.group===t.group&&Number(x.order)>max)max=Number(x.order);
  });
  t.order=max+1;
  pushTeamSeatToBackend(t);
  logAudit('调赛台','手动改派赛台',t.name+' @ '+(from?seatName(from):'未排台'),seatName(seatId),'现场调度');
  save();render();
}
/* 清空：正式场次 = 取消这些队伍的归台（它们回到「未排台」），独立场次 = 清空场内快照。
   注意不能只清「本场次」——场次没有自己的队伍列表，队伍是派生出来的。 */
function clearSlotTeams(slotId){
  var sl=slotById(slotId);if(!sl)return;
  var n=0;
  if(isExtraSlot(sl)){
    n=(sl.snapshot||[]).length;sl.snapshot=[];
  }else{
    var rn=Number(sl.round||roundOfPeriod(sl.period));
    S.teams.forEach(function(t){
      if(t.eventId===sl.eventId&&t.group===sl.group&&sameId(t.seatId,sl.seatId)&&sessionHas(t.session,rn)){
        t.seatId='';t.order=0;n++;
        pushTeamSeatToBackend(t,true);
      }
    });
  }
  logAudit('调赛台',isExtraSlot(sl)?('清空'+slotKindName(sl)+'快照'):'取消场次归台',
    sl.period+' · '+sl.group,n+' 支','重新编排');
  save();render();
}
function importExtraTeams(slotId){
  var sl=slotById(slotId);if(!sl)return;
  var ta=document.getElementById('extraText');if(!ta)return;
  var lines=ta.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length){alert('请粘贴队伍编号（每行一个，可写作「编号,队伍名」）。');return;}
  sl.snapshot=sl.snapshot||[];
  var added=0,skip=0;
  lines.forEach(function(l){
    var p=l.split(/[,，\t]/).map(function(s){return s.trim();});
    var no=p[0];if(!no)return;
    if(sl.snapshot.some(function(x){return x.no===no;})){skip++;return;}
    var mt=null;for(var i=0;i<S.teams.length;i++){if(S.teams[i].no===no){mt=S.teams[i];break;}}
    sl.snapshot.push({no:no,name:p[1]||(mt?mt.name:'临时队'),school:mt?mt.school:'',coach:mt?mt.coach:''});
    added++;
  });
  logAudit('调赛台','加时赛导入队伍','—',added+' 支（场内快照）','仅影响冠亚季军/晋级时启用，不写入主库');
  alert('已导入 '+added+' 支为场内快照'+(skip?('，跳过重复 '+skip+' 支'):'')+'。\n快照仅在本次加时赛场次内生效，不写入队伍主库。');
  save();render();
}

/* ---------- 视图 9：现场大屏（分页轮播） ---------- */
var SCREEN={eventId:'brain_planet',page:0,playing:false,timer:null,locked:false,mode:'live'};
function maskPerson(n){
  n=String(n==null?'':n).trim();
  if(!n)return '';
  if(n.length<=1)return n;
  return n.charAt(0)+new Array(Math.min(n.length-1,2)+1).join('*');
}
function maskMembers(m){
  var arr=String(m==null?'':m).split(/[\/、,，|]/).map(function(s){return s.trim();}).filter(Boolean);
  if(!arr.length)return '—';
  return arr.map(maskPerson).join(' / ');
}
function screenRows(evId){
  return standings(evId).map(function(r){
    return {rank:r.rank,name:r.team.name,school:r.team.school||'—',group:r.team.group,
            members:maskMembers(r.team.members),award:r.award||'—'};
  });
}
function screenPages(){
  var rows=SCREEN.mode==='publish'?publishScreenRows(SCREEN.eventId):screenRows(SCREEN.eventId);
  var per=Number((S.screen&&S.screen.pageSize)||10);
  var pages=[];
  for(var i=0;i<rows.length;i+=per)pages.push(rows.slice(i,i+per));
  return pages.length?pages:[[]];
}
function screenStep(dir){
  var pages=screenPages();
  if(!pages.length)return;
  SCREEN.page=(SCREEN.page+(dir||1)+pages.length)%pages.length;
  render();
}
function screenPlay(){
  if(SCREEN.locked){alert('已锁定本屏，请先解除锁定再播放。');return;}
  if(SCREEN.timer)clearInterval(SCREEN.timer);
  SCREEN.playing=true;
  var sec=Number((S.screen&&S.screen.interval)||60);
  SCREEN.timer=setInterval(function(){screenStep(1);},sec*1000);
  render();
}
function screenPause(){
  if(SCREEN.timer){clearInterval(SCREEN.timer);SCREEN.timer=null;}
  SCREEN.playing=false;
  render();
}
function screenToggleLock(){
  SCREEN.locked=!SCREEN.locked;
  if(SCREEN.locked&&SCREEN.timer){clearInterval(SCREEN.timer);SCREEN.timer=null;SCREEN.playing=false;}
  logAudit('调赛台',SCREEN.locked?'大屏锁定本屏':'大屏解除锁定','—','—',SCREEN.locked?'现场异常需固定展示':'恢复自动轮播');
  render();
}
function screenSetEvent(id){SCREEN.eventId=id;SCREEN.page=0;render();}
function screenSetInterval(v){S.screen.interval=Number(v)||60;save();if(SCREEN.playing)screenPlay();else render();}
function screenSetMode(m){SCREEN.mode=m;if(SCREEN.timer){clearInterval(SCREEN.timer);SCREEN.timer=null;SCREEN.playing=false;}SCREEN.page=0;render();}
function publishScreenRows(evId){
  return standings(evId).map(function(r){
    var name=PUB_ANON?('参赛队 '+r.rank):r.team.name;
    return {rank:r.rank,name:name,school:r.team.school||'—',group:r.team.group||'—',total:r.total,award:r.award||'—'};
  });
}
function viewScreen(){
  var isPub=SCREEN.mode==='publish';
  var opts=S.events.map(function(e){return '<option value="'+e.id+'" '+(e.id===SCREEN.eventId?'selected':'')+'>'+esc(e.name)+'</option>';}).join('');
  var pages=screenPages();
  if(SCREEN.page>=pages.length)SCREEN.page=0;
  var page=pages[SCREEN.page]||[];
  var ev=find(SCREEN.eventId)||{name:'—'};
  var rowsHtml=page.map(function(r){
    if(isPub){
      return '<div class="screen-row"><div class="rk">'+r.rank+'</div><div class="tm">'+esc(r.name)+'</div>'+
        '<div class="sc">'+esc(r.school)+' · '+esc(r.group)+'</div>'+
        '<div class="sc" style="flex:1.1;color:#cfe3f7">总分 '+Number(r.total).toFixed(1)+'</div>'+
