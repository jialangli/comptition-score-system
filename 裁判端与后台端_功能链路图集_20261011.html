<script>
/* ---------- 渲染器：图数据 → SVG ----------
   节点文本语法："标题 | 修饰 | 修饰"
     修饰 ok:xx / warn:xx / dim:xx → 右侧 pill；hub / warn → 节点形态
   levels: 每层一行（自动层间汇流连线）；X 数组: 挂在某节点正下方的补充节点 */
function renderFig(d){
  var W=880, G=26, NH=46, NH2=64, LG=46, XH=58;
  var lv=d.levels, rows=[], y=8, i, j, k;
  for(i=0;i<lv.length;i++){
    var n=lv[i].length, h=0, cells=[];
    for(j=0;j<n;j++){
      var spec=lv[i][j].split('|'), t=spec[0], sub='', pill=null, cls='';
      for(k=1;k<spec.length;k++){
        var m=spec[k].trim();   /* 数据里「标题 | ok:已实现」的竖线两侧有空格 —— 不 trim 全部 pill 都会静默丢失 */
        if(m==='hub')cls='hub';
        else if(m==='warn')cls='warn';
        else if(/^ok:/.test(m))pill={t:m.slice(3),c:'ok'};
        else if(/^warn:/.test(m))pill={t:m.slice(5),c:'warn'};
        else if(/^dim:/.test(m))pill={t:m.slice(4),c:'dim'};
        else if(/^sub:/.test(m))sub=m.slice(4);
      }
      if(sub)cls=cls||'';
      cells.push({t:t,sub:sub,pill:pill,cls:cls});
    }
    var rowH=(cells.some(function(c){return c.sub;})?NH2:NH);
    rows.push({y:y,h:rowH,n:n,cells:cells,cw:W/n});
    y+=rowH+LG;
  }
  /* extra 节点：挂在指定节点正下方 */
  var extras=[];
  (d.X||[]).forEach(function(x){
    var r=rows[x.lv], cx=r.cw*x.i+r.cw/2;
    extras.push({x:cx-260/2,y:r.y+r.h+LG-10,t:x.t,sub:x.sub||'',warn:x.warn!==false,green:x.green===true});
    r.extraBelow=true;
    y=Math.max(y, r.y+r.h+LG-10+XH+LG-36+LG);
  });
  var H=y- LG+14;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#ffffff"/>';
  /* 连线（层间汇流） */
  for(i=0;i<rows.length-1;i++){
    var a=rows[i], b=rows[i+1], y1=a.y+a.h, y2=b.y, mid=(y1+y2)/2;
    var xs1=[],xs2=[];
    for(j=0;j<a.n;j++)xs1.push(a.cw*j+a.cw/2);
    for(j=0;j<b.n;j++)xs2.push(b.cw*j+b.cw/2);
    var lo=Math.min.apply(null,xs1.concat(xs2)), hi=Math.max.apply(null,xs1.concat(xs2));
    var p='';
    xs1.forEach(function(x){p+='M'+x+' '+y1+' V'+mid+' ';});
    p+='M'+lo+' '+mid+' H'+hi+' ';
    xs2.forEach(function(x){p+='M'+x+' '+mid+' V'+(y2-7)+' ';});
    s+='<path d="'+p+'" fill="none" stroke="#a0aec0" stroke-width="1.4"/>';
    xs2.forEach(function(x){s+='<polygon points="'+(x-4.5)+','+(y2-7)+' '+(x+4.5)+','+(y2-7)+' '+x+','+y2+'" fill="#a0aec0"/>';});
  }
  /* extra 连线（父节点直下） */
  (d.X||[]).forEach(function(x){
    var r=rows[x.lv], cx=r.cw*x.i+r.cw/2, y1=r.y+r.h+LG-10;
    var lc=x.warn!==false?'#d69e2e':(x.green===true?'#9ae6b4':'#a0aec0');
    s+='<path d="M'+cx+' '+(y1-16)+' V'+(y1-23+16)+'" fill="none" stroke="'+lc+'" stroke-width="1.4"/>';
    s+='<polygon points="'+(cx-4.5)+','+(y1-8)+' '+(cx+4.5)+','+(y1-8)+' '+cx+','+y1+'" fill="'+lc+'"/>';
  });
  /* 节点 */
  rows.forEach(function(r){
    r.cells.forEach(function(c,j){
      var x=r.cw*j+G/2, w=r.cw-G, h=r.h, cx=r.cw*j+r.cw/2;
      var fill='#ffffff', ln='#cbd5e0', ink='#2d3748';
      if(c.cls==='hub'){fill='#f1f3f5';ln='#a0aec0';}
      if(c.cls==='warn'){fill='var(--warnbg)'.replace('var(--warnbg)','#fdf6e3');ln='#d69e2e';ink='#7b341e';}
      s+='<rect x="'+x+'" y="'+r.y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+fill+'" stroke="'+ln+'"/>';
      var pw=c.pill?(c.pill.t.length*12+16):0, px=x+w-pw-10;
      /* 文本自适应缩字号：中文按 1.02em/字估宽，避免长文案溢出节点 */
      function fit(t,base){var avail=w-(pw?pw+34:20);var fs=base;while(t.length*fs*1.02>avail&&fs>9)fs-=0.5;return fs;}
      var ty=c.sub?(r.y+h/2-7):(r.y+h/2+5);
      var tx=c.pill?(x+14):(cx);
      s+='<text x="'+tx+'" y="'+ty+'" font-size="'+fit(c.t,13.5)+'" fill="'+ink+'" '+(c.pill?'':'text-anchor="middle"')+(c.pill?'':' font-weight="600"')+'>'+esc(c.t)+'</text>';
      if(c.sub)s+='<text x="'+tx+'" y="'+(ty+17)+'" font-size="'+fit(c.sub,11.5)+'" fill="#718096">'+esc(c.sub)+'</text>';
      if(c.pill){
        var pc=c.pill.c==='ok'?['#e6fffa','#2f855a','#bfe8cc']:c.pill.c==='warn'?['#fdecd2','#7b341e','#d69e2e']:['#edf2f7','#718096','#e2e8f0'];
        s+='<rect x="'+px+'" y="'+(r.y+h/2-11)+'" width="'+pw+'" height="21" rx="10.5" fill="'+pc[0]+'" stroke="'+pc[2]+'"/>';
        s+='<text x="'+(px+pw/2)+'" y="'+(r.y+h/2+4)+'" font-size="11.5" fill="'+pc[1]+'" text-anchor="middle">'+esc(c.pill.t)+'</text>';
      }
    });
  });
  /* extra 节点本体 */
  extras.forEach(function(e){
    var fill=e.warn?'#fdf6e3':(e.green?'#f0fff4':'#f1f3f5');
    var stroke=e.warn?'#d69e2e':(e.green?'#9ae6b4':'#cbd5e0');
    var tc=e.warn?'#7b341e':(e.green?'#276749':'#2d3748');
    s+='<rect x="'+e.x+'" y="'+e.y+'" width="260" height="46" rx="8" fill="'+fill+'" stroke="'+stroke+'"/>';
    s+='<text x="'+(e.x+130)+'" y="'+(e.y+19)+'" font-size="12.5" fill="'+tc+'" text-anchor="middle">'+esc(e.t)+'</text>';
    if(e.sub)s+='<text x="'+(e.x+130)+'" y="'+(e.y+36)+'" font-size="11" fill="#718096" text-anchor="middle">'+esc(e.sub)+'</text>';
  });
  return s+'</svg>';
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    lastSide=d.s;
    html+='<h2 id="side-'+d.s+'">'+(d.s==='bg'?'第一部分 · 后台端':'第二部分 · 裁判端（平板 · 设计稿）')+
      '<span class="cnt">'+FIGS.filter(function(x){return x.s===d.s;}).length+' 张</span></h2>';
  }
  toc+='<a href="#fig-'+d.id+'">'+no+'. '+esc(d.t)+'</a>';
  var nts=(d.notes||[]).map(function(x){return '<div class="note">'+esc(x)+'</div>';}).join('');
  html+='<div class="fig" id="fig-'+d.id+'"><h3>'+no+'. '+esc(d.t)+
    ' <span class="pill dim">'+sideName[d.s]+'</span></h3><div class="scope">'+esc(d.scope)+'</div>'+
    renderFig(d)+nts+'</div>';
});
document.getElementById('toc').innerHTML=toc;
document.getElementById('figs').innerHTML=html;
</script>
</body>
</html>
